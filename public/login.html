<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Secure Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --kilrr-orange: #ea580c;
            --bg-deep: #020617; /* Deep Slate/Navy Black */
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --success-green: #059669;
        }
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background-color: var(--bg-deep);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 🪐 Massive Background Logo Watermark */
        .bg-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 1000px;
            opacity: 0.02; /* Extremely subtle and cinematic */
            pointer-events: none;
            z-index: 0;
            filter: grayscale(100%) contrast(200%);
        }

        /* ✨ Slow Floating Cinematic Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            animation: float 25s infinite ease-in-out alternate;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: rgba(234, 88, 12, 0.35); /* Kilrr Orange Glow */
            top: -10%; left: 10%;
        }
        .orb-2 {
            width: 600px; height: 600px;
            background: rgba(56, 189, 248, 0.15); /* Tech Blue Glow */
            bottom: -20%; right: 5%;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 80px) scale(1.1); }
        }

        /* 🧊 Glassmorphism Login Card */
        .login-card {
            position: relative; z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 60px 50px;
            width: 90%; max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            transition: all 0.4s ease;
        }
        
        .login-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--kilrr-orange), transparent);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            opacity: 0.8;
        }

        .brand-container { margin-bottom: 40px; }
        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px; font-weight: 900; color: #ffffff;
            margin: 0 0 5px 0; letter-spacing: 2px; text-transform: uppercase;
        }
        .brand-title span { color: var(--kilrr-orange); }
        .subtitle {
            color: #94a3b8; font-size: 14px; font-weight: 600;
            letter-spacing: 3px; text-transform: uppercase;
        }

        /* 🎯 Terminal-Style Input */
        .input-group { position: relative; margin-bottom: 35px; text-align: left; }
        .input-group label {
            display: block; color: #94a3b8; font-size: 12px; font-weight: 800;
            margin-bottom: 10px; letter-spacing: 1.5px; text-transform: uppercase;
        }
        .input-group input {
            width: 100%; padding: 20px; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4); 
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; color: #ffffff; 
            font-size: 24px; font-family: 'Space Grotesk', monospace; font-weight: 700;
            letter-spacing: 8px; text-align: center;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none; border-color: var(--kilrr-orange);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.2);
        }
        .input-group input::placeholder { color: #334155; letter-spacing: 4px; font-size: 18px;}

        /* 🚀 Action Button */
        .btn-login {
            width: 100%; padding: 22px;
            background: var(--kilrr-orange); color: #ffffff;
            border: none; border-radius: 16px;
            font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(234, 88, 12, 0.4);
        }
        .btn-login:active { transform: translateY(0); }

        #error-msg {
            color: #ef4444; font-size: 13px; font-weight: 800;
            margin-top: 25px; letter-spacing: 1px; min-height: 20px; 
            display: none; text-transform: uppercase;
            background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @media (max-width: 480px) {
            .login-card { padding: 50px 30px; width: 85%; }
            .brand-title { font-size: 36px; }
            .input-group input { font-size: 20px; padding: 18px;}
        }
    </style>
</head>
<body>
    <!-- Massive Watermark Logo -->
    <img src="logo.png" class="bg-logo" alt="Kilrr" onerror="this.style.display='none'">
    
    <!-- Atmospheric Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <!-- Glass Terminal -->
    <div class="login-card" id="terminal">
        <div class="brand-container">
            <h1 class="brand-title">Kilrr <span>OS</span></h1>
            <div class="subtitle">Secure Factory Node</div>
        </div>
        
        <div class="input-group">
            <label>Authorization Pin</label>
            <input type="password" id="passInput" placeholder="••••" autocomplete="off">
        </div>
        
        <button class="btn-login" onclick="attemptLogin()" id="loginBtn">Initiate Link</button>
        <div id="error-msg">⚠️ Access Denied. Invalid PIN.</div>
    </div>

    <script>
        // Auto-focus the input immediately for speed
        window.onload = () => setTimeout(() => document.getElementById('passInput').focus(), 100);

        // Allow 'Enter' key to submit
        document.getElementById('passInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });

        async function attemptLogin() {
            const pass = document.getElementById('passInput').value;
            const errBox = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');
            const terminal = document.getElementById('terminal');

            if(!pass) return;

            // Visual loading state
            btn.innerText = "AUTHENTICATING...";
            btn.style.opacity = "0.7";

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });

            const data = await res.json();
            
            if (data.success) {
                errBox.style.display = 'none';
                btn.innerText = "LINK ESTABLISHED";
                btn.style.background = "var(--success-green)";
                btn.style.opacity = "1";
                btn.style.boxShadow = "0 15px 35px rgba(5, 150, 105, 0.4)";
                
                // Cool fade out animation before redirect
                setTimeout(() => {
                    terminal.style.transform = "scale(0.95)";
                    terminal.style.opacity = "0";
                }, 400);

                setTimeout(() => window.location.href = "index.html", 800);
            } else {
                // Reset button and show error
                btn.innerText = "INITIATE LINK";
                btn.style.opacity = "1";
                errBox.style.display = 'block';
                
                // Shake animation for error
                terminal.style.transform = "translateX(-10px)";
                setTimeout(() => terminal.style.transform = "translateX(10px)", 50);
                setTimeout(() => terminal.style.transform = "translateX(-10px)", 100);
                setTimeout(() => terminal.style.transform = "translateX(10px)", 150);
                setTimeout(() => terminal.style.transform = "translateX(0)", 200);

                document.getElementById('passInput').value = '';
                document.getElementById('passInput').focus();
            }
        }
    </script>
</body>
</html>
