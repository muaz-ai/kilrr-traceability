<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr OS - Master Data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 50px;}
        
        .nav-top { background: var(--navy-command); border-bottom: 4px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; padding: 8px 12px; border-radius: 8px;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white;}
        .nav-btn.active { color: white; background: var(--kilrr-orange);}

        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;}
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; position: relative;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--navy-command); border-radius: 16px 16px 0 0;}
        .card.card-orange::before { background: var(--kilrr-orange); }

        h2 { margin: 0 0 15px 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; text-transform: uppercase; color: var(--navy-command);}
        label { font-weight: 800; font-size: 12px; color: #64748b; display: block; margin-bottom: 6px; text-transform: uppercase;}

        input { width: 100%; padding: 14px 15px; box-sizing: border-box; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 15px; font-weight: 700; font-family: 'Inter', sans-serif; margin-bottom: 20px; background: #f8fafc; transition: 0.2s ease;}
        input:focus { border-color: var(--kilrr-orange); outline: none; background: white;}
        
        button { width: 100%; padding: 16px; border: none; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; background: var(--kilrr-orange); color: white; transition: 0.1s;}
        button:active { transform: translateY(2px); }
        button.btn-dark { background: var(--navy-command); }

        .row { display: flex; gap: 15px; }

        .recipe-list { max-height: 400px; overflow-y: auto; margin-top: 20px; padding-right: 5px;}
        .recipe-pill { background: #f8fafc; border: 1px solid #cbd5e1; padding: 15px; border-radius: 10px; margin-bottom: 10px;}
        .recipe-name { font-weight: 900; font-size: 16px; color: var(--navy-command); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
        .ing-codes { font-family: monospace; font-weight: bold; color: var(--kilrr-orange); font-size: 13px;}
        .btn-delete { background: #f1f5f9; color: var(--danger-red); border: 2px solid #cbd5e1; padding: 4px 10px; font-size: 12px; width: auto; border-radius: 6px;}

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; margin-top: 15px; gap: 20px;}
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; justify-content: space-around; overflow-x: auto; white-space: nowrap; border-top: 3px solid var(--kilrr-orange); border-bottom: none; z-index: 999;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 8px 12px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; margin-bottom: 4px;}
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn active">Master</a>
        </div>
    </nav>

    <div class="container">
        <div>
            <div class="card" style="margin-bottom: 30px;">
                <h2>Raw Materials</h2>
                <div class="row">
                    <div style="flex:1;">
                        <label>Code (e.g. SALT)</label>
                        <input type="text" id="mat_code" style="text-transform: uppercase;">
                    </div>
                    <div style="flex:2;">
                        <label>Name</label>
                        <input type="text" id="mat_name">
                    </div>
                </div>
                <button onclick="saveMaterial()">Save Material</button>
            </div>

            <div class="card">
                <h2>Approved Vendors</h2>
                <div class="row">
                    <div style="flex:1;">
                        <label>Code (e.g. V-01)</label>
                        <input type="text" id="ven_code" style="text-transform: uppercase;">
                    </div>
                    <div style="flex:2;">
                        <label>Vendor Name</label>
                        <input type="text" id="ven_name">
                    </div>
                </div>
                <button onclick="saveVendor()">Save Vendor</button>
            </div>
        </div>

        <div class="card card-orange">
            <h2>Recipe Validation Matrix</h2>
            <div style="background: #fff7ed; color: var(--kilrr-orange); padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 20px;">
                ⚠️ Updating an existing recipe will completely replace its ingredients. To delete a recipe, just leave the ingredients box blank and hit update!
            </div>
            
            <label>Master Flavour Profile (FG Name / Code)</label>
            <input type="text" id="rec_fg" placeholder="E.g. Gangs of Awadh">
            
            <label>Required Ingredient Codes (Comma Separated)</label>
            <input type="text" id="rec_ing" placeholder="E.g. GIN, GAR, ONI" style="text-transform: uppercase;">
            
            <label>Manager PIN</label>
            <input type="password" id="rec_pin" placeholder="****">
            
            <button class="btn-dark" onclick="updateRecipe()">Update Master Recipe</button>

            <h3 style="font-family:'Space Grotesk'; font-size:16px; margin-top:30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Active Recipes</h3>
            <div class="recipe-list" id="active_recipes_list">Loading...</div>
        </div>
    </div>

    <script>
        window.onload = loadActiveRecipes;

        async function saveMaterial() {
            const code = document.getElementById('mat_code').value.trim().toUpperCase();
            const name = document.getElementById('mat_name').value.trim();
            if(!code || !name) return alert("Fill both fields");
            
            try {
                const res = await fetch('/add-ingredient', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code, name})});
                const data = await res.json();
                if(data.status==='success') { 
                    alert("Material Saved!"); 
                    document.getElementById('mat_code').value = ''; document.getElementById('mat_name').value = '';
                }
            } catch(e) { alert("Error saving material"); }
        }

        async function saveVendor() {
            const code = document.getElementById('ven_code').value.trim().toUpperCase();
            const name = document.getElementById('ven_name').value.trim();
            if(!code || !name) return alert("Fill both fields");
            
            try {
                const res = await fetch('/add-vendor', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code, name})});
                const data = await res.json();
                if(data.status==='success') { 
                    alert("Vendor Saved!"); 
                    document.getElementById('ven_code').value = ''; document.getElementById('ven_name').value = '';
                }
            } catch(e) { alert("Error saving vendor"); }
        }

        async function updateRecipe() {
            const fg_code = document.getElementById('rec_fg').value.trim();
            const ingredients = document.getElementById('rec_ing').value.trim();
            const pin = document.getElementById('rec_pin').value.trim();
            
            if(!fg_code) return alert("Target Product Name is required.");
            if(pin !== "1234") return alert("Invalid PIN.");

            try {
                const res = await fetch('/update-recipe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({fg_code, ingredients, pin})});
                const data = await res.json();
                if(data.status==='success') { 
                    alert("Recipe Updated Successfully!"); 
                    document.getElementById('rec_fg').value = ''; document.getElementById('rec_ing').value = ''; document.getElementById('rec_pin').value = '';
                    loadActiveRecipes();
                } else {
                    alert(data.error);
                }
            } catch(e) { alert("Error updating recipe."); }
        }

        async function loadActiveRecipes() {
            try {
                const res = await fetch('/get-recipes');
                const rawRecipes = await res.json();
                
                // Group by FG Code
                const grouped = {};
                rawRecipes.forEach(r => {
                    if(!grouped[r.fg_code]) grouped[r.fg_code] = [];
                    if(r.ingredient_code) grouped[r.fg_code].push(r.ingredient_code);
                });

                const list = document.getElementById('active_recipes_list');
                if(Object.keys(grouped).length === 0) {
                    list.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:bold; padding:20px;">No recipes configured yet.</div>`;
                    return;
                }

                list.innerHTML = Object.keys(grouped).map(fg => `
                    <div class="recipe-pill">
                        <div class="recipe-name">
                            ${fg}
                            <button class="btn-delete" onclick="quickEdit('${fg}', '${grouped[fg].join(', ')}')">✎ EDIT</button>
                        </div>
                        <div class="ing-codes">${grouped[fg].join(', ') || '<span style="color:var(--danger-red);">BROKEN LINK - PLEASE EDIT</span>'}</div>
                    </div>
                `).join('');

            } catch(e) {
                document.getElementById('active_recipes_list').innerHTML = "Failed to load recipes.";
            }
        }

        function quickEdit(fg, ings) {
            document.getElementById('rec_fg').value = fg;
            document.getElementById('rec_ing').value = ings;
            document.getElementById('rec_pin').focus();
        }
    </script>
</body>
</html>
