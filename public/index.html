<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr - Factory Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --border-heavy: #cbd5e1; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding-bottom: 80px; position: relative; overflow-x: hidden; min-height: 100vh; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; pointer-events: none;}
        .orb-1 { width: 600px; height: 600px; background: rgba(234, 88, 12, 0.35); top: -100px; left: -150px; }
        .orb-2 { width: 700px; height: 700px; background: rgba(56, 189, 248, 0.25); bottom: -200px; right: -150px; }
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 90px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.15); overflow-x: auto;}
        .brand { display: flex; align-items: center; gap: 15px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px;}
        .brand img { height: 45px; background: white; padding: 5px; border-radius: 8px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 8px; align-items: center; white-space: nowrap;}
        .nav-btn { text-decoration: none; padding: 14px 22px; color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; border-radius: 8px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
        .nav-btn.active { color: #ffffff; background: var(--kilrr-orange); box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4); }
        .nav-btn.logout { color: #fca5a5; border: 2px solid #ef4444; padding: 12px 20px;} 
        .nav-btn.logout:hover { background: #ef4444; color: #ffffff; }
        
        .container { max-width: 1400px; margin: 80px auto; padding: 0 40px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; margin-top: 60px; }
        
        .app-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border: 3px solid var(--border-heavy); border-radius: 24px; padding: 60px 30px; text-decoration: none; color: #0f172a; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .app-card:hover { transform: translateY(-10px); border-color: var(--kilrr-orange); box-shadow: 0 30px 60px rgba(234,88,12,0.2); }
        .icon { font-size: 70px; background: #fff7ed; padding: 25px; border-radius: 24px; border: 3px solid #ffedd5; color: var(--kilrr-orange); display: flex; justify-content: center; align-items: center; height: 90px; width: 90px;}
        .title { font-weight: 900; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Space Grotesk', sans-serif;}
        /* 🔥 MOBILE APP INTERFACE UPGRADE 🔥 */
        @media (max-width: 768px) {
            body { padding-bottom: 100px; padding-top: 15px; }
            .nav-top { 
                position: fixed; 
                top: auto; 
                bottom: 0; 
                left: 0; 
                right: 0; 
                height: 75px; 
                padding: 0 10px; 
                border-bottom: none; 
                border-top: 4px solid var(--kilrr-orange); 
                justify-content: center;
                box-shadow: 0 -10px 20px rgba(0,0,0,0.15);
            }
            .brand { display: none; /* Hide logo on mobile to save space for buttons */ }
            .nav-links { 
                width: 100%; 
                justify-content: space-between; 
                overflow-x: auto; 
                -webkit-overflow-scrolling: touch; 
                padding-bottom: 5px;
            }
            .nav-btn { 
                font-size: 13px; 
                padding: 10px 12px; 
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }
            .nav-btn.logout { display: none; /* Hide exit on mobile nav bar */ }
            
            /* Add Mobile Icons using CSS content */
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 18px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 18px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 18px; }
            
            .card { padding: 25px; margin: 15px auto; border-radius: 16px;}
            h2 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
    <nav class="nav-top">
        <a href="index.html" class="brand"><img src="logo.png" alt="Kilrr" onerror="this.style.display='none'"><span>Factory</span> OS</a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn active">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inwarding</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="audit.html" class="nav-btn">Audit</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master Data</a>
            <a href="/api/logout" class="nav-btn logout">Exit</a>
        </div>
    </nav>
    <div class="container">
        <h1 style="font-family:'Space Grotesk', sans-serif; font-size:48px; color:var(--navy-command); text-transform:uppercase; letter-spacing: 2px; margin-bottom: 10px;">Select Module</h1>
        <p style="color: #475569; font-size: 22px; font-weight: 800; margin-top: 0; text-transform:uppercase; letter-spacing:1px;">Kilrr Enterprise Traceability</p>
        <div class="grid">
            <a href="inwarding.html" class="app-card"><div class="icon">📦</div><span class="title">RM Inwarding</span></a>
            <a href="preprocess.html" class="app-card" style="border-color: var(--kilrr-orange);"><div class="icon">🔥</div><span class="title">Pre-Process</span></a>
            <a href="scanner.html" class="app-card"><div class="icon">🏭</div><span class="title">Batch Scanner</span></a>
            <a href="audit.html" class="app-card"><div class="icon">📋</div><span class="title">Stock Audit</span></a>
            <a href="dashboard.html" class="app-card"><div class="icon">📊</div><span class="title">Dashboard</span></a>
            <a href="master.html" class="app-card"><div class="icon">⚙️</div><span class="title">Master Data</span></a>
        </div>
    </div>
</body>
</html>
