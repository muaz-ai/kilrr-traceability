<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Traceability - Stock Audit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --card-white: rgba(255, 255, 255, 0.95); --text-dark: #0f172a; --text-mid: #334155; --border-heavy: #cbd5e1; --success-green: #059669; --danger-red: #dc2626; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-dark); margin: 0; padding-bottom: 80px; position: relative; overflow-x: hidden; min-height: 100vh; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; pointer-events: none;}
        .orb-1 { width: 600px; height: 600px; background: rgba(234, 88, 12, 0.35); top: -100px; left: -150px; }
        .orb-2 { width: 700px; height: 700px; background: rgba(56, 189, 248, 0.25); bottom: -200px; right: -150px; }
        
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 90px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.15);}
        .brand { display: flex; align-items: center; gap: 15px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px;}
        .brand img { height: 45px; background: white; padding: 5px; border-radius: 8px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 8px; align-items: center; white-space: nowrap;}
        .nav-btn { text-decoration: none; padding: 14px 22px; color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; border-radius: 8px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
        .nav-btn.active { color: #ffffff; background: var(--kilrr-orange); }
        .nav-btn.logout { color: #fca5a5; border: 2px solid #ef4444; padding: 12px 20px;} 
        
        .container { max-width: 1500px; margin: 40px auto; padding: 0 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;}
        .card { background: var(--card-white); backdrop-filter: blur(20px); border: 2px solid var(--border-heavy); border-radius: 20px; padding: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .card-left::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--navy-command); }
        .card-right::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--kilrr-orange); }

        h2 { margin: 0 0 35px 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; padding-bottom: 20px;}
        label { display: block; font-size: 16px; font-weight: 800; color: var(--text-mid); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        input, select { width: 100%; padding: 22px; box-sizing: border-box; border-radius: 12px; border: 3px solid var(--border-heavy); font-size: 20px; font-family: 'Inter', sans-serif; font-weight: 700; background: #ffffff; margin-bottom: 30px;}
        input:focus, select:focus { border-color: var(--kilrr-orange); outline: none; box-shadow: 0 0 0 5px rgba(234, 88, 12, 0.15); }

        button { width: 100%; padding: 25px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .btn-primary { background: var(--kilrr-orange); color: #ffffff; box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3); }

        .manual-box { background: #f8fafc; padding: 40px; border: 3px dashed var(--border-heavy); border-radius: 20px; margin-bottom: 30px; text-align: center; }
        .hybrid-input-row { display: flex; gap: 20px; }
        .manual-box input { border-color: var(--navy-command); margin: 0; text-align: center; font-size: 24px; text-transform: uppercase;}
        .btn-add-manual { background: var(--navy-command); width: auto; padding: 0 40px; margin: 0; border-radius: 12px; color: white;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 12px; overflow: hidden; border: 2px solid var(--border-heavy);}
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: var(--navy-command); color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;}
        tr:nth-child(even) { background-color: #f8fafc; }

        /* 🔥 UNIVERSAL MOBILE APP INTERFACE 🔥 */
        @media (max-width: 1024px) { 
            body { padding-bottom: 100px; padding-top: 15px; }
            .nav-top { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: 75px; padding: 0 10px; border-bottom: none; border-top: 4px solid var(--kilrr-orange); justify-content: center; box-shadow: 0 -10px 20px rgba(0,0,0,0.15); z-index: 9999; background: var(--navy-command); }
            .brand { display: none; }
            .nav-links { width: 100%; justify-content: space-between; overflow-x: auto; padding-bottom: 5px; }
            .nav-btn { font-size: 13px; padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; }
            .nav-btn.logout { display: none; }
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 18px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 18px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 18px; }
            .container { padding: 15px; margin-top: 20px; grid-template-columns: 1fr; gap: 20px;}
            .card { padding: 25px; margin: 0; border-radius: 16px; }
            h2 { font-size: 24px; }
            .hybrid-input-row { flex-direction: column; gap: 10px; }
            .btn-add-manual { width: 100%; padding: 20px; margin: 0;}
            .manual-box { padding: 20px; }
            table { font-size: 14px; display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
    <nav class="nav-top">
        <a href="index.html" class="brand"><img src="logo.png" alt="Kilrr" onerror="this.style.display='none'"><span>Factory</span> OS</a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inwarding</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="audit.html" class="nav-btn active">Audit</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master Data</a>
            <a href="/api/logout" class="nav-btn logout">Exit</a>
        </div>
    </nav>

    <div class="container">
        <!-- AUDIT EXECUTION -->
        <div class="card card-left">
            <h2>Live Stock Audit</h2>
            <label>Audit Session ID</label>
            <input type="text" id="session_name" placeholder="e.g. WEEKLY-JUNE-01" autocomplete="off" style="text-transform:uppercase;">
            
            <div class="manual-box">
                <label style="color:var(--text-dark); font-size: 18px; margin-bottom: 20px;">⚡ SCAN MATERIAL BAG TO AUDIT</label>
                <div class="hybrid-input-row">
                    <input type="text" id="rm_tag" placeholder="SCAN BARCODE..." autocomplete="off">
                    <button class="btn-add-manual" onclick="lookupTag()">FIND</button>
                </div>
            </div>

            <div id="auditPanel" style="display:none; background:#f8fafc; padding:25px; border-radius:16px; border:2px solid var(--kilrr-orange); margin-bottom:20px;">
                <label>System Recorded Weight (KG)</label>
                <input type="number" id="sys_wt" readonly style="background:#e2e8f0; color:#475569; border-color:#cbd5e1;">
                
                <label>Actual Verified Weight (KG)</label>
                <input type="number" id="act_wt" placeholder="Enter physically verified weight...">
                <input type="hidden" id="prod_code">
                
                <button class="btn-primary" onclick="submitAudit()">✅ Confirm & Update Stock</button>
            </div>
        </div>

        <!-- AUDIT HISTORY -->
        <div class="card card-right">
            <h2>Session History</h2>
            <label>Select Previous Audit Session</label>
            <select id="session_select" onchange="loadSessionHistory()"><option value="">-- Select Session --</option></select>
            <div style="max-height: 400px; overflow-y: auto; margin-top: 20px;">
                <table id="historyTable">
                    <thead><tr><th>Barcode Tag</th><th>Product</th><th>Audited Wt</th></tr></thead>
                    <tbody id="historyBody"><tr><td colspan="3" style="text-align:center; color:#94a3b8;">No session selected</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('rm_tag').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); lookupTag(); }}); 
        
        async function loadSessions() {
            const res = await fetch('/get-sessions'); const data = await res.json();
            document.getElementById('session_select').innerHTML = `<option value="">-- Select Session --</option>` + data.map(s => `<option value="${s.session_name}">${s.session_name}</option>`).join('');
        }
        window.onload = loadSessions;

        async function lookupTag() {
            const session = document.getElementById('session_name').value.trim().toUpperCase();
            if(!session) return alert("Please enter an Audit Session ID first!");
            
            let val = document.getElementById('rm_tag').value.trim();
            if(!val) return;
            
            let cleanTag=val, parts=val.split('/'); 
            if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            
            const pCode = parts.length >= 2 ? parts[1] : cleanTag;
            document.getElementById('rm_tag').value = cleanTag;
            document.getElementById('prod_code').value = pCode;
            
            // In a full production system, we would query the inventory DB here for `sys_wt`.
            // For now, we unlock the panel to log the new weight.
            document.getElementById('sys_wt').value = "0.00"; 
            document.getElementById('auditPanel').style.display = 'block';
            document.getElementById('act_wt').focus();
        }

        async function submitAudit() {
            const session = document.getElementById('session_name').value.trim().toUpperCase();
            const tag = document.getElementById('rm_tag').value;
            const pCode = document.getElementById('prod_code').value;
            const origWt = parseFloat(document.getElementById('sys_wt').value) || 0;
            const actWt = parseFloat(document.getElementById('act_wt').value);

            if(isNaN(actWt)) return alert("Enter valid actual weight!");

            const res = await fetch('/audit-stock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_name: session, rm_tag: tag, product_code: pCode, original_weight: origWt, current_weight: actWt })
            });

            const data = await res.json();
            if(data.success) {
                document.getElementById('auditPanel').style.display = 'none';
                document.getElementById('rm_tag').value = '';
                document.getElementById('act_wt').value = '';
                document.getElementById('rm_tag').focus();
                loadSessions(); // refresh history dropdown
            } else {
                alert("Error: " + data.error);
            }
        }

        async function loadSessionHistory() {
            const session = document.getElementById('session_select').value;
            if(!session) return document.getElementById('historyBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">No session selected</td></tr>';
            
            const res = await fetch(`/audit-session/${session}`);
            const data = await res.json();
            
            if(data.length === 0) {
                document.getElementById('historyBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">No records found</td></tr>';
            } else {
                document.getElementById('historyBody').innerHTML = data.map(r => `<tr><td style="font-family:'Space Grotesk',sans-serif; font-weight:700;">${r.rm_tag}</td><td>${r.ingredient_name || r.product_code}</td><td style="color:var(--success-green); font-weight:900;">${r.current_weight} KG</td></tr>`).join('');
            }
        }
    </script>
</body>
</html>
