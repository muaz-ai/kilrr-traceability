<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Pre-Processing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --card-white: rgba(255, 255, 255, 0.95); --text-dark: #0f172a; --text-mid: #334155; --border-heavy: #cbd5e1; --success-green: #059669; --danger-red: #dc2626; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-dark); margin: 0; padding-bottom: 120px; }
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 80px; position: sticky; top: 0; z-index: 1000;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 900; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 8px;}
        .nav-btn { text-decoration: none; padding: 12px 18px; color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; border-radius: 8px;}
        .nav-btn.active { color: #ffffff; background: var(--kilrr-orange); }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;}
        .card { background: var(--card-white); border: 2px solid var(--border-heavy); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { margin: 0 0 20px 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px;}
        
        label { display: block; font-size: 14px; font-weight: 800; color: var(--text-mid); text-transform: uppercase; margin-bottom: 8px; }
        input, select { width: 100%; padding: 16px; box-sizing: border-box; border-radius: 12px; border: 3px solid var(--border-heavy); font-size: 18px; font-weight: 700; margin-bottom: 20px;}
        button { width: 100%; padding: 20px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: var(--kilrr-orange); color: white; }
        
        .summary-box { background: #ecfdf5; border: 2px solid var(--success-green); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .summary-text { font-size: 14px; font-weight: 800; color: var(--success-green); text-transform: uppercase; }
        .summary-val { font-size: 24px; font-weight: 900; color: var(--navy-command); font-family: 'Space Grotesk'; }

        .scanned-list { max-height: 250px; overflow-y: auto; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; background: #f8fafc; margin-bottom: 20px;}
        .scan-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px;}
        
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .history-table th, .history-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .history-table th { background: #f1f5f9; font-weight: 800; color: var(--text-mid); text-transform: uppercase; }

        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; padding: 40px; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s; pointer-events: none;}
        .flash-green { background: rgba(5, 150, 105, 0.95); } .flash-red { background: rgba(220, 38, 38, 0.95); }

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; gap: 15px; margin: 15px auto; padding: 0 10px;}
            .card { padding: 20px; }
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; height: 75px; padding: 0 5px; border-top: 4px solid var(--kilrr-orange); justify-content: center; }
            .brand { display: none; }
            .nav-links { width: 100%; justify-content: space-between; overflow-x: auto;}
            .nav-btn { font-size: 11px; padding: 8px; flex-direction: column; align-items: center; display: flex;}
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="preprocess.html" class="nav-btn active">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>1. Parent Material Input</h2>
            
            <div class="summary-box">
                <div><div class="summary-text">Input Bags</div><div class="summary-val" id="total_input_bags">0</div></div>
                <div style="text-align:right;"><div class="summary-text">Input Weight</div><div class="summary-val" id="total_input_weight">0.00 KG</div></div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom: 15px;">
                <input type="text" id="rm_tag_manual" placeholder="SCAN BARCODE..." autocomplete="off" style="margin:0;">
                <button style="width:auto; padding:0 25px; margin:0; background:var(--navy-command);" onclick="manualScan()">ADD</button>
            </div>
            
            <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; display:none; margin-bottom:15px; border:3px solid var(--border-heavy);"></div>
            <button style="background: #fff7ed; color: var(--kilrr-orange); border: 3px solid var(--kilrr-orange); margin-bottom: 20px;" onclick="togglePreProcessCamera()" id="camToggleBtn">📷 Activate Mobile Camera</button>

            <div class="scanned-list" id="scan_log">
                <div style="text-align:center; padding:20px; color:#94a3b8; font-weight:800;">Scan raw materials to begin...</div>
            </div>
        </div>

        <div class="card">
            <h2>2. Processing Output</h2>
            <label>Process Type</label>
            <select id="process_type">
                <option value="Cleaning / Sorting">Cleaning / Sorting</option>
                <option value="Re-Packaging (LDPE)">Re-Packaging (Transfer to LDPE)</option>
                <option value="Roasting">Roasting</option>
                <option value="Grinding">Grinding</option>
            </select>
            
            <label>Target Product Code (e.g. BP-CLN)</label>
            <input type="text" id="out_code" placeholder="Enter Product Code" style="text-transform:uppercase;">
            
            <label>Final Output Weight (KG)</label>
            <input type="number" id="output_wt" placeholder="Actual weight on scale..." style="color:var(--success-green); font-family:'Space Grotesk'; font-size:24px;">
            
            <label>Lead Operator</label>
            <select id="op_name">
                <option value="Muaz">Muaz</option><option value="Arbaaz">Arbaaz</option><option value="Rahul">Rahul</option>
            </select>
            
            <button class="btn-primary" onclick="generateSubAssembly()">🖨️ Log & Print Tag</button>

            <h3 style="margin-top:40px; border-bottom:2px solid #e2e8f0; padding-bottom:10px; font-family:'Space Grotesk';">Recent Sub-Assemblies</h3>
            <div style="overflow-x:auto;">
                <table class="history-table">
                    <thead><tr><th>Tag</th><th>Item</th><th>Weight</th><th>Action</th></tr></thead>
                    <tbody id="history_body"><tr><td colspan="4" style="text-align:center;">Loading history...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        let parentTags = []; // Array of objects: {tag: '...', weight: 10}
        let html5QrcodeScanner = null;
        
        // MARATHI VOICE ENGINE
        function playMarathiVoice(isSuccess) {
            try {
                let msg = new SpeechSynthesisUtterance();
                msg.text = isSuccess ? "बरोबर" : "चूक"; // Barobar (Correct) / Chuk (Wrong)
                msg.lang = 'mr-IN'; // Marathi Language Code
                msg.rate = 1.2;
                window.speechSynthesis.speak(msg);

                // Fallback Buzz for error
                if(!isSuccess) {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); 
                    osc.connect(gain); gain.connect(audioCtx.destination); 
                    osc.type = 'sawtooth'; osc.frequency.value = 150; 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); 
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) { console.log("Voice API not supported"); }
        }

        function showFlash(isSuccess, message) {
            const flash = document.getElementById('scan_flash'); flash.className = isSuccess ? 'flash-green' : 'flash-red';
            flash.innerText = message; flash.style.display = 'flex'; void flash.offsetWidth; flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.style.display = 'none', 200); }, 600);
        }

        window.onload = () => { loadHistory(); document.getElementById('rm_tag_manual').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); manualScan(); }}); };

        function togglePreProcessCamera() { 
            const rd = document.getElementById('reader'); 
            if(rd.style.display === 'none' || rd.style.display === '') { 
                rd.style.display = 'block'; document.getElementById('camToggleBtn').innerText = "🚫 Close Camera"; 
                if(!html5QrcodeScanner) { html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250}, videoConstraints: { facingMode: "environment" } }); html5QrcodeScanner.render(txt => { document.getElementById('rm_tag_manual').value = txt; manualScan(); }); } 
            } else { rd.style.display = 'none'; document.getElementById('camToggleBtn').innerText = "📷 Activate Mobile Camera"; } 
        }

        async function manualScan() { 
            let val = document.getElementById('rm_tag_manual').value.trim(); if(!val) return; 
            let cleanTag=val, parts=val.split('/'); if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            
            // DUPLICATE CHECK
            if(parentTags.some(t => t.tag === cleanTag)){ 
                playMarathiVoice(false); showFlash(false, "❌ DUPLICATE"); document.getElementById('rm_tag_manual').value=""; return;
            } 
            
            // FETCH WEIGHT
            const res = await fetch(`/api/get-tag-weight?tag=${encodeURIComponent(cleanTag)}`);
            const data = await res.json();

            parentTags.push({ tag: cleanTag, weight: parseFloat(data.weight) || 0 });
            playMarathiVoice(true); showFlash(true, "✅ बरोबर");
            
            document.getElementById('rm_tag_manual').value="";
            updateLog();
        }

        function removeTag(tag) { parentTags = parentTags.filter(t => t.tag !== tag); updateLog(); }

        function updateLog() {
            const logBox = document.getElementById('scan_log');
            let totalBags = parentTags.length;
            let totalWeight = parentTags.reduce((sum, item) => sum + item.weight, 0);

            document.getElementById('total_input_bags').innerText = totalBags;
            document.getElementById('total_input_weight').innerText = totalWeight.toFixed(2) + " KG";

            if(parentTags.length === 0) { logBox.innerHTML = "<div style='text-align:center;padding:20px;color:#94a3b8;font-weight:800;'>Scan raw materials to begin...</div>"; } 
            else { logBox.innerHTML = parentTags.map(t => `<div class="scan-item"><span style="font-family:'Space Grotesk',monospace;font-weight:900;">${t.tag} <br><span style="color:var(--success-green); font-size:14px;">${t.weight} KG</span></span><button style="background:none; border:none; color:var(--danger-red); font-weight:bold; font-size:18px; cursor:pointer;" onclick="removeTag('${t.tag}')">🗑️</button></div>`).join(''); }
        }

        async function generateSubAssembly() {
            if(parentTags.length === 0) return alert("Scan at least one parent bag!");
            const outCode = document.getElementById('out_code').value.toUpperCase(), outWt = document.getElementById('output_wt').value, procType = document.getElementById('process_type').value, opName = document.getElementById('op_name').value;
            if(!outCode || !outWt) return alert("Fill Product Code and Output Weight!");

            // Extract just the string tags for the backend
            const tagsOnly = parentTags.map(t => t.tag);

            const res = await fetch('/create-sub-assembly', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parents: tagsOnly, product_code: outCode, weight: outWt, process_type: procType, operator: opName }) });
            const data = await res.json();
            if(data.error) return alert("❌ Error: " + data.error);

            printTag(data.sub_tag, outCode, outWt, procType);
            
            parentTags = []; updateLog(); document.getElementById('output_wt').value = "";
            loadHistory();
        }

        async function loadHistory() {
            const res = await fetch('/api/get-sub-assemblies');
            const data = await res.json();
            const tbody = document.getElementById('history_body');
            if(data.length === 0) tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No recent assemblies</td></tr>";
            else tbody.innerHTML = data.map(row => `<tr><td style="font-family:monospace; font-weight:bold;">${row.sub_tag}</td><td>${row.product_code}</td><td style="color:var(--success-green); font-weight:bold;">${row.current_weight} KG</td><td><button style="background:var(--navy-command); color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="printTag('${row.sub_tag}', '${row.product_code}', '${row.current_weight}', '${row.process_type}')">🖨️</button></td></tr>`).join('');
        }

        function printTag(tagStr, nameStr, wtStr, procStr) {
            const dObj = new Date(); const dispDate = `${String(dObj.getDate()).padStart(2, '0')}/${String(dObj.getMonth()+1).padStart(2, '0')}/${dObj.getFullYear()}`;
            let printWindow = window.open('','_blank'); 
            let html=`<html><head><style>@page{size:75mm 75mm; margin:0;} body{margin:0; font-family:Arial, sans-serif; text-align:center;} .page{width:75mm; height:75mm; padding-top:4mm; display:flex; flex-direction:column; align-items:center;} h2{margin:0 0 1mm 0; font-size:18px;} .codes{background:black; color:white; font-size:12px; font-weight:bold; padding:2px 8px; margin-bottom:2mm;} img{width:34mm; height:34mm; margin-bottom:2mm;} .details{font-size:14px; font-weight:bold;}</style></head><body>`; 
            let qrEngine = new QRious({ value: tagStr, size: 250, level: 'M' });
            html+=`<div class="page"><h2>${nameStr}</h2><div class="codes">${procStr}</div><img src="${qrEngine.toDataURL()}"><div style="font-size:14px; font-weight:900; margin-bottom:2mm;">${tagStr}</div><div class="details">Net Wt: ${wtStr} KG</div></div></body><script>window.onload=()=>{window.print();window.close();};<\/script></html>`; 
            printWindow.document.write(html); printWindow.document.close(); 
        }
    </script>
</body>
</html>
