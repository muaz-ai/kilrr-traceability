<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Pre-Process</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; }
        
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; overflow: visible; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--kilrr-orange); }
        
        h2 { margin: 0 0 20px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--navy-command);}
        .marathi { font-family: 'Inter', sans-serif; color: var(--kilrr-orange); font-size: 14px; display: block; margin-top: 4px; }
        
        label { font-weight: 800; font-size: 13px; color: #64748b; display: block; margin-bottom: 8px; letter-spacing: 1px;}
        input, select { width: 100%; padding: 18px; box-sizing: border-box; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 20px; background: #fff;}
        input:focus, select:focus { border-color: var(--kilrr-orange); outline: none; box-shadow: 0 0 0 4px rgba(234,88,12,0.1);}
        
        button { width: 100%; padding: 22px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-primary { background: var(--kilrr-orange); color: white; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);}
        .btn-cam { background: #fff7ed; color: var(--kilrr-orange); border: 3px solid var(--kilrr-orange); margin-bottom: 20px;}

        .dashboard-box { display: flex; justify-content: space-between; background: #ecfdf5; border: 2px solid var(--success-green); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .val-text { font-size: 28px; font-family: 'Space Grotesk'; font-weight: 900; color: var(--success-green); line-height: 1.2;}

        .scan-item { display: flex; justify-content: space-between; background: #f8fafc; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; align-items: center;}
        
        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s;}
        #reader { width: 100%; border-radius: 12px; overflow: hidden; display: none; margin-bottom: 15px; border: 3px solid #cbd5e1; }

        /* CUSTOM DROPDOWN UI */
        .custom-dropdown-container { position: relative; width: 100%; margin-bottom: 20px;}
        .custom-dropdown-container input { margin-bottom: 0; }
        .custom-dropdown-list { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #ffffff; border: 2px solid var(--kilrr-orange); border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 9999; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); display: none; padding: 10px; }
        .custom-dropdown-item { padding: 15px 20px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.1s; margin-bottom: 4px; border-bottom: 1px solid #f1f5f9; }
        .custom-dropdown-item:hover { background: #fff7ed; color: var(--kilrr-orange); }

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; }
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; overflow-x: auto; white-space: nowrap;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 5px 10px; }
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 20px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 20px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn active">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="audit.html" class="nav-btn">Audit</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>1. Parent Input <span class="marathi">प्रोडक्शन एरिया - इनपुट</span></h2>
            
            <div class="dashboard-box">
                <div><div style="font-size:12px; font-weight:bold; color:var(--success-green);">INPUT BAGS</div><div class="val-text" id="in_bags">0</div></div>
                <div style="text-align:right;"><div style="font-size:12px; font-weight:bold; color:var(--success-green);">INPUT WEIGHT</div><div class="val-text" id="in_wt">0.00 KG</div></div>
            </div>

            <label>SCAN RAW MATERIAL BARCODE</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="rm_tag" placeholder="Scan Tag..." autocomplete="off" style="margin-bottom:0; border-color:var(--navy-command);">
                <button style="width:auto; padding:0 30px; margin:0; background:var(--navy-command); color:white; border-radius:12px;" onclick="manualScan()">ADD</button>
            </div>
            
            <div id="reader"></div>
            <button class="btn-cam" id="camToggleBtn" onclick="togglePreProcessCamera()" style="margin-top: 15px;">📷 Activate Mobile Camera</button>

            <label>SCANNED MATERIALS LOG</label>
            <div id="scan_log" style="max-height: 250px; overflow-y: auto; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; background: #f8fafc;">
                <div style="text-align:center; padding:20px; color:#94a3b8; font-weight:800;">Scan parent bags to begin...</div>
            </div>
        </div>

        <div class="card">
            <h2>2. Processing Output <span class="marathi">तयार माल</span></h2>
            
            <label>PROCESS EXECUTED</label>
            <select id="process_type">
                <option value="Cleaning / Sorting">Cleaning / Sorting</option>
                <option value="Roasting">Roasting</option>
                <option value="Grinding / Pulverizing">Grinding / Pulverizing</option>
                <option value="Re-Packaging">Re-Packaging (Bulk to Small)</option>
            </select>
            
            <label>TARGET PRODUCT CODE</label>
            <div class="custom-dropdown-container">
                <input type="text" id="out_code_search" placeholder="Search Master Data (e.g. BP-CLN)..." autocomplete="off">
                <input type="hidden" id="out_code">
            </div>
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                <label style="margin:0;">TOTAL ACTUAL YIELD (KG)</label>
                <span id="yield_display" style="font-weight:900; font-size:14px;">Loss: 0.0%</span>
            </div>
            <input type="number" id="output_wt" placeholder="e.g. 48" style="font-size: 24px; color:var(--kilrr-orange);" oninput="calcYield()">
            
            <div style="display:flex; gap: 15px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label>HOW MANY BINS/PACKS?</label>
                    <input type="number" id="out_packs" value="1" placeholder="e.g. 12" style="margin-bottom:0;">
                </div>
                <div style="flex: 1;">
                    <label>OPERATOR</label>
                    <div style="display:flex; gap: 10px;">
                        <select id="op_name" style="margin-bottom:0;"></select>
                        <button style="width:auto; padding:0 15px; border-radius:12px; background:#e2e8f0; color:var(--navy-command); font-weight:bold; border:2px solid #cbd5e1;" onclick="addNewOperator()">➕</button>
                    </div>
                </div>
            </div>
            
            <button class="btn-primary" onclick="submitProcess()">🖨️ LOG & PRINT SUB-ASSEMBLY TAGS</button>
        </div>
    </div>
    
    <script>
        let inputBags = [];
        let html5QrcodeScanner = null;
        let operators = JSON.parse(localStorage.getItem('kilrr_ops')) || ["Muaz", "Arbaaz", "Rahul", "Ramesh"];
        
        window.onload = async () => {
            renderOperators();
            try {
                const iRes = await fetch('/get-ingredients'); 
                const ingredients = await iRes.json();
                attachCustomDropdown('out_code_search', ingredients, 'product_code', 'product_code', 'product_code', 'out_code', 'out_code');
            } catch(e) { console.error("Master data fetch failed."); }
        };

        function renderOperators() {
            const sel = document.getElementById('op_name');
            sel.innerHTML = operators.map(o => `<option value="${o}">${o}</option>`).join('');
        }

        function addNewOperator() {
            let name = prompt("Enter new operator name:");
            if(name && name.trim() !== "") {
                operators.push(name.trim());
                localStorage.setItem('kilrr_ops', JSON.stringify(operators));
                renderOperators();
                document.getElementById('op_name').value = name.trim();
            }
        }

        function attachCustomDropdown(inputId, dataArray, searchKey, displayKey, codeKey, nameHiddenId, codeHiddenId) {
            const inp = document.getElementById(inputId); 
            const list = document.createElement('div'); 
            list.className = 'custom-dropdown-list'; 
            inp.parentNode.appendChild(list);
            
            function renderList(filterTxt = "") {
                list.innerHTML = ''; 
                const matches = dataArray.filter(item => item[searchKey].toLowerCase().includes(filterTxt.toLowerCase()) || item.ingredient_name.toLowerCase().includes(filterTxt.toLowerCase()));
                if(matches.length === 0) { list.style.display = 'none'; return; }
                
                matches.forEach(match => { 
                    let div = document.createElement('div'); div.className = 'custom-dropdown-item'; 
                    div.innerHTML = `<strong style="color:var(--kilrr-orange);">${match[codeKey]}</strong> - ${match.ingredient_name}`; 
                    div.onclick = () => { 
                        inp.value = match[codeKey]; 
                        document.getElementById(codeHiddenId).value = match[codeKey]; 
                        list.style.display = 'none'; 
                    }; 
                    list.appendChild(div); 
                }); 
                list.style.display = 'block';
            }
            inp.addEventListener('input', function() { renderList(this.value); }); 
            inp.addEventListener('focus', function() { renderList(this.value); });
            document.addEventListener('click', function(e) { if(e.target !== inp) list.style.display = 'none'; });
        }

        function playVoice(success) {
            try {
                let msg = new SpeechSynthesisUtterance(success ? "बरोबर" : "चूक");
                msg.lang = 'mr-IN'; msg.rate = 1.2; window.speechSynthesis.speak(msg);
                if(!success && navigator.vibrate) navigator.vibrate([200, 100, 200]); 
            } catch(e) {}
        }
        
        function flash(success, txt) { 
            const f = document.getElementById('scan_flash'); 
            f.style.background = success ? 'rgba(5,150,105,0.95)' : 'rgba(220,38,38,0.95)';
            f.innerText = txt; f.style.display='flex'; f.style.opacity='1'; 
            setTimeout(()=>{f.style.opacity='0'; setTimeout(()=>f.style.display='none',200);}, 600); 
        }

        document.getElementById('rm_tag').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); manualScan(); }});

        function togglePreProcessCamera() { 
            const rd = document.getElementById('reader'); 
            if(rd.style.display === 'none' || rd.style.display === '') { 
                rd.style.display = 'block'; document.getElementById('camToggleBtn').innerText = "🚫 Close Camera"; 
                if(!html5QrcodeScanner) { 
                    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250}, videoConstraints: { facingMode: "environment" } }); 
                    html5QrcodeScanner.render(txt => { document.getElementById('rm_tag').value = txt; manualScan(); }); 
                } 
            } else { rd.style.display = 'none'; document.getElementById('camToggleBtn').innerText = "📷 Activate Mobile Camera"; } 
        }

        async function manualScan() { 
            let val = document.getElementById('rm_tag').value.trim(); if(!val) return; 
            let cleanTag=val, parts=val.split('/'); if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            
            if(inputBags.some(t => t.tag === cleanTag)){ 
                playVoice(false); flash(false, "❌ DUPLICATE"); document.getElementById('rm_tag').value=""; return;
            } 
            
            const res = await fetch(`/api/get-tag-weight?tag=${encodeURIComponent(cleanTag)}`);
            const data = await res.json();
            
            inputBags.push({ tag: cleanTag, weight: parseFloat(data.weight) || 0 });
            playVoice(true); flash(true, "✅ बरोबर");
            document.getElementById('rm_tag').value=""; updateLog(); calcYield(); document.getElementById('rm_tag').focus();
        }

        function removeTag(tag) { inputBags = inputBags.filter(t => t.tag !== tag); updateLog(); calcYield(); }

        function updateLog() {
            let totalWt = inputBags.reduce((sum, item) => sum + item.weight, 0);
            document.getElementById('in_bags').innerText = inputBags.length;
            document.getElementById('in_wt').innerText = totalWt.toFixed(2) + " KG";
            const logBox = document.getElementById('scan_log');
            if(inputBags.length === 0) logBox.innerHTML = "<div style='text-align:center;color:#94a3b8;font-weight:800;padding:20px;'>Scan parent bags to begin...</div>"; 
            else logBox.innerHTML = inputBags.map(t => `<div class="scan-item"><span style="font-family:monospace;font-weight:900;">${t.tag} <br><span style="color:var(--success-green); font-size:14px;">${t.weight} KG</span></span><button style="background:none; border:none; color:var(--danger-red); font-weight:bold; font-size:20px; cursor:pointer;" onclick="removeTag('${t.tag}')">✕</button></div>`).join('');
        }

        function calcYield() {
            let inWt = inputBags.reduce((sum, item) => sum + item.weight, 0);
            let outWt = parseFloat(document.getElementById('output_wt').value) || 0;
            let yieldDiv = document.getElementById('yield_display');
            if(inWt > 0 && outWt > 0) {
                let diff = inWt - outWt; let perc = (diff / inWt) * 100;
                yieldDiv.innerText = `Loss: ${perc.toFixed(1)}%`;
                yieldDiv.style.color = perc > 5 ? 'var(--danger-red)' : 'var(--success-green)';
            } else { yieldDiv.innerText = "Loss: 0.0%"; yieldDiv.style.color = "#0f172a"; }
        }

        async function submitProcess() {
            if(inputBags.length === 0) return alert("Scan parent bags first!");
            const outCode = document.getElementById('out_code').value.toUpperCase() || document.getElementById('out_code_search').value.toUpperCase();
            const outWt = document.getElementById('output_wt').value;
            const processType = document.getElementById('process_type').value;
            const opName = document.getElementById('op_name').value;
            const packs = parseInt(document.getElementById('out_packs').value) || 1;

            if(!outCode || !outWt) return alert("Fill Output Code and Output Weight!");

            const parentTags = inputBags.map(bag => bag.tag);

            const res = await fetch('/create-sub-assembly', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    parents: parentTags, 
                    product_code: outCode, 
                    weight: outWt, 
                    process_type: processType, 
                    operator: opName, 
                    packs: packs 
                }) 
            });
            const data = await res.json();
            if(data.error) return alert("❌ Error: " + data.error);

            // Execute Industrial Multi-Print
            let printWindow = window.open('', '_blank');
            let html = `<html><head><style>
                @page { size: 75mm 75mm; margin: 0; }
                body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: black; background: white; text-align: center; }
                .label { width: 73mm; height: 72mm; box-sizing: border-box; padding: 2mm; margin: 0 auto; page-break-after: always; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow: hidden; }
                .title { text-align: center; font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 1mm 0; line-height: 1; border-bottom: 3px solid black; padding-bottom: 1mm; width: 100%; }
                .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; margin: 1mm 0;}
                .qr-container img { width: 32mm; height: 32mm; margin-bottom: 1mm;}
                .process-text { font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 1mm; background: black; color: white; padding: 2px 6px; border-radius: 4px;}
                .bottom-section { width: 100%; margin-bottom: 1mm;}
                .tag-string { text-align: center; font-size: 14px; font-weight: 900; font-family: monospace; margin-bottom: 1mm; }
                .weight-bar { text-align: center; font-size: 20px; font-weight: 900; padding: 1mm 0; border-top: 3px solid black; border-bottom: 3px solid black; width: 100%; }
            </style></head><body>`;

            data.tags.forEach(tagObj => {
                let qr = new QRious({ value: tagObj.tag, size: 250, level: 'M' });
                html += `
                <div class="label">
                    <div class="title">${outCode}</div>
                    <div class="qr-container">
                        <img src="${qr.toDataURL()}">
                        <div class="process-text">${processType}</div>
                    </div>
                    <div class="bottom-section">
                        <div class="tag-string">${tagObj.tag}</div>
                        <div class="weight-bar">NET WT: ${tagObj.weight} KG</div>
                    </div>
                </div>`;
            });

            html += `</body><script>window.onload = () => { window.print(); window.close(); };<\/script></html>`;
            printWindow.document.write(html);
            printWindow.document.close();
            
            inputBags = []; updateLog(); 
            document.getElementById('output_wt').value = ""; 
            document.getElementById('out_packs').value = 1;
            document.getElementById('out_code_search').value = "";
            calcYield();
        }
    </script>
</body>
</html>
