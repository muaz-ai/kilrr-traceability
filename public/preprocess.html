<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Pre-Process</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; }
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #e2e8f0; }
        h2 { margin: 0 0 20px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--navy-command);}
        .marathi { font-family: 'Inter', sans-serif; color: var(--kilrr-orange); font-size: 14px; display: block; margin-top: 4px; }
        
        input, select { width: 100%; padding: 18px; box-sizing: border-box; border-radius: 10px; border: 3px solid #cbd5e1; font-size: 18px; font-weight: 700; margin-bottom: 15px; background: #f8fafc;}
        input:focus { border-color: var(--kilrr-orange); outline: none; }
        button { width: 100%; padding: 20px; border: none; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-primary { background: var(--kilrr-orange); color: white; }

        .dashboard-box { display: flex; justify-content: space-between; background: #ecfdf5; border: 2px solid var(--success-green); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .val-text { font-size: 24px; font-family: 'Space Grotesk'; font-weight: 900; color: var(--success-green); }

        .scan-item { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; align-items: center;}
        
        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s;}

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; }
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; }
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; }
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; }
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="preprocess.html" class="nav-btn active">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>1. Parent Input <span class="marathi">प्रोडक्शन एरिया - इनपुट</span></h2>
            <div class="dashboard-box">
                <div><div style="font-size:12px; font-weight:bold; color:var(--success-green);">INPUT BAGS</div><div class="val-text" id="in_bags">0</div></div>
                <div style="text-align:right;"><div style="font-size:12px; font-weight:bold; color:var(--success-green);">INPUT WEIGHT</div><div class="val-text" id="in_wt">0.00 KG</div></div>
            </div>

            <div style="display:flex; gap:10px;">
                <input type="text" id="rm_tag" placeholder="SCAN BARCODE..." autocomplete="off" style="margin-bottom:0;">
                <button style="width:auto; padding:0 25px; margin:0; background:var(--navy-command); color:white;" onclick="manualScan()">ADD</button>
            </div>
            
            <div id="scan_log" style="margin-top: 20px; max-height: 200px; overflow-y: auto;">
                <div style="text-align:center; padding:20px; color:#94a3b8; font-weight:800;">Scan bags to begin...</div>
            </div>
        </div>

        <div class="card">
            <h2>2. Yield Output <span class="marathi">तयार माल</span></h2>
            <select id="process_type">
                <option value="Cleaning / Sorting">Cleaning / Sorting</option>
                <option value="Re-Packaging">Re-Packaging (LDPE)</option>
                <option value="Roasting">Roasting</option>
            </select>
            <input type="text" id="out_code" placeholder="Target Product Code (e.g. BP-CLN)" style="text-transform:uppercase;">
            
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-weight:900;">Actual Weight (KG)</label>
                <span id="yield_display" style="font-weight:900; font-size:14px;">Loss: 0.0%</span>
            </div>
            <input type="number" id="output_wt" placeholder="0.00" style="font-size: 24px; color:var(--kilrr-orange);" oninput="calcYield()">
            
            <select id="op_name">
                <option value="Muaz">Muaz</option><option value="Arbaaz">Arbaaz</option><option value="Rahul">Rahul</option>
            </select>
            
            <button class="btn-primary" onclick="submitProcess()">🖨️ Log & Print Tag</button>
        </div>
    </div>
    
    <script>
        let inputBags = [];
        
        function playVoice(success) {
            try {
                let msg = new SpeechSynthesisUtterance(success ? "बरोबर" : "चूक");
                msg.lang = 'mr-IN'; msg.rate = 1.2; window.speechSynthesis.speak(msg);
                if(!success) { navigator.vibrate([200, 100, 200]); }
            } catch(e) {}
        }
        function flash(success, txt) { 
            const f = document.getElementById('scan_flash'); 
            f.style.background = success ? 'rgba(5,150,105,0.95)' : 'rgba(220,38,38,0.95)';
            f.innerText = txt; f.style.display='flex'; f.style.opacity='1'; 
            setTimeout(()=>{f.style.opacity='0'; setTimeout(()=>f.style.display='none',200);}, 600); 
        }

        document.getElementById('rm_tag').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); manualScan(); }});

        async function manualScan() { 
            let val = document.getElementById('rm_tag').value.trim(); if(!val) return; 
            let cleanTag=val, parts=val.split('/'); if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            
            if(inputBags.some(t => t.tag === cleanTag)){ 
                playVoice(false); flash(false, "❌ DUPLICATE"); document.getElementById('rm_tag').value=""; return;
            } 
            
            const res = await fetch(`/api/get-tag-weight?tag=${encodeURIComponent(cleanTag)}`);
            const data = await res.json();
            
            inputBags.push({ tag: cleanTag, weight: parseFloat(data.weight) || 0 });
            playVoice(true); flash(true, "✅ बरोबर");
            document.getElementById('rm_tag').value=""; updateLog(); calcYield();
        }

        function removeTag(tag) { inputBags = inputBags.filter(t => t.tag !== tag); updateLog(); calcYield(); }

        function updateLog() {
            let totalWt = inputBags.reduce((sum, item) => sum + item.weight, 0);
            document.getElementById('in_bags').innerText = inputBags.length;
            document.getElementById('in_wt').innerText = totalWt.toFixed(2) + " KG";
            const logBox = document.getElementById('scan_log');
            if(inputBags.length === 0) logBox.innerHTML = "<div style='text-align:center;color:#94a3b8;font-weight:800;'>Scan bags to begin...</div>"; 
            else logBox.innerHTML = inputBags.map(t => `<div class="scan-item"><span style="font-family:monospace;font-weight:900;">${t.tag} <br><span style="color:var(--success-green); font-size:12px;">${t.weight} KG</span></span><button style="background:none; border:none; color:var(--danger-red); font-weight:bold; font-size:18px; cursor:pointer;" onclick="removeTag('${t.tag}')">🗑️</button></div>`).join('');
        }

        function calcYield() {
            let inWt = inputBags.reduce((sum, item) => sum + item.weight, 0);
            let outWt = parseFloat(document.getElementById('output_wt').value) || 0;
            let yieldDiv = document.getElementById('yield_display');
            if(inWt > 0 && outWt > 0) {
                let diff = inWt - outWt; let perc = (diff / inWt) * 100;
                yieldDiv.innerText = `Loss: ${perc.toFixed(1)}%`;
                yieldDiv.style.color = perc > 5 ? 'var(--danger-red)' : 'var(--success-green)';
            } else { yieldDiv.innerText = "Loss: 0.0%"; yieldDiv.style.color = "#0f172a"; }
        }

        async function submitProcess() {
            if(inputBags.length === 0) return alert("Scan parent bags!");
            const outCode = document.getElementById('out_code').value.toUpperCase(), outWt = document.getElementById('output_wt').value;
            if(!outCode || !outWt) return alert("Fill Product Code and Output Weight!");

            const res = await fetch('/create-sub-assembly', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parents: inputBags.map(t=>t.tag), product_code: outCode, weight: outWt, process_type: document.getElementById('process_type').value, operator: document.getElementById('op_name').value }) });
            const data = await res.json();
            if(data.error) return alert("❌ Error: " + data.error);

            // Print Tag
            const dObj = new Date(); const dispDate = `${String(dObj.getDate()).padStart(2, '0')}/${String(dObj.getMonth()+1).padStart(2, '0')}/${dObj.getFullYear()}`;
            let pw = window.open('','_blank'); let qr = new QRious({ value: data.sub_tag, size: 250, level: 'M' });
            pw.document.write(`<html><head><style>@page{size:75mm 75mm; margin:0;} body{margin:0; font-family:Arial; text-align:center;} .page{width:75mm; height:75mm; padding-top:4mm; display:flex; flex-direction:column; align-items:center;} h2{margin:0; font-size:18px;} img{width:34mm; height:34mm; margin:2mm 0;} .dt{font-size:14px; font-weight:bold;}</style></head><body><div class="page"><h2>${outCode}</h2><img src="${qr.toDataURL()}"><div style="font-size:12px; font-weight:900;">${data.sub_tag}</div><div class="dt">Wt: ${outWt} KG</div></div><script>window.onload=()=>{window.print();window.close();};<\/script></body></html>`); pw.document.close();
            
            inputBags = []; updateLog(); document.getElementById('output_wt').value = ""; calcYield();
        }
    </script>
</body>
</html>
