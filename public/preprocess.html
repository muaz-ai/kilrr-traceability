<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr OS - Pre-Process & Sub-Assembly</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #0f172a; margin: 0; padding-bottom: 100px; min-height: 100vh;}
        
        .nav-top { background: var(--navy-command); border-bottom: 4px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; transition: 0.2s; padding: 8px 12px; border-radius: 8px;}
        .nav-btn:hover { background: rgba(255,255,255,0.05); color: white;}
        .nav-btn.active { color: white; background: var(--kilrr-orange);}

        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;}
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 16px 16px 0 0;}
        .card.card-green::before { background: linear-gradient(90deg, #059669, #10b981); }
        
        h2 { margin: 0 0 5px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; text-transform: uppercase; color: var(--navy-command);}
        .marathi-title { font-family: 'Inter', sans-serif; color: #3b82f6; font-size: 14px; font-weight: 800; display: block; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;}
        
        label { font-weight: 800; font-size: 13px; color: var(--navy-command); display: block; margin-bottom: 8px; text-transform: uppercase;}
        label span.sub { color: #64748b; font-size: 11px; font-weight: 700; display: block; margin-top: 2px;}

        input, select { width: 100%; padding: 16px 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 20px; background: #f8fafc; transition: 0.2s ease;}
        input:focus, select:focus { border-color: #3b82f6; outline: none; background: #ffffff; box-shadow: 0 0 0 4px rgba(59,130,246,0.15);}
        input[readonly] { background: #e2e8f0; color: #64748b; cursor: not-allowed;}
        
        button.btn-huge { width: 100%; padding: 20px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);}
        button.btn-success { background: linear-gradient(135deg, #059669 0%, #047857 100%); box-shadow: 0 8px 15px rgba(5, 150, 105, 0.3); }

        .row-inputs { display: flex; gap: 15px; }
        
        .scanned-parents { max-height: 150px; overflow-y: auto; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; background: #f1f5f9; margin-bottom: 20px;}
        .parent-tag { background: white; padding: 10px; border-radius: 6px; font-family: monospace; font-weight: bold; border: 1px solid #cbd5e1; margin-bottom: 5px; font-size: 14px;}

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; margin-top: 15px; gap: 20px;}
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; justify-content: space-around; overflow-x: auto; white-space: nowrap;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 8px 12px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; margin-bottom: 4px;}
            .card { padding: 20px;}
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn active">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container">
        <!-- OUTPUT CONFIGURATION -->
        <div class="card">
            <h2>Sub-Assembly Setup</h2>
            <span class="marathi-title">अंतर्गत माल बनवणे (Base Masalas)</span>
            
            <div class="row-inputs">
                <div style="flex:1;">
                    <label>तारीख <span class="sub">DATE</span></label>
                    <input type="date" id="date">
                </div>
                <div style="flex:1;">
                    <label>प्रक्रिया <span class="sub">PROCESS TYPE</span></label>
                    <select id="process_type">
                        <option value="BLENDING">Blending (Mixing Base)</option>
                        <option value="ROASTING">Roasting</option>
                        <option value="GRINDING">Grinding</option>
                    </select>
                </div>
            </div>

            <label>काय बनवत आहात? <span class="sub">OUTPUT PRODUCT NAME (e.g. Garam Masala)</span></label>
            <input type="text" id="product_name" placeholder="Name of Masala..." style="text-transform: uppercase;">

            <label>प्रॉडक्ट कोड <span class="sub">OUTPUT PRODUCT CODE (e.g. GM)</span></label>
            <input type="text" id="product_code" placeholder="Short Code..." style="text-transform: uppercase;">

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>पहिली गोणी <span class="sub">START BAG</span></label>
                    <input type="text" inputmode="numeric" id="start_no" value="1" oninput="calcQty()">
                </div>
                <div style="flex:1;">
                    <label>शेवटची गोणी <span class="sub">END BAG</span></label>
                    <input type="text" inputmode="numeric" id="end_no" value="1" oninput="calcQty()">
                </div>
                <div style="flex:1;">
                    <label>वजन (KG) <span class="sub">WT/BAG</span></label>
                    <input type="text" inputmode="numeric" id="weight" placeholder="e.g. 10">
                </div>
            </div>
            
            <input type="hidden" id="qty">
        </div>

        <!-- INPUT SCANNING & EXECUTION -->
        <div class="card card-green">
            <h2 style="color:var(--success-green);">Input Traceability</h2>
            <span class="marathi-title" style="color:var(--success-green);">कोणते बारकोड वापरले? (Parent Tags)</span>
            
            <label>स्कॅन करा <span class="sub">SCAN RM TAGS GOING INTO MACHINE</span></label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="scan_input" placeholder="Scan barcode here..." autocomplete="off">
                <button style="padding:0 20px; background:var(--navy-command); color:white; border-radius:10px; font-weight:bold; cursor:pointer;" onclick="addTag()">ADD</button>
            </div>

            <div class="scanned-parents" id="parent_list">
                <div style="color:#94a3b8; text-align:center; padding:10px; font-size:12px;">No parent barcodes scanned yet.</div>
            </div>

            <button class="btn-huge btn-success" onclick="generateAndPrint()">🖨️ जनरेट आणि प्रिंट करा (GENERATE WIP TAGS)</button>
        </div>
    </div>

    <script>
        let parentTags = [];

        window.onload = () => {
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('scan_input').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); addTag(); }});
        };

        function calcQty() {
            let s = parseInt(document.getElementById('start_no').value.replace(/[^0-9]/g, ''));
            let e = parseInt(document.getElementById('end_no').value.replace(/[^0-9]/g, ''));
            document.getElementById('qty').value = (isNaN(s) || isNaN(e) || e < s) ? 0 : (e - s) + 1;
        }

        function addTag() {
            const inp = document.getElementById('scan_input');
            const val = inp.value.trim();
            if(!val) return;
            if(!parentTags.includes(val)) {
                parentTags.push(val);
                renderTags();
            }
            inp.value = "";
            inp.focus();
        }

        function renderTags() {
            const list = document.getElementById('parent_list');
            if(parentTags.length === 0) {
                list.innerHTML = `<div style="color:#94a3b8; text-align:center; padding:10px; font-size:12px;">No parent barcodes scanned yet.</div>`;
                return;
            }
            list.innerHTML = parentTags.map((t, i) => `
                <div class="parent-tag" style="display:flex; justify-content:space-between;">
                    <span>${t}</span>
                    <span style="color:red; cursor:pointer;" onclick="parentTags.splice(${i},1); renderTags();">✕</span>
                </div>
            `).join('');
        }

        async function generateAndPrint() {
            const dateVal = document.getElementById('date').value;
            const pName = document.getElementById('product_name').value.trim().toUpperCase();
            const pCode = document.getElementById('product_code').value.trim().toUpperCase();
            const processType = document.getElementById('process_type').value;
            const weight = document.getElementById('weight').value.replace(/[^0-9.]/g, '');
            
            let startNo = parseInt(document.getElementById('start_no').value.replace(/[^0-9]/g, ''));
            let endNo = parseInt(document.getElementById('end_no').value.replace(/[^0-9]/g, ''));

            if(!pName || !pCode || !weight || isNaN(startNo) || isNaN(endNo)) {
                return alert("⚠️ Please fill out all Sub-Assembly details correctly.");
            }

            if(parentTags.length === 0) {
                if(!confirm("⚠️ You haven't scanned any Parent Tags. FSSAI requires origin tracing. Proceed anyway?")) return;
            }

            const [year, month, day] = dateVal.split('-');
            const dateFmt = `${day}${month}`;
            const padWeight = String(weight).padStart(2, '0');
            const dispDate = `${day}/${month}/${year}`;
            
            // THE KILRR HACK: Setting Vendor Code as "KILRR" so it acts as an internal Raw Material
            let outputTags = [];
            for(let i = startNo; i <= endNo; i++) {
                outputTags.push(`${dateFmt}/${pCode}/KILRR/${i}`);
            }

            let printWindow = window.open('', '_blank');
            if(!printWindow) return alert("⚠️ Popup Blocked! Allow popups to print.");

            try {
                printWindow.document.write('<html><body style="background:#f8fafc;"><h2 style="font-family:sans-serif; text-align:center; margin-top:50px; color:#3b82f6;">Logging to Traceability Engine...</h2></body></html>');

                // Log to backend
                const res = await fetch('/log-preprocess', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        output_tags: outputTags,
                        product_code: pCode,
                        process_type: processType,
                        parent_tags: parentTags.join(', ')
                    })
                });
                
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                // Print the Internal RM Labels (Exact same size as Inwarding layout)
                let html = `<html><head><style>
                    @page { size: 75mm 75mm; margin: 0; }
                    body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: black; background: white; text-align: center; }
                    .label { width: 73mm; height: 73mm; box-sizing: border-box; padding: 2mm; margin: 0 auto; page-break-after: always; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
                    .title { font-size: 22px; font-weight: 900; text-transform: uppercase; margin: 0; padding-bottom: 1.5mm; border-bottom: 3px solid black; width: 100%; line-height: 1; }
                    .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: auto 0; }
                    .qr-container img { width: 36mm; height: 36mm; margin-bottom: 1mm; }
                    .date-text { font-size: 13px; font-weight: 900; text-transform: uppercase; margin: 0; line-height: 1; }
                    .bottom-section { width: 100%; margin-bottom: 1mm; }
                    .tag-string { font-size: 16px; font-weight: 900; font-family: monospace; margin: 0 0 1.5mm 0; line-height: 1; }
                    .weight-bar { font-size: 21px; font-weight: 900; padding: 1.5mm 0; margin: 0; border-top: 3px solid black; border-bottom: 3px solid black; width: 100%; line-height: 1; }
                </style></head><body>`;

                outputTags.forEach(tagStr => {
                    let qrEngine = new QRious({ value: tagStr, size: 250, level: 'M' });
                    html += `
                    <div class="label">
                        <div class="title">${pName}</div>
                        <div class="qr-container">
                            <img src="${qrEngine.toDataURL()}">
                            <div class="date-text">DATE: ${dispDate}</div>
                        </div>
                        <div class="bottom-section">
                            <div class="tag-string">${tagStr}</div>
                            <div class="weight-bar">NET WT: ${padWeight} KG</div>
                        </div>
                    </div>`;
                });

                html += `</body><script>window.onload = () => { window.print(); window.close(); };<\/script></html>`;
                
                printWindow.document.open(); 
                printWindow.document.write(html);
                printWindow.document.close();

                // Clear setup
                document.getElementById('start_no').value = endNo + 1;
                document.getElementById('end_no').value = endNo + 1;
                parentTags = [];
                renderTags();

            } catch(e) { 
                printWindow.close();
                alert("Database Error: " + e.message); 
            }
        }
    </script>
</body>
</html>
