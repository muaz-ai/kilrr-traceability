<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr OS - Traceability Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #10b981; --danger-red: #dc2626; --warning-yellow: #eab308; --card-bg: #ffffff; --accent-blue: #2563eb; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding-bottom: 80px;}
        
        .nav-top { background: var(--navy-command); border-bottom: 4px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; transition: 0.2s;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white;}
        .nav-btn.active { color: white; background: var(--kilrr-orange);}

        .container { max-width: 1300px; margin: 30px auto; padding: 0 15px; }
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; border-top: 6px solid var(--kilrr-orange); margin-bottom: 30px;}
        
        /* DASHBOARD TABS */
        .tab-bar { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; flex-wrap: wrap;}
        .tab-btn { background: transparent; border: none; font-family: 'Space Grotesk'; font-size: 16px; font-weight: 900; color: #64748b; padding: 10px 20px; cursor: pointer; text-transform: uppercase; transition: 0.2s; border-radius: 8px;}
        .tab-btn:hover { background: #f1f5f9; color: var(--navy-command);}
        .tab-btn.active { background: var(--navy-command); color: white;}

        .search-box { width: 100%; padding: 18px 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 16px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 30px; transition: 0.2s;}
        .search-box:focus { border-color: var(--kilrr-orange); outline: none; box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.15);}

        /* BATCH GRID */
        .batch-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .batch-card { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 25px; transition: 0.2s;}
        .batch-card:hover { border-color: var(--accent-blue); box-shadow: 0 10px 25px rgba(37,99,235,0.1);}
        
        .bc-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;}
        .bc-title { font-size: 26px; font-weight: 900; color: var(--navy-command); margin: 0; font-family: 'Space Grotesk', sans-serif;}
        .bc-recipe { font-size: 16px; font-weight: 800; color: var(--kilrr-orange); margin: 5px 0 0 0;}
        .bc-meta { font-size: 14px; color: #64748b; font-weight: 700; text-align: right; display: flex; flex-direction: column; gap: 5px;}
        
        .bc-stats { display: flex; gap: 15px; flex-wrap: wrap;}
        .stat-pill { background: #f8fafc; padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 13px; border: 1px solid #cbd5e1; color: #64748b; text-transform: uppercase;}
        .stat-pill span { color: var(--navy-command); font-size: 18px; display: block; margin-top: 4px;}

        .btn-export { background: var(--navy-command); color: white; border: none; padding: 15px 25px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; align-items: center; gap: 10px;}
        .btn-export:hover { background: var(--kilrr-orange); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);}
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white;}
        th { background: #f8fafc; text-align: left; padding: 15px; font-size: 12px; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #cbd5e1; font-weight: 900;}
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; font-weight: 700; color: var(--navy-command);}
        
        .status-open { background: var(--warning-yellow); color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 900; vertical-align: middle; margin-left: 10px;}
        .status-closed { background: var(--success-green); color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 900; vertical-align: middle; margin-left: 10px;}

        @media (max-width: 1024px) { 
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; justify-content: space-around; overflow-x: auto; white-space: nowrap; border-top: 3px solid var(--kilrr-orange); z-index: 999;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 8px 12px;}
            .bc-header { flex-direction: column; align-items: flex-start; gap: 15px;}
            .bc-meta { text-align: left; }
            .btn-export { width: 100%; justify-content: center; margin-top: 15px;}
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="dashboard.html" class="nav-btn active">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <!-- 🔥 3-TAB DASHBOARD NAVIGATION 🔥 -->
            <div class="tab-bar">
                <button class="tab-btn active" id="tab_batches" onclick="switchTab('batches')">🏭 Final Batch Traceability</button>
                <button class="tab-btn" id="tab_preprocess" onclick="switchTab('preprocess')">🔥 Pre-Process (WIP) Ledger</button>
                <button class="tab-btn" id="tab_inwarding" onclick="switchTab('inwarding')">📦 Inwarding Ledger</button>
            </div>

            <input type="text" id="search_box" class="search-box" placeholder="🔍 Search Records..." oninput="handleSearch()">

            <div class="batch-grid" id="main_container">
                <div style="text-align:center; padding:50px; font-weight:bold; color:#94a3b8; font-size: 18px;">Syncing with Kilrr Server...</div>
            </div>
        </div>
    </div>

    <script>
        let allBatchData = [];
        let allInwardData = [];
        let allPreprocessData = [];
        let currentTab = 'batches';

        window.onload = async () => {
            try {
                // Fetching all 3 data streams from the database
                const [batchRes, inwardRes, preRes] = await Promise.all([
                    fetch('/api/dashboard-traceability'),
                    fetch('/api/dashboard-inwarding'),
                    fetch('/api/dashboard-preprocess')
                ]);
                allBatchData = await batchRes.json();
                allInwardData = await inwardRes.json();
                allPreprocessData = await preRes.json();
                
                renderBatches();
            } catch(e) { 
                document.getElementById('main_container').innerHTML = `<div style="text-align:center; color:var(--danger-red); font-weight:900; font-size:20px; padding:40px;">⚠️ Connection to Database Failed.</div>`;
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab_batches').classList.remove('active');
            document.getElementById('tab_preprocess').classList.remove('active');
            document.getElementById('tab_inwarding').classList.remove('active');
            document.getElementById(`tab_${tab}`).classList.add('active');
            
            document.getElementById('search_box').value = '';
            handleSearch();
        }

        function handleSearch() {
            if(currentTab === 'batches') renderBatches();
            else if(currentTab === 'preprocess') renderPreprocess();
            else renderInwarding();
        }

        // ==========================================
        // 1. FINAL BATCH RENDERER (EXISTING)
        // ==========================================
        function renderBatches() {
            const container = document.getElementById('main_container');
            const search = document.getElementById('search_box').value.toLowerCase();
            
            const filtered = allBatchData.filter(b => 
                b.batch_code.toLowerCase().includes(search) || 
                b.fg_code.toLowerCase().includes(search)
            );

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; font-weight:bold; color:#94a3b8; font-size: 18px;">No matching batch records found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(b => {
                let statusClass = b.status === 'CLOSED' ? 'status-closed' : 'status-open';
                let dateStr = new Date(b.created_at).toLocaleString();
                let totalYield = parseFloat(b.total_weight || 0).toFixed(2);

                let groups = {};
                b.scans.forEach(s => {
                    let tagParts = s.rm_tag.split('/');
                    let rawDate = tagParts[0] || 'N/A';
                    let fmtDate = rawDate.length === 4 ? `${rawDate.substring(0,2)}/${rawDate.substring(2,4)}` : rawDate;
                    let vendor = tagParts.length > 2 ? tagParts[2] : 'N/A';
                    if(vendor === 'KILRR') vendor = 'KILRR (Internal WIP)';

                    let key = `${s.product_code}_${vendor}_${fmtDate}`;
                    if(!groups[key]) {
                        groups[key] = {
                            ingredient: s.ingredient_name || s.product_code,
                            vendor: vendor,
                            inwardDate: fmtDate,
                            bags: 0,
                            weight: 0
                        };
                    }
                    groups[key].bags += 1;
                    groups[key].weight += parseFloat(s.weight) || 0;
                });

                let scansHTML = Object.values(groups).map(g => `
                    <tr>
                        <td style="font-weight:900;">${g.ingredient}</td>
                        <td style="color:var(--kilrr-orange); font-weight:bold;">${g.vendor}</td>
                        <td>${g.inwardDate}</td>
                        <td>${g.bags} Units</td>
                        <td style="font-weight:900;">${g.weight.toFixed(2)} KG</td>
                    </tr>
                `).join('');

                return `
                <div class="batch-card">
                    <div class="bc-header">
                        <div>
                            <h3 class="bc-title">${b.batch_code} <span class="${statusClass}">${b.status}</span></h3>
                            <p class="bc-recipe">${b.fg_code}</p>
                        </div>
                        <div class="bc-meta">
                            <div>📅 ${dateStr}</div>
                            <div>👤 Operator: ${b.operator_name}</div>
                        </div>
                    </div>
                    
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; flex-wrap: wrap; gap: 15px;">
                        <div class="bc-stats">
                            <div class="stat-pill">Total Scans <span>${b.scans.length}</span></div>
                            <div class="stat-pill">Batch Yield <span>${totalYield} KG</span></div>
                        </div>
                        ${b.status === 'CLOSED' ? `<button class="btn-export" onclick='printAuditTrail(${JSON.stringify(b)})'>🖨️ Export FSSAI Report</button>` : `<div style="color:var(--warning-yellow); font-weight:bold; font-size:13px;">Close batch to enable export.</div>`}
                    </div>

                    <div style="border: 2px solid #e2e8f0; border-radius:10px; overflow: hidden;">
                        <table>
                            <thead><tr><th>Ingredient</th><th>Vendor / Source</th><th>Inward Date</th><th>Bags Used</th><th>Total Wt Consumed</th></tr></thead>
                            <tbody>${scansHTML || '<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">No ingredients scanned yet.</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            }).join('');
        }

        // ==========================================
        // 2. 🔥 NEW: PRE-PROCESS (WIP) RENDERER 🔥
        // ==========================================
        function renderPreprocess() {
            const container = document.getElementById('main_container');
            const search = document.getElementById('search_box').value.toLowerCase();
            
            // Group the generated tags by their WIP Batch Code
            const grouped = {};
            allPreprocessData.forEach(row => {
                if(!grouped[row.batch_code]) {
                    grouped[row.batch_code] = {
                        date: row.created_at,
                        product: row.product_code,
                        process: row.process_type,
                        yield: row.total_yield,
                        parents: row.parent_tag, 
                        outputs: []
                    };
                }
                grouped[row.batch_code].outputs.push(row.sub_tag);
            });

            const filteredKeys = Object.keys(grouped).filter(batch => 
                batch.toLowerCase().includes(search) || 
                grouped[batch].product.toLowerCase().includes(search) ||
                grouped[batch].process.toLowerCase().includes(search)
            );

            if(filteredKeys.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; font-weight:bold; color:#94a3b8; font-size: 18px;">No pre-process records found.</div>`;
                return;
            }

            let rowsHTML = filteredKeys.map(batch => {
                let g = grouped[batch];
                let d = new Date(g.date).toLocaleString();
                
                // Beautifully format the Parent Tags (Ingredients used)
                let parentHTML = g.parents ? g.parents.split(',').map(p => `<div style="color:var(--kilrr-orange); font-family:monospace; font-size:12px; font-weight:bold; margin-bottom:2px;">${p.trim()}</div>`).join('') : '<span style="color:#94a3b8; font-size:12px;">No input scans</span>';
                
                // Format the output range
                let outs = g.outputs;
                let outStr = outs.length > 1 ? `${outs[0]}<br><span style="font-size:11px; color:#64748b;">...to...</span><br>${outs[outs.length-1]}<br><span style="color:var(--accent-blue); font-size:12px;">(${outs.length} Bags Generated)</span>` : outs[0];

                return `
                <tr>
                    <td style="font-size:13px; color:#64748b;">${d}</td>
                    <td>
                        <strong style="color:var(--navy-command); font-size:18px; text-transform:uppercase;">${batch}</strong><br>
                        <span style="background:#e2e8f0; color:#0f172a; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:900; display:inline-block; margin-top:5px;">${g.product} - ${g.process}</span>
                    </td>
                    <td>${parentHTML}</td>
                    <td style="font-family:monospace; color:var(--success-green); font-weight:bold; font-size:14px; line-height:1.4;">${outStr}</td>
                    <td style="font-weight:900; font-size:20px; color:var(--navy-command);">${g.yield} KG</td>
                </tr>`;
            }).join('');

            container.innerHTML = `
            <div style="border: 2px solid #e2e8f0; border-radius:12px; overflow: hidden; background:white; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
                <table style="width:100%; border-collapse:collapse;">
                    <thead><tr style="background:#f8fafc; border-bottom:2px solid #cbd5e1;"><th style="padding:15px; text-align:left;">Date & Time</th><th style="padding:15px; text-align:left;">WIP Batch & Process</th><th style="padding:15px; text-align:left;">Input Ingredients Consumed</th><th style="padding:15px; text-align:left;">Output Tags Generated</th><th style="padding:15px; text-align:left;">Batch Yield</th></tr></thead>
                    <tbody>${rowsHTML}</tbody>
                </table>
            </div>`;
        }

        // ==========================================
        // 3. INWARDING LEDGER RENDERER (EXISTING)
        // ==========================================
        function renderInwarding() {
            const container = document.getElementById('main_container');
            const search = document.getElementById('search_box').value.toLowerCase();
            
            const filtered = allInwardData.filter(i => 
                i.ingredient_name.toLowerCase().includes(search) || 
                i.vendor_name.toLowerCase().includes(search)
            );

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; font-weight:bold; color:#94a3b8; font-size: 18px;">No inwarding records found.</div>`;
                return;
            }

            let rowsHTML = filtered.map(i => {
                let d = new Date(i.date_received).toLocaleDateString();
                let totalWt = (parseFloat(i.packs) * parseFloat(i.weight)).toFixed(2);
                return `
                <tr>
                    <td>${d}</td>
                    <td style="font-weight:900;">${i.ingredient_name} <br><span style="font-size:11px; color:#64748b; font-family:monospace;">${i.ingredient_code}</span></td>
                    <td style="color:var(--kilrr-orange); font-weight:bold;">${i.vendor_name} <br><span style="font-size:11px; color:#64748b; font-family:monospace;">${i.vendor_code}</span></td>
                    <td>${i.start_no} to ${i.end_no} <br><span style="font-size:11px; color:#64748b;">(${i.packs} Bags)</span></td>
                    <td style="font-weight:900;">${totalWt} KG</td>
                </tr>`;
            }).join('');

            container.innerHTML = `
            <div style="border: 2px solid #e2e8f0; border-radius:10px; overflow: hidden;">
                <table>
                    <thead><tr><th>Date Received</th><th>Raw Material</th><th>Vendor Info</th><th>Bag Range</th><th>Total Weight</th></tr></thead>
                    <tbody>${rowsHTML}</tbody>
                </table>
            </div>`;
        }

        // ==========================================
        // PDF EXPORT SCRIPT
        // ==========================================
        function printAuditTrail(batchData) {
            let printWindow = window.open('', '_blank');
            if(!printWindow) return alert("Popup blocked! Allow popups to generate FSSAI reports.");

            let dateStr = new Date(batchData.created_at).toLocaleString();
            let totalYield = parseFloat(batchData.total_weight || 0).toFixed(2);

            let groups = {};
            batchData.scans.forEach(s => {
                let tagParts = s.rm_tag.split('/');
                let rawDate = tagParts[0] || 'N/A';
                let fmtDate = rawDate.length === 4 ? `${rawDate.substring(0,2)}/${rawDate.substring(2,4)}` : rawDate;
                let vendor = tagParts.length > 2 ? tagParts[2] : 'N/A';
                if(vendor === 'KILRR') vendor = 'KILRR (Internal WIP)';

                let key = `${s.product_code}_${vendor}_${fmtDate}`;
                if(!groups[key]) {
                    groups[key] = {
                        ingredient: s.ingredient_name || s.product_code,
                        vendor: vendor,
                        inwardDate: fmtDate,
                        bags: 0,
                        weight: 0
                    };
                }
                groups[key].bags += 1;
                groups[key].weight += parseFloat(s.weight) || 0;
            });

            let scansHTML = Object.values(groups).map(g => `
                <tr>
                    <td style="padding:12px 10px; border-bottom:1px solid #e2e8f0; font-weight:bold;">${g.ingredient}</td>
                    <td style="padding:12px 10px; border-bottom:1px solid #e2e8f0; font-weight:bold; color:#ea580c;">${g.vendor}</td>
                    <td style="padding:12px 10px; border-bottom:1px solid #e2e8f0; font-weight:bold;">${g.inwardDate}</td>
                    <td style="padding:12px 10px; border-bottom:1px solid #e2e8f0;">${g.bags} Units</td>
                    <td style="padding:12px 10px; border-bottom:1px solid #e2e8f0; font-weight:bold;">${g.weight.toFixed(2)} KG</td>
                </tr>
            `).join('');

            let html = `
            <html><head><title>FSSAI Audit Report - ${batchData.batch_code}</title>
            <style>
                @media print { * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; } }
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #0f172a; margin: 0; padding: 40px; background: white; }
                .report-wrapper { max-width: 900px; margin: 0 auto; border: 2px solid #cbd5e1; padding: 40px; border-radius: 12px; }
                .header { border-bottom: 4px solid #ea580c; padding-bottom: 25px; margin-bottom: 30px; display:flex; justify-content:space-between; align-items:flex-end;}
                h1 { margin: 0 0 5px 0; color: #0b1121; font-size: 32px; text-transform: uppercase; letter-spacing: -0.5px;}
                h2 { color: #ea580c; margin: 0; font-size: 18px; text-transform: uppercase;}
                .batch-highlight { text-align: right; }
                .batch-highlight div { font-size: 14px; font-weight: bold; color: #64748b; margin-bottom: 5px; text-transform: uppercase;}
                .batch-highlight span { background: #0b1121; color: white; padding: 8px 15px; border-radius: 6px; font-size: 24px; font-weight: 900; font-family: monospace;}
                .meta-box { background: #f8fafc; border: 2px solid #e2e8f0; padding: 25px; border-radius: 10px; margin-bottom: 40px; display: flex; justify-content: space-between;}
                .meta-col { display: flex; flex-direction: column; gap: 12px; font-size: 15px;}
                .meta-col strong { color: #64748b; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 2px;}
                .meta-col div { font-weight: bold; color: #0b1121; }
                h3 { color: #0b1121; font-size: 20px; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 2px solid #0b1121; display: inline-block; padding-bottom: 5px;}
                table { width: 100%; border-collapse: collapse; margin-bottom: 40px;}
                th { background: #0b1121; color: white; padding: 15px 10px; text-align: left; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;}
                .footer { text-align: center; border-top: 2px solid #e2e8f0; padding-top: 20px; margin-top: 40px; }
                .footer p { margin: 0 0 5px 0; font-size: 12px; color: #64748b; font-weight: bold;}
                .footer-brand { font-size: 16px; font-weight: 900; color: #0b1121; margin: 0;}
                .footer-brand span { color: #ea580c; }
            </style>
            </head><body>
                <div class="report-wrapper">
                    <div class="header">
                        <div>
                            <h1>Batch Traceability Audit</h1>
                            <h2>Kilrr Blended Spices - Internal Record</h2>
                        </div>
                        <div class="batch-highlight">
                            <div>Target Product: ${batchData.fg_code}</div>
                            <span>${batchData.batch_code}</span>
                        </div>
                    </div>
                    <div class="meta-box">
                        <div class="meta-col">
                            <div><strong>Production Date</strong> ${dateStr}</div>
                            <div><strong>Supervising Operator</strong> ${batchData.operator_name}</div>
                        </div>
                        <div class="meta-col" style="text-align:right;">
                            <div><strong>Ingredients Scanned</strong> ${batchData.scans.length} Units</div>
                            <div><strong>Final Logged Yield</strong> ${totalYield} KG</div>
                        </div>
                    </div>
                    <h3>Ingredient Ledger (Grouped Summary)</h3>
                    <table>
                        <thead>
                            <tr><th>Ingredient</th><th>Vendor Source</th><th>Inward Date</th><th>Bags Used</th><th>Total Wt Consumed</th></tr>
                        </thead>
                        <tbody>
                            ${scansHTML || '<tr><td colspan="5" style="text-align:center; padding:30px; font-weight:bold;">No ingredients were logged for this batch.</td></tr>'}
                        </tbody>
                    </table>
                    <div class="footer">
                        <p>This report was generated securely via system export. It serves as verifiable FSSAI documentation linking finished goods to raw material origin.</p>
                        <p class="footer-brand">Kilrr <span>OS</span></p>
                    </div>
                </div>
            </body>
