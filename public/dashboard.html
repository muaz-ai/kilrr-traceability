<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Dashboard</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding-bottom: 100px; }
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 20px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 16px; text-transform: uppercase; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .header-action { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px;}
        h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; color: var(--navy-command); text-transform: uppercase;}
        
        .btn-export { background: #10b981; color: white; padding: 15px 30px; border: none; border-radius: 12px; font-family: 'Space Grotesk'; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);}
        
        .table-container { background: white; border-radius: 20px; border: 1px solid #cbd5e1; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--navy-command); color: white; padding: 20px; font-weight: 800; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        td { padding: 20px; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 16px; }
        tr.batch-row { cursor: pointer; transition: 0.2s; }
        tr.batch-row:hover { background: #fff7ed; }
        
        .status-badge { padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 12px; }
        .status-open { background: #dbeafe; color: #1d4ed8; }
        .status-locked { background: #dcfce7; color: #15803d; }

        .drawer-row { display: none; background: #f8fafc; }
        .drawer-content { padding: 20px; border-left: 6px solid var(--kilrr-orange); }
        .scan-tag { display: inline-block; background: white; border: 1px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-family: monospace; font-weight: bold; margin: 4px; font-size: 14px;}
        .scan-tag span { color: var(--success-green); margin-left: 10px;}

        @media (max-width: 1024px) { 
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; }
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; }
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; }
            
            .header-action { flex-direction: column; align-items: flex-start; gap: 15px; }
            .btn-export { width: 100%; }
            th, td { padding: 15px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="dashboard.html" class="nav-btn active">Dashboard</a>
            <a href="master.html" class="nav-btn">Master Data</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-action">
            <div>
                <h2>Master Traceability Engine</h2>
                <span style="color: #64748b; font-weight: bold;">Click on any batch to view ingredient breakdown.</span>
            </div>
            <button class="btn-export" onclick="exportToExcel()">⬇️ Export to Excel</button>
        </div>

        <div class="table-container">
            <table id="trace_table">
                <thead>
                    <tr>
                        <th>Batch Code</th>
                        <th>Recipe</th>
                        <th>Total Weight</th>
                        <th>Operator</th>
                        <th>Status</th>
                        <th>Started</th>
                    </tr>
                </thead>
                <tbody id="trace_body">
                    <tr><td colspan="6" style="text-align:center; padding:40px; color:#94a3b8;">Fetching global database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let globalData = [];

        window.onload = async () => {
            try {
                const res = await fetch('/api/dashboard-traceability');
                globalData = await res.json();
                renderTable();
            } catch (e) {
                document.getElementById('trace_body').innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Database Connection Failed</td></tr>`;
            }
        };

        function renderTable() {
            const tbody = document.getElementById('trace_body');
            if(globalData.length === 0) { tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No batches found.</td></tr>`; return; }
            
            tbody.innerHTML = globalData.map((b, index) => {
                const isLocked = b.status === 'LOCKED';
                const statusBadge = `<span class="status-badge ${isLocked ? 'status-locked' : 'status-open'}">${b.status}</span>`;
                const dateStr = new Date(b.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'short', timeStyle: 'short' });
                
                let scanHTML = b.scans.length > 0 
                    ? b.scans.map(s => `<div class="scan-tag">${s.ingredient_name || s.product_code}<br>${s.rm_tag} <span>${parseFloat(s.weight).toFixed(2)} KG</span></div>`).join('')
                    : `<div style="color:#94a3b8; font-weight:bold;">No materials scanned yet.</div>`;

                return `
                    <tr class="batch-row" onclick="toggleDrawer(${index})">
                        <td style="color:var(--kilrr-orange); font-weight:900; font-family:'Space Grotesk'; font-size:18px;">${b.batch_code}</td>
                        <td style="font-weight:900;">${b.fg_code}</td>
                        <td style="color:var(--success-green); font-weight:900;">${parseFloat(b.total_weight).toFixed(2)} KG</td>
                        <td>${b.operator_name}</td>
                        <td>${statusBadge}</td>
                        <td>${dateStr}</td>
                    </tr>
                    <tr class="drawer-row" id="drawer_${index}">
                        <td colspan="6"><div class="drawer-content">${scanHTML}</div></td>
                    </tr>
                `;
            }).join('');
        }

        function toggleDrawer(index) {
            const drawer = document.getElementById(`drawer_${index}`);
            drawer.style.display = drawer.style.display === 'table-row' ? 'none' : 'table-row';
        }

        function exportToExcel() {
            if(globalData.length === 0) return alert("No data to export!");
            
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Batch Code,Recipe,Operator,Status,Date Started,Total Weight (KG),Ingredient Name,RM Tag,Bag Weight (KG)\r\n";
            
            globalData.forEach(b => {
                const dateStr = new Date(b.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
                if(b.scans.length === 0) {
                    csvContent += `${b.batch_code},${b.fg_code},${b.operator_name},${b.status},${dateStr},${b.total_weight},N/A,N/A,0\r\n`;
                } else {
                    b.scans.forEach(s => {
                        csvContent += `${b.batch_code},${b.fg_code},${b.operator_name},${b.status},${dateStr},${b.total_weight},${s.ingredient_name || s.product_code},${s.rm_tag},${s.weight}\r\n`;
                    });
                }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Kilrr_Traceability_Export_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
