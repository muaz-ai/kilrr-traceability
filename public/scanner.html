<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding-bottom: 80px; }
        
        /* Navigation */
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-transform: uppercase; }
        .nav-links { display: flex; gap: 20px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 16px; }

        /* Card Container */
        .main-container { max-width: 600px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; border: 2px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        h2 { font-family: 'Space Grotesk', sans-serif; margin-top: 0; color: var(--navy-command); }
        input { width: 100%; padding: 15px; box-sizing: border-box; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 16px; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background: var(--kilrr-orange); color: white; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        
        .inv-card { background: #f8fafc; padding: 15px; border-radius: 10px; border: 2px solid #e2e8f0; display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 800; }
    </style>
</head>
<body>

    <nav class="nav-top">
        <div class="brand">KILRR OS</div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="scanner.html" class="nav-btn" style="color:var(--kilrr-orange);">Scanner</a>
        </div>
    </nav>

    <div class="main-container">
        <!-- SETUP -->
        <div class="card" id="setup_screen">
            <h2>Batch Setup</h2>
            <input type="text" id="batch_code" placeholder="Enter Batch Code (e.g. SH-191-B1)">
            <button onclick="startBatch()">START BATCH</button>
        </div>

        <!-- SCANNER -->
        <div class="card" id="scanner_screen" style="display:none;">
            <h2 id="display_batch">Batch: --</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="rm_tag" placeholder="Scan Tag...">
                <button onclick="manualScan()" style="width: 30%;">ADD</button>
            </div>
            <div id="reader"></div>
            <button style="background:var(--navy-command); margin-top:10px;" onclick="toggleCamera()">📷 Camera</button>
            
            <h2 style="margin-top:30px;">Live Breakdown</h2>
            <div id="live_inv_breakdown"></div>
        </div>
    </div>

    <script>
        let curB = "";
        function startBatch() {
            curB = document.getElementById('batch_code').value.trim();
            if(!curB) return alert("Enter Batch Code!");
            document.getElementById('display_batch').innerText = "Batch: " + curB;
            document.getElementById('setup_screen').style.display = 'none';
            document.getElementById('scanner_screen').style.display = 'block';
            update();
        }
        async function manualScan() {
            let val = document.getElementById('rm_tag').value.trim();
            if(!val) return;
            await fetch('/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ batch_code: curB, rm_tag: val }) });
            document.getElementById('rm_tag').value = "";
            update();
        }
        async function update() {
            const scans = await fetch(`/current-scans/${curB}`).then(r => r.json());
            const breakdown = scans.reduce((acc, s) => {
                acc[s.ingredient_name || s.product_code] = (acc[s.ingredient_name || s.product_code] || 0) + 1;
                return acc;
            }, {});
            document.getElementById('live_inv_breakdown').innerHTML = Object.entries(breakdown).map(([name, count]) => `
                <div class="inv-card"><span>${name}</span><span>${count} Bags</span></div>
            `).join('');
        }
        function toggleCamera() {
            const rd = document.getElementById('reader');
            if(rd.innerHTML === "") { new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(txt => { document.getElementById('rm_tag').value = txt; manualScan(); }); }
            else { rd.innerHTML = ""; }
        }
    </script>
</body>
</html>
