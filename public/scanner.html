<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; }
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding-bottom: 100px; }
        
        /* Mobile Navigation Bar */
        .nav-top { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--navy-command); display: flex; justify-content: space-around; align-items: center; z-index: 1000; border-top: 4px solid var(--kilrr-orange); }
        .nav-btn { color: white; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; }

        /* Scanner Layout */
        .card { background: white; margin: 15px; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 2px solid #cbd5e1; font-size: 16px; }
        button { padding: 15px 20px; background: var(--kilrr-orange); color: white; border: none; border-radius: 8px; font-weight: bold; }

        /* Inventory Breakdown */
        .inv-card { background: #f1f5f9; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        
        #reader { width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top:0;">Batch Scanner</h2>
        <div class="input-row">
            <input type="text" id="rm_tag" placeholder="Scan or Type Tag...">
            <button onclick="manualScan()">ADD</button>
        </div>
        <div id="reader"></div>
        <button style="width:100%; background:var(--navy-command);" onclick="toggleCamera()">📷 Toggle Camera</button>
    </div>

    <div class="card">
        <h3>Live Ingredient Breakdown</h3>
        <div id="live_inv_breakdown"></div>
    </div>

    <nav class="nav-top">
        <a href="index.html" class="nav-btn">🏠 Hub</a>
        <a href="scanner.html" class="nav-btn" style="color:var(--kilrr-orange);">📷 Scanner</a>
    </nav>

    <script>
        let curB = "CURRENT-BATCH"; // You can link this to your setup screen
        let validRecipeCodes = ["BP-CLN", "COR-CLN", "SALT", "AM", "BE"]; // Add your codes here
        let localScannedTags = [];

        function manualScan() {
            let val = document.getElementById('rm_tag').value.trim();
            processScannedText(val);
        }

        async function processScannedText(txt) {
            let pCode = txt.split('/')[1] || txt;
            
            if(!validRecipeCodes.includes(pCode)) {
                alert("❌ WRONG MATERIAL!");
                return;
            }

            // Save to server
            await fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batch_code: curB, rm_tag: txt })
            });
            
            document.getElementById('rm_tag').value = "";
            update();
        }

        async function update() {
            const scans = await fetch(`/current-scans/${curB}`).then(r => r.json());
            
            const breakdown = scans.reduce((acc, s) => {
                acc[s.ingredient_name || s.product_code] = (acc[s.ingredient_name || s.product_code] || 0) + 1;
                return acc;
            }, {});

            document.getElementById('live_inv_breakdown').innerHTML = Object.entries(breakdown).map(([name, count]) => `
                <div class="inv-card">
                    <span>${name}</span>
                    <span>${count} Bags</span>
                </div>
            `).join('');
        }

        function toggleCamera() {
            const reader = document.getElementById('reader');
            if(reader.innerHTML === "") {
                new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(txt => processScannedText(txt));
            } else {
                reader.innerHTML = "";
            }
        }

        update();
    </script>
</body>
</html>
