<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; }
        body { font-family: sans-serif; background: #f8fafc; margin: 0; padding-bottom: 80px; }
        .card { background: white; margin: 15px; padding: 20px; border-radius: 16px; border: 2px solid #e2e8f0; }
        input { width: 100%; padding: 15px; box-sizing: border-box; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; font-size: 16px; }
        button { width: 100%; padding: 15px; background: var(--kilrr-orange); color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .inv-card { background: #f1f5f9; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .nav-top { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--navy-command); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-btn { color: white; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <!-- SETUP SCREEN -->
    <div class="card" id="setup_screen">
        <h3>Batch Setup</h3>
        <input type="text" id="batch_code" placeholder="Enter Batch Code (e.g. SH-191-B1)">
        <button onclick="startBatch()">START BATCH</button>
    </div>

    <!-- SCANNER SCREEN -->
    <div class="card" id="scanner_screen" style="display:none;">
        <h3 id="display_batch">Batch: --</h3>
        <div style="display:flex; gap:10px;">
            <input type="text" id="rm_tag" placeholder="Scan Tag...">
            <button onclick="manualScan()">ADD</button>
        </div>
        <div id="reader"></div>
        <button onclick="toggleCamera()">📷 Camera</button>
        <h3>Live Ingredient Breakdown</h3>
        <div id="live_inv_breakdown"></div>
    </div>

    <nav class="nav-top">
        <a href="index.html" class="nav-btn">🏠 Hub</a>
        <a href="scanner.html" class="nav-btn" style="color:var(--kilrr-orange);">📷 Scanner</a>
    </nav>

    <script>
        let curB = "";

        function startBatch() {
            curB = document.getElementById('batch_code').value.trim();
            if(!curB) return alert("Enter Batch Code!");
            document.getElementById('display_batch').innerText = "Batch: " + curB;
            document.getElementById('setup_screen').style.display = 'none';
            document.getElementById('scanner_screen').style.display = 'block';
            update();
        }

        async function manualScan() {
            let val = document.getElementById('rm_tag').value.trim();
            if(!val) return;
            await fetch('/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ batch_code: curB, rm_tag: val }) });
            document.getElementById('rm_tag').value = "";
            update();
        }

        async function update() {
            const scans = await fetch(`/current-scans/${curB}`).then(r => r.json());
            const breakdown = scans.reduce((acc, s) => {
                acc[s.ingredient_name || s.product_code] = (acc[s.ingredient_name || s.product_code] || 0) + 1;
                return acc;
            }, {});
            document.getElementById('live_inv_breakdown').innerHTML = Object.entries(breakdown).map(([name, count]) => `
                <div class="inv-card"><span>${name}</span><span>${count} Bags</span></div>
            `).join('');
        }

        function toggleCamera() {
            const rd = document.getElementById('reader');
            if(rd.innerHTML === "") { new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(txt => { document.getElementById('rm_tag').value = txt; manualScan(); }); }
            else { rd.innerHTML = ""; }
        }
    </script>
</body>
</html>
