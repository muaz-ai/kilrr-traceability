<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; }
        
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        
        h2 { margin: 0 0 15px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; color: var(--navy-command);}
        .marathi { font-family: 'Inter', sans-serif; color: var(--kilrr-orange); font-size: 14px; display: block; margin-top: 2px; }
        
        /* TOUCH GRIDS */
        .touch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px;}
        .touch-btn { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 12px 10px; font-weight: 800; font-size: 14px; color: var(--navy-command); cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 60px;}
        .touch-btn.selected { background: #fff7ed; border-color: var(--kilrr-orange); color: var(--kilrr-orange); box-shadow: 0 4px 10px rgba(234,88,12,0.15);}
        .touch-btn.add-btn { border: 2px dashed #94a3b8; color: #64748b; }
        
        input.setup-input, select.setup-input { width: 100%; padding: 16px; box-sizing: border-box; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 15px; background: #fff;}
        input.setup-input:focus, select.setup-input:focus { border-color: var(--kilrr-orange); outline: none; }
        
        button.btn-huge { width: 100%; padding: 20px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; cursor: pointer; text-transform: uppercase; background: var(--kilrr-orange); color: white; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);}
        button.btn-cam { width: 100%; padding: 15px; border: 3px solid var(--kilrr-orange); border-radius: 12px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; cursor: pointer; text-transform: uppercase; background: #fff7ed; color: var(--kilrr-orange); margin-bottom: 15px;}
        
        /* RECIPE CHECKLIST FEED */
        .recipe-feed { border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; background: #f8fafc; margin-bottom: 20px;}
        .feed-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px;}
        .feed-item.done { border-color: var(--success-green); background: #ecfdf5; }
        .feed-name { font-weight: 800; font-size: 16px; color: var(--navy-command); }
        .feed-status { font-weight: 900; font-size: 14px; color: #94a3b8; }
        .feed-item.done .feed-status { color: var(--success-green); }

        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 3px solid #cbd5e1; margin-bottom: 15px; display: none; }
        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s;}

        @media (max-width: 1024px) { 
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; overflow-x: auto; white-space: nowrap;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 5px 10px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 18px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 18px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn active">Scanner</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master Data</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="setup">
            <details style="margin-bottom: 25px; background: #fff7ed; padding: 15px; border-radius: 12px; border: 2px solid #ffedd5;">
                <summary style="font-weight: 900; color: var(--kilrr-orange); cursor: pointer; outline: none; font-size: 16px;">▶ RESUME ACTIVE RUN (चालू काम)</summary>
                <select id="resume_select" class="setup-input" style="margin-top: 15px; margin-bottom: 10px;">
                    <option value="">Select a run to resume...</option>
                </select>
                <button style="width: 100%; padding: 15px; background: var(--kilrr-orange); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="resumeSelectedBatch()">RESUME</button>
            </details>

            <h2>Start New Run <span class="marathi">नवीन काम</span></h2>
            
            <label style="font-weight: 800; font-size: 12px; color: #64748b; display: block; margin-bottom: 8px;">1. WHO IS SCANNING?</label>
            <div class="touch-grid" id="operator_grid"></div>
            
            <label style="font-weight: 800; font-size: 12px; color: #64748b; display: block; margin-bottom: 8px;">2. WHAT ARE WE MAKING?</label>
            <div class="touch-grid" id="recipe_grid"></div>

            <label style="font-weight: 800; font-size: 12px; color: #64748b; display: block; margin-bottom: 8px;">3. LOT & RUN NUMBER</label>
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="lot_input" class="setup-input" placeholder="Lot (e.g. 190)" style="margin-bottom: 0;">
                
                <input type="number" id="run_input" class="setup-input" placeholder="Run # (e.g. 3)" pattern="[0-9]*" inputmode="numeric" style="margin-bottom: 0;">
            </div>
            
            <button class="btn-huge" onclick="startNewBatch()">⚡ GENERATE & START</button>
        </div>
        
        <div class="card" id="work" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #e2e8f0; padding-bottom:15px; margin-bottom:15px;">
                <div>
                    <h2 id="title" style="color:var(--kilrr-orange); font-size:24px; border:none; padding:0; margin:0;"></h2>
                    <span class="marathi" id="active_meta">प्रोडक्शन एरिया</span>
                </div>
                <button style="width:auto; padding:10px 15px; font-weight:900; background:var(--danger-red); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="location.reload()">EXIT</button>
            </div>

            <h3 style="font-family:'Space Grotesk'; font-size:16px; margin-bottom:10px; color:var(--navy-command);">Ingredient Breakdown</h3>
            <div class="recipe-feed" id="recipe_checklist">
                <div style="text-align:center; color:#94a3b8; font-weight:bold;">Loading...</div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom: 10px;">
                <input type="text" id="rm_tag" class="setup-input" style="margin:0; border-color:var(--navy-command);" placeholder="SCAN BARCODE..." autocomplete="off">
                <button style="width:auto; padding:0 25px; background:var(--navy-command); color:white; border:none; border-radius:12px; font-weight:900; cursor:pointer;" onclick="manualScan()">ADD</button>
            </div>
            
            <div id="reader"></div>
            <button class="btn-cam" id="camToggleBtn" onclick="toggleCamera()">📷 Activate Mobile Camera</button>

            <h3 style="font-family:'Space Grotesk'; font-size:14px; margin-top:15px; border-bottom:2px solid #e2e8f0; padding-bottom:5px;">Recent Scans</h3>
            <div id="scanned_items_list" style="max-height: 120px; overflow-y:auto; padding:5px;"></div>
        </div>
    </div>
    
    <script>
        const RECIPE_PREFIXES = {
            "Tandoori": "TAN", "Achaari": "ACH", "Pesto": "BP", "Shawarma": "SH",
            "Dhaniya": "DH", "Pudina": "PUD", "Afghan": "AFG", "Lucknow": "LK",
            "Peri": "PER", "Saza-E-KaaliMirch": "KM", "Gangs of Awadh": "GOA",
            "Curry 9211": "CUR", "Kaalimirch Hathkadi": "KAL", "Palak ka Panchnama": "PAL"
        };

        let operators = JSON.parse(localStorage.getItem('kilrr_ops')) || ["Muaz", "Arbaaz", "Rahul", "Ramesh"];
        let curB="", curF="", curPrefix="", curOp="", validRecipeCodes=[], recipeRequirements=[], localScannedTags=[];
        let html5QrcodeScanner = null;

        function playVoice(success) {
            try {
                let msg = new SpeechSynthesisUtterance(success ? "बरोबर" : "चूक");
                msg.lang = 'mr-IN'; msg.rate = 1.2; window.speechSynthesis.speak(msg);
                if(!success && navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch(e) {}
        }
        function flash(success, txt) { 
            const f = document.getElementById('scan_flash'); 
            f.style.background = success ? 'rgba(5,150,105,0.95)' : 'rgba(220,38,38,0.95)';
            f.innerText = txt; f.style.display='flex'; f.style.opacity='1'; 
            setTimeout(()=>{f.style.opacity='0'; setTimeout(()=>f.style.display='none',200);}, 600); 
        }

        window.onload = async () => { 
            renderOperators();
            renderRecipes();
            
            // Load Active Batches for Resume Dropdown
            try {
                const bRes = await fetch('/open-batches'); 
                const batches = await bRes.json();
                const sel = document.getElementById('resume_select');
                if(batches.length > 0) {
                    batches.forEach(b => {
                        let opt = document.createElement('option');
                        opt.value = JSON.stringify({batch: b.batch_code, recipe: b.fg_code, op: b.operator_name});
                        opt.text = `${b.batch_code} (${b.fg_code})`;
                        sel.appendChild(opt);
                    });
                }
            } catch(e) {}

            document.getElementById('rm_tag').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); manualScan(); }});
        };

        function renderOperators() {
            const grid = document.getElementById('operator_grid');
            grid.innerHTML = operators.map(op => `<div class="touch-btn" onclick="selectOp(this, '${op}')">${op}</div>`).join('') 
                + `<div class="touch-btn add-btn" onclick="addNewOperator()">➕ Add</div>`;
        }

        function renderRecipes() {
            const grid = document.getElementById('recipe_grid');
            grid.innerHTML = Object.keys(RECIPE_PREFIXES).map(name => `<div class="touch-btn" onclick="selectRecipe(this, '${name}', '${RECIPE_PREFIXES[name]}')"><span>${name}</span></div>`).join('');
        }

        function addNewOperator() {
            let name = prompt("Enter new operator name:");
            if(name && name.trim() !== "") {
                operators.push(name.trim());
                localStorage.setItem('kilrr_ops', JSON.stringify(operators));
                renderOperators();
            }
        }

        function selectOp(el, op) { 
            document.getElementById('operator_grid').querySelectorAll('.touch-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected'); curOp = op; 
        }
        function selectRecipe(el, name, prefix) { 
            document.getElementById('recipe_grid').querySelectorAll('.touch-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected'); curF = name; curPrefix = prefix;
        }

        async function resumeSelectedBatch() {
            let val = document.getElementById('resume_select').value;
            if(!val) return alert("Select a batch to resume.");
            let data = JSON.parse(val);
            curB = data.batch; curF = data.recipe; curOp = data.op;
            await loadScannerUI();
        }

        async function startNewBatch() { 
            let lot = document.getElementById('lot_input').value.trim().toUpperCase();
            let runNum = document.getElementById('run_input').value.trim();
            
            if(!curOp) return alert("Please tap an operator!"); 
            if(!curF) return alert("Please tap a recipe!"); 
            if(!lot || !runNum) return alert("Please enter Lot number and Run Number!");
            
            // Automatically appends "B" to the typed number
            curB = `${curPrefix}${lot}-B${runNum}`;
            
            const res = await fetch('/create-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,fg_code:curF,operator_name:curOp})}); 
            const data = await res.json(); 
            if(data.error) return alert("❌ "+data.error); 
            await loadScannerUI(); 
        }

        async function loadScannerUI() { 
            document.getElementById('setup').style.display='none'; 
            document.getElementById('work').style.display='block'; 
            document.getElementById('title').innerText = curB; 
            document.getElementById('active_meta').innerText = `${curF} | Operator: ${curOp}`;
            
            // Fetch Master Data Requirements
            const reqRes = await fetch(`/recipe-requirements/${encodeURIComponent(curF)}`);
            recipeRequirements = await reqRes.json();
            validRecipeCodes = recipeRequirements.map(i => i.product_code);
            
            update(); setTimeout(() => document.getElementById('rm_tag').focus(), 500);
        }

        function toggleCamera() { 
            const rd = document.getElementById('reader'); 
            if(rd.style.display === 'none' || rd.style.display === '') { 
                rd.style.display = 'block'; document.getElementById('camToggleBtn').innerText = "🚫 Close Camera"; 
                if(!html5QrcodeScanner) { 
                    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250}, videoConstraints: { facingMode: "environment" } }); 
                    html5QrcodeScanner.render(txt => { document.getElementById('rm_tag').value = txt; manualScan(); }); 
                } 
            } else { rd.style.display = 'none'; document.getElementById('camToggleBtn').innerText = "📷 Activate Mobile Camera"; } 
        }

        async function manualScan() { 
            let val=document.getElementById('rm_tag').value.trim(); if(!val) return; 
            let cleanTag=val, parts=val.split('/'); if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            let pCode = parts.length >= 2 ? parts[1] : cleanTag;
            
            if(validRecipeCodes.length > 0 && !validRecipeCodes.includes(pCode)) { 
                playVoice(false); flash(false, "❌ REJECTED"); document.getElementById('rm_tag').value=""; return; 
            }
            if(localScannedTags.includes(cleanTag)) { 
                playVoice(false); flash(false, "❌ DUPLICATE"); document.getElementById('rm_tag').value=""; return; 
            }

            await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,rm_tag:cleanTag, operator: curOp})}); 
            playVoice(true); flash(true, "✅ बरोबर"); 
            
            document.getElementById('rm_tag').value=""; update(); document.getElementById('rm_tag').focus();
        }
        
        async function update() { 
            const scans = await fetch(`/current-scans/${encodeURIComponent(curB)}`).then(r=>r.json()); 
            localScannedTags = scans.map(s => s.rm_tag);
            
            // Update Checklist Feed
            if(recipeRequirements.length > 0) {
                const checklistHTML = recipeRequirements.map(req => {
                    const matchedScans = scans.filter(s => s.product_code === req.product_code);
                    const totalKg = matchedScans.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0);
                    const isDone = matchedScans.length > 0;
                    
                    return `
                        <div class="feed-item ${isDone ? 'done' : ''}">
                            <div class="feed-name">${req.ingredient_name || req.product_code} <span style="font-size:12px; color:#94a3b8;">(${req.product_code})</span></div>
                            <div class="feed-status">${isDone ? `✅ ${totalKg.toFixed(2)} KG` : '⏳ Pending'}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('recipe_checklist').innerHTML = checklistHTML;
            } else {
                document.getElementById('recipe_checklist').innerHTML = `<div style="text-align:center; color:var(--danger-red); font-weight:bold;">No ingredients mapped for ${curF}. Check Master Data.</div>`;
            }

            // Update Recent Tags Log
            if(scans.length === 0) { document.getElementById('scanned_items_list').innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:bold; font-size:12px;">No tags yet...</div>`; } 
            else { 
                document.getElementById('scanned_items_list').innerHTML = [...scans].reverse().slice(0, 15).map(s => `
                <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #e2e8f0; font-family:monospace; font-weight:bold; font-size:13px; color:#475569;">
                    <span>${s.rm_tag}</span><span style="color:var(--success-green);">${parseFloat(s.weight||0).toFixed(2)} KG</span>
                </div>`).join(''); 
            }
        }
    </script>
</body>
</html>
