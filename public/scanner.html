<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --card-white: rgba(255, 255, 255, 0.95); --border-heavy: #cbd5e1; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding-bottom: 100px; min-height: 100vh; }
        
        /* Consistent Header */
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 90px; }
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 18px; }
        
        /* Card Layout */
        .card { background: var(--card-white); margin: 30px auto; max-width: 800px; padding: 40px; border-radius: 20px; border: 2px solid var(--border-heavy); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; margin-top: 0; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px; }
        input { width: 100%; padding: 20px; box-sizing: border-box; border-radius: 12px; border: 3px solid var(--border-heavy); font-size: 18px; margin-bottom: 15px; font-weight: 700; }
        button { width: 100%; padding: 20px; background: var(--kilrr-orange); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; }
        
        /* Inventory Breakdown */
        .inv-card { background: #f8fafc; padding: 20px; border-radius: 12px; border: 2px solid #e2e8f0; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800; font-size: 18px; }
        
        /* Mobile Optimization */
        @media (max-width: 1024px) {
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; height: 75px; border-top: 4px solid var(--kilrr-orange); border-bottom: none; justify-content: center; z-index: 1000; }
            .brand { display: none; }
            .nav-links { width: 100%; justify-content: space-around; }
            .card { margin: 15px; padding: 25px; }
        }
    </style>
</head>
<body>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="scanner.html" class="nav-btn" style="color:var(--kilrr-orange);">Scanner</a>
        </div>
    </nav>

    <!-- SETUP SCREEN -->
    <div class="card" id="setup_screen">
        <h2>Batch Setup</h2>
        <input type="text" id="batch_code" placeholder="Enter Batch Code (e.g. SH-191-B1)">
        <button onclick="startBatch()">START BATCH</button>
    </div>

    <!-- SCANNER SCREEN -->
    <div class="card" id="scanner_screen" style="display:none;">
        <h2 id="display_batch">Batch: --</h2>
        <div style="display:flex; gap:10px;">
            <input type="text" id="rm_tag" placeholder="Scan Tag...">
            <button onclick="manualScan()" style="width: 30%;">ADD</button>
        </div>
        <div id="reader"></div>
        <button style="background:var(--navy-command); margin-bottom: 20px;" onclick="toggleCamera()">📷 Toggle Camera</button>
        
        <h2>Live Ingredient Breakdown</h2>
        <div id="live_inv_breakdown"></div>
    </div>

    <script>
        let curB = "";
        function startBatch() {
            curB = document.getElementById('batch_code').value.trim();
            if(!curB) return alert("Enter Batch Code!");
            document.getElementById('display_batch').innerText = "Batch: " + curB;
            document.getElementById('setup_screen').style.display = 'none';
            document.getElementById('scanner_screen').style.display = 'block';
            update();
        }
        async function manualScan() {
            let val = document.getElementById('rm_tag').value.trim();
            if(!val) return;
            await fetch('/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ batch_code: curB, rm_tag: val }) });
            document.getElementById('rm_tag').value = "";
            update();
        }
        async function update() {
            const scans = await fetch(`/current-scans/${curB}`).then(r => r.json());
            const breakdown = scans.reduce((acc, s) => {
                acc[s.ingredient_name || s.product_code] = (acc[s.ingredient_name || s.product_code] || 0) + 1;
                return acc;
            }, {});
            document.getElementById('live_inv_breakdown').innerHTML = Object.entries(breakdown).map(([name, count]) => `
                <div class="inv-card"><span>${name}</span><span>${count} Bags</span></div>
            `).join('');
        }
        function toggleCamera() {
            const rd = document.getElementById('reader');
            if(rd.innerHTML === "") { new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render(txt => { document.getElementById('rm_tag').value = txt; manualScan(); }); }
            else { rd.innerHTML = ""; }
        }
    </script>
</body>
</html>
