<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --card-white: rgba(255, 255, 255, 0.95); --text-dark: #0f172a; --text-mid: #334155; --border-heavy: #cbd5e1; --success-green: #059669; --danger-red: #dc2626; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-dark); margin: 0; padding-bottom: 90px; }
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 80px; position: sticky; top: 0; z-index: 1000;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 900; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 8px;}
        .nav-btn { text-decoration: none; padding: 12px 18px; color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; border-radius: 8px;}
        .nav-btn.active { color: #ffffff; background: var(--kilrr-orange); }
        
        .card { max-width: 900px; margin: 20px auto; background: var(--card-white); border: 2px solid var(--border-heavy); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);}
        h2 { margin: 0 0 20px 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px;}
        .subtitle-marathi { font-family: 'Inter', sans-serif; font-size: 14px; color: var(--kilrr-orange); display: block; margin-top: 5px; }
        
        label { display: block; font-size: 14px; font-weight: 800; color: var(--text-mid); text-transform: uppercase; margin-bottom: 8px;}
        input, select { width: 100%; padding: 16px; box-sizing: border-box; border-radius: 12px; border: 3px solid var(--border-heavy); font-size: 18px; font-weight: 700; margin-bottom: 20px;}
        button { width: 100%; padding: 20px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: var(--kilrr-orange); color: white; }
        .btn-danger { background: var(--danger-red); color: white; }
        .btn-resume { background: #fff7ed; color: var(--kilrr-orange); border: 3px solid var(--kilrr-orange); text-align: left; padding: 20px; font-size: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .summary-box { background: #f8fafc; border: 2px solid var(--border-heavy); border-radius: 16px; padding: 20px; text-align: center; }
        .summary-title { font-size: 14px; font-weight: 800; color: var(--text-mid); text-transform: uppercase; margin-bottom: 5px; }
        .summary-value { font-size: 32px; font-weight: 900; color: var(--navy-command); font-family: 'Space Grotesk', sans-serif; }

        .scanned-list { max-height: 350px; overflow-y: auto; background: #f8fafc; border: 2px solid var(--border-heavy); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .scanned-item { background: white; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tag-text { font-family: 'Space Grotesk', monospace; font-size: 16px; font-weight: 700; }

        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; padding: 40px; font-family: 'Space Grotesk', sans-serif; font-size: 50px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s;}
        .flash-green { background: rgba(5, 150, 105, 0.95); } .flash-red { background: rgba(220, 38, 38, 0.95); }

        @media (max-width: 1024px) { 
            body { padding-bottom: 90px; padding-top: 10px; }
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; height: 75px; padding: 0 5px; border-top: 4px solid var(--kilrr-orange); justify-content: center; }
            .brand { display: none; }
            .nav-links { width: 100%; justify-content: space-between; overflow-x: auto;}
            .nav-btn { font-size: 11px; padding: 8px 10px; flex-direction: column; align-items: center; display: flex; gap: 4px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .card { padding: 20px; margin: 10px;}
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn active">Scanner</a>
        </div>
    </nav>

    <div class="card" id="setup">
        <h2 style="color: var(--success-green); border-bottom: 2px solid #ecfdf5;">Resume Active Run <span class="subtitle-marathi">चालू काम</span></h2>
        <div id="active_batches_container" style="margin-bottom: 30px;">
            <div style="text-align:center; color:#94a3b8; font-weight:800; padding:15px;">Loading open batches...</div>
        </div>

        <h2>Start New Run <span class="subtitle-marathi">नवीन काम</span></h2>
        <input type="text" id="master_lot" placeholder="Lot (e.g. LK-190)" style="text-transform:uppercase;">
        <input type="text" id="sub_batch" placeholder="Run ID (e.g. B3)" style="text-transform:uppercase;">
        <select id="fg_select"><option value="">Select Recipe...</option></select>
        <select id="op_name_setup">
            <option value="" disabled selected>Select Operator...</option>
            <option value="Muaz">Muaz</option><option value="Arbaaz">Arbaaz</option><option value="Rahul">Rahul</option>
        </select>
        <button class="btn-primary" onclick="startNewBatch()">🚀 CREATE & START</button>
    </div>
    
    <div class="card" id="work" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #e2e8f0; padding-bottom:15px; margin-bottom:20px;">
            <div>
                <h2 id="title" style="color:var(--kilrr-orange); font-size:24px; border:none; padding:0; margin:0;"></h2>
                <span class="subtitle-marathi">प्रोडक्शन एरिया</span>
            </div>
            <select id="op_name_live" onchange="updateOperator()" style="width: auto; padding: 8px 15px; font-size: 14px; margin: 0; background: #f8fafc;">
                <option value="Muaz">Muaz</option><option value="Arbaaz">Arbaaz</option><option value="Rahul">Rahul</option>
            </select>
        </div>

        <div class="summary-grid">
            <div class="summary-box">
                <div class="summary-title">Total Bags Scanned</div>
                <div class="summary-value" id="total_bags">0</div>
            </div>
            <div class="summary-box">
                <div class="summary-title">Total Weight (KG)</div>
                <div class="summary-value" id="total_weight" style="color:var(--success-green);">0.00</div>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom: 20px;">
            <input type="text" id="rm_tag_manual" placeholder="SCAN BARCODE..." autocomplete="off" style="margin:0;">
            <button style="width:auto; padding:0 25px; margin:0; background:var(--navy-command);" onclick="manualScan()">ADD</button>
        </div>
        
        <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; display:none; margin-bottom:20px;"></div>
        <button style="background: #fff7ed; color: var(--kilrr-orange); border: 3px solid var(--kilrr-orange); margin-bottom: 20px;" onclick="toggleCamera()" id="camToggleBtn">📷 Activate Mobile Camera</button>

        <h3 style="font-family:'Space Grotesk'; font-size:18px; margin-top:20px; border-bottom:2px solid #e2e8f0; padding-bottom:10px;">Scanned Tags Breakdown</h3>
        <div class="scanned-list" id="scanned_items_list">
            <div style="text-align:center; padding:30px; color:#94a3b8; font-weight:bold;">No bags scanned yet...</div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top: 40px;">
            <button class="btn-primary" style="background:var(--success-green); padding: 25px 0; font-size:20px;" onclick="lockCurrentBatch()">🔒 LOCK BATCH</button>
            <button class="btn-danger" style="padding: 25px 0; font-size:20px;" onclick="deleteCurrentBatch()">🗑️ DELETE BATCH</button>
        </div>
        
        <button style="background:#f1f5f9; color:#334155; margin-top:20px;" onclick="location.reload()">⬅️ Back to Menu</button>
    </div>
    
    <script>
        let curB="", curF="", curOp="", validRecipeCodes=[], localScannedTags=[], html5QrcodeScanner=null;

        window.onload = async () => { 
            // Load Recipes
            const rRes = await fetch('/get-recipes'); const rData = await rRes.json();
            const flavors = [...new Set(rData.map(r=>r.fg_code))].filter(f=>f);
            document.getElementById('fg_select').innerHTML = `<option value="">Select Recipe...</option>` + flavors.map(f => `<option value="${f}">${f}</option>`).join('');
            
            // Load Open Batches (One-Tap Resume)
            const bRes = await fetch('/open-batches'); const batches = await bRes.json();
            const container = document.getElementById('active_batches_container');
            if(batches.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:800; padding:15px; border:2px dashed #cbd5e1; border-radius:12px;">No active runs. Start a new one below.</div>`;
            } else {
                container.innerHTML = batches.map(b => `<button class="btn-resume" onclick="resumeBatch('${b.batch_code}', '${b.fg_code}', '${b.operator_name}')"><span>${b.batch_code}</span> <span style="font-size:14px; color:#475569;">▶ Resume</span></button>`).join('');
            }
        };
        
        async function resumeBatch(batchCode, fgCode, opName) {
            curB = batchCode; curF = fgCode; curOp = opName || "Muaz";
            document.getElementById('op_name_live').value = curOp;
            await loadScannerUI();
        }

        async function startNewBatch() { 
            let lot = document.getElementById('master_lot').value.trim().toUpperCase(); 
            let run = document.getElementById('sub_batch').value.trim().toUpperCase();
            curF = document.getElementById('fg_select').value; 
            curOp = document.getElementById('op_name_setup').value; 
            if(!lot||!run||!curF||!curOp) return alert("Fill all fields!"); 
            
            curB = `${lot}-${run}`;
            const res = await fetch('/create-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,fg_code:curF,operator_name:curOp})}); 
            const data = await res.json(); 
            if(data.error) return alert("❌ "+data.error); 
            document.getElementById('op_name_live').value = curOp;
            await loadScannerUI(); 
        }

        function updateOperator() { curOp = document.getElementById('op_name_live').value; }

        async function loadScannerUI() { 
            document.getElementById('setup').style.display='none'; 
            document.getElementById('work').style.display='block'; 
            document.getElementById('title').innerText= curB; 
            
            const req = await fetch(`/recipe-requirements/${curF}`).then(r=>r.json());
            validRecipeCodes = req.map(i => i.product_code);
            update(); 
        }

        function toggleCamera() { 
            const rd = document.getElementById('reader'); 
            if(rd.style.display==='none' || rd.style.display==='') { 
                rd.style.display='block'; document.getElementById('camToggleBtn').innerText="🚫 Close Camera"; 
                if(!html5QrcodeScanner) { html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: {width: 250, height: 250}, videoConstraints: { facingMode: "environment" } }); html5QrcodeScanner.render(txt => processScannedText(txt)); } 
            } else { rd.style.display='none'; document.getElementById('camToggleBtn').innerText="📷 Activate Mobile Camera"; } 
        }
        
        function manualScan() { let val=document.getElementById('rm_tag_manual').value.trim(); if(val) processScannedText(val); }
        
        async function processScannedText(txt) { 
            let cleanTag=txt, parts=txt.split('/'); 
            if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            let pCode = parts.length >= 2 ? parts[1] : cleanTag;
            
            if(!validRecipeCodes.includes(pCode)) {
                showFlash(false, "❌ REJECTED (Recipe)"); document.getElementById('rm_tag_manual').value=""; return; 
            }
            if(localScannedTags.includes(cleanTag)) {
                showFlash(false, "❌ DUPLICATE SCAN"); document.getElementById('rm_tag_manual').value=""; return; 
            }

            await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,rm_tag:cleanTag})}); 
            showFlash(true, "✅ SCANNED"); document.getElementById('rm_tag_manual').value=""; update(); 
        }
        
        async function update() { 
            const scans = await fetch(`/current-scans/${curB}`).then(r=>r.json()); 
            localScannedTags = scans.map(s => s.rm_tag);

            let totalBags = scans.length;
            let totalWeight = scans.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0);

            document.getElementById('total_bags').innerText = totalBags;
            document.getElementById('total_weight').innerText = totalWeight.toFixed(2);

            if(scans.length === 0) {
                document.getElementById('scanned_items_list').innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8; font-weight:bold;">No bags scanned yet...</div>`;
            } else {
                document.getElementById('scanned_items_list').innerHTML = scans.map(s => `
                    <div class="scanned-item">
                        <span class="tag-text">${s.rm_tag}</span>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <span style="font-weight:900; color:var(--success-green);">${parseFloat(s.weight||0).toFixed(1)} KG</span>
                            <button style="background:#fee2e2; color:var(--danger-red); border:none; padding:8px 16px; border-radius:6px; font-weight:900; cursor:pointer;" onclick="deleteScan('${s.rm_tag}')">🗑️ VOID</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function deleteScan(rmTag) {
            let pin = prompt("Enter Manager PIN (1234) to delete this scanned item:");
            if(!pin) return;
            const res = await fetch('/delete-specific-scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pin, batch_code: curB, rm_tag: rmTag })
            });
            const data = await res.json();
            if(data.error) return alert("❌ " + data.error);
            showFlash(true, "🗑️ VOIDED");
            update();
        }

        async function lockCurrentBatch() {
            if(!confirm("🔒 Finalize and Lock this Batch?")) return;
            await fetch('/lock-batch', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ batch_code: curB }) });
            alert("✅ Batch locked successfully!");
            location.reload();
        }

        async function deleteCurrentBatch() {
            let pin = prompt("Enter Manager PIN (1234) to delete the ENTIRE batch:");
            if(!pin) return;
            const res = await fetch('/delete-batch', {
                method: 'POST',
                headers: { 'Content-Type':'application/json' },
                body: JSON.stringify({ pin: pin, batch_code: curB })
            });
            const data = await res.json();
            if(data.error) return alert("❌ " + data.error);
            alert("🗑️ Batch deleted completely.");
            location.reload();
        }

        function showFlash(success, msg) { const f = document.getElementById('scan_flash'); f.className = success ? 'flash-green' : 'flash-red'; f.innerText = msg; f.style.display='flex'; f.style.opacity='1'; setTimeout(()=>{f.style.opacity='0'; setTimeout(()=>f.style.display='none',200);}, 600); }
    </script>
</body>
</html>
