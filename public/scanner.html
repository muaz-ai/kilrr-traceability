<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - Scanner</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; }
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        
        h2 { margin: 0 0 20px 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--navy-command);}
        .marathi { font-family: 'Inter', sans-serif; color: var(--kilrr-orange); font-size: 14px; display: block; margin-top: 4px; }
        
        /* TOUCH GRID UI */
        .touch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 25px;}
        .touch-btn { background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 12px; padding: 15px; font-weight: 800; font-size: 16px; color: var(--navy-command); cursor: pointer; text-align: center; transition: 0.2s;}
        .touch-btn.selected { background: #fff7ed; border-color: var(--kilrr-orange); color: var(--kilrr-orange); }
        
        input.setup-input { width: 100%; padding: 20px; box-sizing: border-box; border-radius: 12px; border: 3px solid #cbd5e1; font-size: 20px; font-weight: 800; font-family: 'Space Grotesk', sans-serif; margin-bottom: 25px; text-transform: uppercase;}
        input.setup-input:focus { border-color: var(--kilrr-orange); outline: none; }
        
        button.btn-huge { width: 100%; padding: 25px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 22px; cursor: pointer; text-transform: uppercase; background: var(--kilrr-orange); color: white; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);}
        
        .active-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .resume-pill { background: #fff7ed; border: 2px solid var(--kilrr-orange); color: var(--kilrr-orange); padding: 15px; border-radius: 10px; font-weight: 800; font-family: 'Space Grotesk'; font-size: 16px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center;}
        
        .btn-undo { background: #fef08a; color: #854d0e; border: 3px solid #eab308; display: none; margin-bottom: 20px; font-size: 20px; width: 100%; padding: 20px; border-radius: 12px; font-weight: 900; cursor: pointer;}
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .summary-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; text-align: center; }
        .val-text { font-size: 32px; font-family: 'Space Grotesk'; font-weight: 900; color: var(--navy-command); }
        
        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s;}

        @media (max-width: 1024px) { 
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; }
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; }
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; }
            .touch-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn active">Scanner</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" id="setup">
            <h2 style="color: var(--success-green); border-bottom-color: #ecfdf5;">Resume Run <span class="marathi">चालू काम</span></h2>
            <div class="active-grid" id="active_batches">Loading...</div>

            <h2 style="margin-top: 40px;">Start New Run <span class="marathi">नवीन काम</span></h2>
            
            <label style="font-weight: 800; font-size: 14px; color: var(--text-mid); display: block; margin-bottom: 8px;">1. ASSIGN BATCH CODE</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="master_lot" class="setup-input" placeholder="Lot (e.g. LK-190)">
                <input type="text" id="sub_batch" class="setup-input" placeholder="Run (e.g. B3)">
            </div>

            <label style="font-weight: 800; font-size: 14px; color: var(--text-mid); display: block; margin-bottom: 8px;">2. SELECT RECIPE (TAP)</label>
            <div class="touch-grid" id="recipe_grid">Loading...</div>
            
            <label style="font-weight: 800; font-size: 14px; color: var(--text-mid); display: block; margin-bottom: 8px;">3. SELECT OPERATOR (TAP)</label>
            <div class="touch-grid">
                <div class="touch-btn" onclick="selectOp(this, 'Muaz')">Muaz</div>
                <div class="touch-btn" onclick="selectOp(this, 'Arbaaz')">Arbaaz</div>
                <div class="touch-btn" onclick="selectOp(this, 'Rahul')">Rahul</div>
            </div>
            
            <button class="btn-huge" onclick="startNewBatch()">⚡ START PRODUCTION</button>
        </div>
        
        <div class="card" id="work" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #e2e8f0; padding-bottom:15px; margin-bottom:20px;">
                <div>
                    <h2 id="title" style="color:var(--kilrr-orange); font-size:28px; border:none; padding:0; margin:0;"></h2>
                    <span class="marathi">प्रोडक्शन एरिया</span>
                </div>
                <button style="width:auto; padding:12px 20px; font-weight:900; background:var(--danger-red); color:white; border:none; border-radius:8px; cursor:pointer;" onclick="location.reload()">EXIT</button>
            </div>

            <div class="summary-grid">
                <div class="summary-box">
                    <div style="font-size:12px; font-weight:bold; color:var(--text-mid);">TOTAL BAGS</div>
                    <div class="val-text" id="total_bags">0</div>
                </div>
                <div class="summary-box">
                    <div style="font-size:12px; font-weight:bold; color:var(--text-mid);">TOTAL WEIGHT</div>
                    <div class="val-text" id="total_weight" style="color:var(--success-green);">0.00 KG</div>
                </div>
            </div>

            <button class="btn-undo" id="undo_btn" onclick="undoLastScan()">⚠️ UNDO LAST SCAN (30s)</button>

            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="rm_tag" class="setup-input" style="margin:0; border-color:var(--navy-command);" placeholder="SCAN BARCODE..." autocomplete="off">
                <button style="width:auto; padding:0 30px; background:var(--navy-command); color:white; border:none; border-radius:12px; font-weight:900; cursor:pointer;" onclick="manualScan()">ADD</button>
            </div>

            <div id="scanned_items_list" style="max-height: 250px; overflow-y:auto; border:2px solid #e2e8f0; border-radius:12px; padding:10px; background:#f8fafc;"></div>
        </div>
    </div>
    
    <script>
        let curB="", curF="", curOp="", validRecipeCodes=[], localScannedTags=[];
        let lastScanTag = null, undoTimer = null, undoCountdown = 0;

        function playVoice(success) {
            try {
                let msg = new SpeechSynthesisUtterance(success ? "बरोबर" : "चूक");
                msg.lang = 'mr-IN'; msg.rate = 1.2; window.speechSynthesis.speak(msg);
                if(!success && navigator.vibrate) navigator.vibrate([200, 100, 200]);
            } catch(e) {}
        }
        function flash(success, txt) { 
            const f = document.getElementById('scan_flash'); 
            f.style.background = success ? 'rgba(5,150,105,0.95)' : 'rgba(220,38,38,0.95)';
            f.innerText = txt; f.style.display='flex'; f.style.opacity='1'; 
            setTimeout(()=>{f.style.opacity='0'; setTimeout(()=>f.style.display='none',200);}, 600); 
        }

        window.onload = async () => { 
            const rRes = await fetch('/get-recipes'); const rData = await rRes.json();
            const flavors = [...new Set(rData.map(r=>r.fg_code))].filter(f=>f);
            document.getElementById('recipe_grid').innerHTML = flavors.map(f => `<div class="touch-btn" onclick="selectRecipe(this, '${f}')">${f}</div>`).join('');
            
            const bRes = await fetch('/open-batches'); const batches = await bRes.json();
            const container = document.getElementById('active_batches');
            if(batches.length === 0) container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:800; grid-column: 1 / -1;">No active runs.</div>`;
            else container.innerHTML = batches.map(b => `<button class="resume-pill" onclick="resumeBatch('${b.batch_code}', '${b.fg_code}')"><span>${b.batch_code}</span> <span>▶</span></button>`).join('');
            
            document.getElementById('rm_tag').addEventListener('keypress', e => { if(e.key === 'Enter'){ e.preventDefault(); manualScan(); }});
        };
        
        function selectRecipe(el, fg) { 
            document.getElementById('recipe_grid').querySelectorAll('.touch-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected'); curF = fg; 
        }
        function selectOp(el, op) { 
            el.parentElement.querySelectorAll('.touch-btn').forEach(btn => btn.classList.remove('selected'));
            el.classList.add('selected'); curOp = op; 
        }

        async function resumeBatch(batchCode, fgCode) { curB = batchCode; curF = fgCode; await loadScannerUI(); }

        async function startNewBatch() { 
            let lot = document.getElementById('master_lot').value.trim().toUpperCase();
            let run = document.getElementById('sub_batch').value.trim().toUpperCase();
            
            if(!lot || !run) return alert("Please assign a Lot and Run ID!");
            if(!curF) return alert("Please tap a recipe!"); 
            if(!curOp) return alert("Please tap an operator!"); 
            
            curB = `${lot}-${run}`;
            const res = await fetch('/create-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,fg_code:curF,operator_name:curOp})}); 
            const data = await res.json(); 
            if(data.error) return alert("❌ "+data.error); 
            await loadScannerUI(); 
        }

        async function loadScannerUI() { 
            document.getElementById('setup').style.display='none'; 
            document.getElementById('work').style.display='block'; 
            document.getElementById('title').innerText = curB; 
            const req = await fetch(`/recipe-requirements/${curF}`).then(r=>r.json());
            validRecipeCodes = req.map(i => i.product_code);
            update(); setTimeout(() => document.getElementById('rm_tag').focus(), 500);
        }

        async function manualScan() { 
            let val=document.getElementById('rm_tag').value.trim(); if(!val) return; 
            let cleanTag=val, parts=val.split('/'); if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            let pCode = parts.length >= 2 ? parts[1] : cleanTag;
            
            if(!validRecipeCodes.includes(pCode)) { playVoice(false); flash(false, "❌ REJECTED"); document.getElementById('rm_tag').value=""; return; }
            if(localScannedTags.includes(cleanTag)) { playVoice(false); flash(false, "❌ DUPLICATE"); document.getElementById('rm_tag').value=""; return; }

            await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,rm_tag:cleanTag})}); 
            playVoice(true); flash(true, "✅ बरोबर"); 
            
            lastScanTag = cleanTag; startUndoTimer();
            document.getElementById('rm_tag').value=""; update(); document.getElementById('rm_tag').focus();
        }

        function startUndoTimer() {
            clearInterval(undoTimer); undoCountdown = 30;
            const btn = document.getElementById('undo_btn'); btn.style.display = 'block'; btn.innerText = `⚠️ UNDO LAST SCAN (${undoCountdown}s)`;
            undoTimer = setInterval(() => {
                undoCountdown--; btn.innerText = `⚠️ UNDO LAST SCAN (${undoCountdown}s)`;
                if(undoCountdown <= 0) { clearInterval(undoTimer); btn.style.display = 'none'; lastScanTag = null; }
            }, 1000);
        }

        async function undoLastScan() {
            if(!lastScanTag) return;
            clearInterval(undoTimer); document.getElementById('undo_btn').style.display = 'none';
            await fetch('/undo-scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ batch_code: curB, rm_tag: lastScanTag }) });
            flash(true, "🗑️ UNDONE"); lastScanTag = null; update(); document.getElementById('rm_tag').focus();
        }
        
        async function update() { 
            const scans = await fetch(`/current-scans/${curB}`).then(r=>r.json()); 
            localScannedTags = scans.map(s => s.rm_tag);
            document.getElementById('total_bags').innerText = scans.length;
            document.getElementById('total_weight').innerText = scans.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0).toFixed(2) + " KG";

            if(scans.length === 0) { document.getElementById('scanned_items_list').innerHTML = `<div style="text-align:center; padding:20px; color:#94a3b8; font-weight:bold;">No tags yet...</div>`; } 
            else { document.getElementById('scanned_items_list').innerHTML = scans.map(s => `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:2px solid #e2e8f0; background:white; border-radius:8px; margin-bottom:8px; font-family:monospace; font-weight:bold; font-size:16px;"><span>${s.rm_tag}</span><span style="color:var(--success-green);">${parseFloat(s.weight||0).toFixed(1)} KG</span></div>`).join(''); }
        }
    </script>
</body>
</html>
