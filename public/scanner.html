<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr OS - Scanner Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; --accent-blue: #2563eb; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 50px;}
        
        .nav-top { background: var(--navy-command); border-bottom: 4px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; transition: 0.2s;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white;}
        .nav-btn.active { color: white; background: var(--kilrr-orange);}

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        
        /* CARD UI */
        .card { background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; position: relative; margin-bottom: 30px;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--kilrr-orange); border-radius: 16px 16px 0 0;}

        h2 { margin: 0 0 5px 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; text-transform: uppercase; color: var(--navy-command);}
        .marathi-title { font-family: 'Inter', sans-serif; color: var(--kilrr-orange); font-size: 14px; font-weight: 800; display: block; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;}

        /* LIST ITEMS */
        .batch-list { max-height: 350px; overflow-y: auto; background: #fff7ed; padding: 15px; border-radius: 12px; border: 2px solid #fdba74;}
        .batch-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 10px; transition: 0.2s;}
        .batch-item:hover { border-color: var(--kilrr-orange); box-shadow: 0 4px 10px rgba(234, 88, 12, 0.1);}
        .batch-title { font-weight: 900; font-size: 18px; color: var(--navy-command); margin-bottom: 4px; display: block;}
        .batch-sub { color: #64748b; font-size: 13px; font-weight: 700; font-family: 'Inter'; }
        
        .action-btns { display: flex; gap: 8px;}
        .btn-action { border: none; padding: 12px 18px; border-radius: 8px; font-weight: 900; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: 0.1s;}
        .btn-action:active { transform: scale(0.95); }
        .btn-action.play { background: var(--success-green); font-size: 18px;}
        .btn-action.close { background: var(--accent-blue); font-size: 18px;}

        /* SELECTION GRIDS */
        .grid-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px;}
        .grid-item { background: white; border: 2px solid #cbd5e1; padding: 20px 10px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; color: var(--navy-command);}
        .grid-item:hover { border-color: var(--kilrr-orange); background: #fff7ed;}
        .grid-item.active { border-color: var(--kilrr-orange); background: var(--kilrr-orange); color: white; box-shadow: 0 4px 15px rgba(234, 88, 12, 0.3);}
        
        label { font-weight: 800; font-size: 13px; color: var(--navy-command); display: block; margin-bottom: 12px; text-transform: uppercase;}
        
        /* SCANNER VIEW */
        #scan_view { display: none; }
        .scanner-header { background: var(--navy-command); color: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; text-align: center;}
        .scanner-title { font-family: 'Space Grotesk'; font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase; color: var(--kilrr-orange);}
        .scanner-sub { font-size: 14px; font-weight: 700; margin-top: 5px;}

        input { width: 100%; padding: 16px 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 15px; transition: 0.2s;}
        input:focus { border-color: var(--kilrr-orange); outline: none;}

        .req-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;}
        .req-pill { background: white; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between;}
        .req-pill.done { background: #ecfdf5; border-color: var(--success-green); color: var(--success-green);}
        
        .scan-history { max-height: 200px; overflow-y: auto; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px;}
        .scan-item { display: flex; justify-content: space-between; padding: 10px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px; font-family: monospace; font-weight: bold; font-size: 14px;}

        @media (max-width: 1024px) { 
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; justify-content: space-around; overflow-x: auto; white-space: nowrap; border-top: 3px solid var(--kilrr-orange); z-index: 999;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 8px 12px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; margin-bottom: 4px;}
            .card { padding: 20px;}
            .req-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inward</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn active">Scanner</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container" id="setup_view">
        <div class="card">
            <h2>Resume Active Run</h2>
            <span class="marathi-title">चालू काम परत उघडा</span>
            
            <input type="text" id="search_batches" placeholder="🔍 Search open batches..." oninput="renderOpenBatches()">
            <div class="batch-list" id="open_batches_list">
                <div style="text-align:center; padding:20px; color:#94a3b8; font-weight:bold;">Loading...</div>
            </div>
        </div>

        <div class="card">
            <h2>Start New Run</h2>
            <span class="marathi-title">नवीन काम चालू करा</span>

            <label>1. कोण स्कॅन करत आहे? (WHO IS SCANNING?)</label>
            <div class="grid-select" id="operator_grid">
                <div class="grid-item" onclick="selectOperator('Muaz', this)">Muaz</div>
                <div class="grid-item" onclick="selectOperator('Arbaaz', this)">Arbaaz</div>
                <div class="grid-item" style="border-style:dashed; color:#64748b;" onclick="customOperator(this)">+ Add</div>
            </div>

            <label>2. आपण काय बनवत आहोत? (WHAT ARE WE MAKING?)</label>
            <div class="grid-select" id="recipe_grid">
                <div style="grid-column: 1/-1; text-align:center; color:#94a3b8; font-weight:bold;">Loading Recipes...</div>
            </div>
        </div>
    </div>

    <!-- SCANNER VIEW -->
    <div class="container" id="scan_view">
        <div class="card" style="border-top:6px solid var(--success-green);">
            <div class="scanner-header">
                <h1 class="scanner-title" id="scan_fg_name">RECIPE NAME</h1>
                <div class="scanner-sub">Batch: <span id="scan_batch_code" style="color:var(--kilrr-orange);">BATCH-01</span> | Operator: <span id="scan_op">MUAZ</span></div>
            </div>

            <label>काय काय टाकायचे आहे? (INGREDIENTS REQUIRED)</label>
            <div class="req-list" id="scan_reqs">Loading...</div>

            <label>बारकोड स्कॅन करा (SCAN HERE)</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="scan_input" placeholder="Scan barcode..." autocomplete="off" style="margin:0;" onkeypress="if(event.key === 'Enter') submitScan()">
                <button onclick="submitScan()" style="background:var(--navy-command); color:white; border:none; border-radius:10px; font-weight:900; padding:0 30px; cursor:pointer;">ADD</button>
            </div>

            <label style="margin-top:25px;">आत्ताच स्कॅन केलेले (ACTIVE SCANS)</label>
            <div class="scan-history" id="scan_history">Loading...</div>

            <button onclick="closeCurrentRun()" style="width:100%; margin-top:20px; background:var(--accent-blue); color:white; border:none; padding:20px; border-radius:12px; font-size:18px; font-weight:900; font-family:'Space Grotesk'; cursor:pointer; box-shadow: 0 5px 15px rgba(37,99,235,0.3);">✔ काम संपले (FINISH & CLOSE BATCH)</button>
            
            <div style="text-align:center; margin-top:15px;">
                <a href="#" onclick="backToSetup()" style="color:#64748b; font-weight:bold; font-size:14px; text-decoration:none;">← Back to Hub (Leaves batch open)</a>
            </div>
        </div>
    </div>

    <script>
        let allBatches = [];
        let allRecipes = [];
        let selectedOperator = null;
        let selectedRecipeFG = null;
        
        // Active Scan State
        let activeBatchCode = null;
        let activeFGCode = null;
        let activeReqs = [];
        let activeScans = [];

        window.onload = () => {
            loadOpenBatches();
            loadRecipes();
        };

        // --- SETUP VIEW LOGIC ---
        async function loadOpenBatches() {
            try {
                const res = await fetch('/open-batches');
                allBatches = await res.json();
                renderOpenBatches();
            } catch(e) { console.error("Error loading batches"); }
        }

        function renderOpenBatches() {
            const list = document.getElementById('open_batches_list');
            const search = document.getElementById('search_batches').value.toLowerCase();
            
            const filtered = allBatches.filter(b => 
                b.batch_code.toLowerCase().includes(search) || 
                b.fg_code.toLowerCase().includes(search)
            );

            if(filtered.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:bold; padding:20px;">No active runs found.</div>`;
                return;
            }

            list.innerHTML = filtered.map(b => `
                <div class="batch-item">
                    <div>
                        <span class="batch-title">${b.batch_code}</span>
                        <span class="batch-sub">${b.fg_code} | ${b.operator_name}</span>
                    </div>
                    <div class="action-btns">
                        <!-- SOFT CLOSE (Saves Data for FSSAI) -->
                        <button class="btn-action close" onclick="closeBatchList('${b.batch_code}')">✔</button>
                        <!-- RESUME RUN -->
                        <button class="btn-action play" onclick="resumeRun('${b.batch_code}', '${b.fg_code}', '${b.operator_name}')">►</button>
                    </div>
                </div>
            `).join('');
        }

        async function loadRecipes() {
            try {
                const res = await fetch('/get-recipes');
                const raw = await res.json();
                const uniqueFG = [...new Set(raw.map(r => r.fg_code))]; // Get unique recipe names
                
                document.getElementById('recipe_grid').innerHTML = uniqueFG.map(fg => `
                    <div class="grid-item" onclick="startNewRun('${fg}', this)">${fg}</div>
                `).join('');
            } catch(e) { console.error("Error loading recipes"); }
        }

        function selectOperator(name, el) {
            selectedOperator = name;
            document.querySelectorAll('#operator_grid .grid-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function customOperator(el) {
            let name = prompt("Enter Operator Name:");
            if(name) { selectOperator(name, el); el.textContent = name; el.style.borderStyle = 'solid'; }
        }

        async function startNewRun(fgName, el) {
            if(!selectedOperator) return alert("⚠️ Please select WHO IS SCANNING first!");
            
            let batchCode = prompt(`Enter a Batch Code for ${fgName}:\n(e.g., ${fgName.substring(0,3).toUpperCase()}-123)`);
            if(!batchCode) return;
            batchCode = batchCode.trim().toUpperCase();

            try {
                const res = await fetch('/create-batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_code: batchCode, fg_code: fgName, operator_name: selectedOperator })
                });
                const data = await res.json();
                if(data.error) return alert(data.error);

                // Auto-launch the scanner
                resumeRun(batchCode, fgName, selectedOperator);
            } catch(e) { alert("Database Error"); }
        }

        // FSSAI SOFT CLOSE FROM HUB
        async function closeBatchList(batchCode) {
            if(!confirm(`Are you sure you want to Complete & Close batch ${batchCode}?`)) return;
            try {
                await fetch('/close-batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_code: batchCode })
                });
                loadOpenBatches(); // Refresh list immediately
            } catch(e) { alert("Error closing batch"); }
        }

        // --- SCANNER VIEW LOGIC ---
        async function resumeRun(batchCode, fgCode, opName) {
            document.getElementById('setup_view').style.display = 'none';
            document.getElementById('scan_view').style.display = 'block';

            activeBatchCode = batchCode;
            activeFGCode = fgCode;
            
            document.getElementById('scan_fg_name').textContent = fgCode;
            document.getElementById('scan_batch_code').textContent = batchCode;
            document.getElementById('scan_op').textContent = opName;

            await loadReqs();
            await loadScans();
            document.getElementById('scan_input').focus();
        }

        function backToSetup() {
            document.getElementById('scan_view').style.display = 'none';
            document.getElementById('setup_view').style.display = 'block';
            loadOpenBatches();
        }

        async function loadReqs() {
            try {
                const res = await fetch(`/recipe-requirements/${encodeURIComponent(activeFGCode)}`);
                activeReqs = await res.json();
                renderReqs();
            } catch(e) { console.error(e); }
        }

        async function loadScans() {
            try {
                const res = await fetch(`/current-scans/${activeBatchCode}`);
                activeScans = await res.json();
                renderScans();
                renderReqs(); // Update checkmarks based on scans
            } catch(e) { console.error(e); }
        }

        function renderReqs() {
            const list = document.getElementById('scan_reqs');
            if(activeReqs.length === 0) {
                list.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--kilrr-orange); font-weight:bold;">No strict recipe found. Free Scanning allowed.</div>`;
                return;
            }

            list.innerHTML = activeReqs.map(r => {
                if(!r.product_code || r.product_code === 'null') return '';
                // Check if this product code has been scanned
                let isScanned = activeScans.some(s => s.product_code === r.product_code);
                if(isScanned) {
                    return `<div class="req-pill done"><span>${r.ingredient_name}</span> <span>✔</span></div>`;
                } else {
                    return `<div class="req-pill"><span style="color:#64748b;">${r.ingredient_name}</span> <span style="color:var(--kilrr-orange);">⏳</span></div>`;
                }
            }).join('');
        }

        function renderScans() {
            const list = document.getElementById('scan_history');
            if(activeScans.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:bold; padding:20px;">No ingredients scanned yet.</div>`;
                return;
            }

            list.innerHTML = activeScans.map(s => `
                <div class="scan-item">
                    <span>${s.rm_tag}</span>
                    <button class="btn-action" style="background:transparent; color:var(--danger-red); font-size:16px; padding:0;" onclick="undoScan('${s.rm_tag}')">✖</button>
                </div>
            `).join('');
        }

        async function submitScan() {
            const inp = document.getElementById('scan_input');
            const barcode = inp.value.trim().toUpperCase();
            if(!barcode) return;
            
            // FSSAI Strict Verification
            if(activeReqs.length > 0) {
                let parts = barcode.split('/');
                let pCode = parts.length >= 2 ? parts[1] : barcode;
                let isValid = activeReqs.some(r => r.product_code === pCode);
                if(!isValid) {
                    inp.value = '';
                    return alert(`🛑 STOP! \n\n[ ${pCode} ] is NOT required to make ${activeFGCode}!`);
                }
            }

            try {
                const res = await fetch('/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_code: activeBatchCode, rm_tag: barcode, operator: document.getElementById('scan_op').textContent })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error);
                
                inp.value = '';
                await loadScans(); // Refresh live data
            } catch(e) { alert("Scan Failed: " + e.message); }
        }

        async function undoScan(tag) {
            try {
                const res = await fetch('/undo-scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_code: activeBatchCode, rm_tag: tag })
                });
                await loadScans();
            } catch(e) { alert("Undo Failed."); }
        }

        // FSSAI SOFT CLOSE FROM SCANNER VIEW
        async function closeCurrentRun() {
            if(!confirm(`Finish and Close Batch ${activeBatchCode}? \n(Data will be saved for Traceability)`)) return;
            try {
                await fetch('/close-batch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ batch_code: activeBatchCode })
                });
                backToSetup(); // Go back to hub, list will auto-refresh
            } catch(e) { alert("Error closing batch"); }
        }
    </script>
</body>
</html>
