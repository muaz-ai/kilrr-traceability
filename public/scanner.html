<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Traceability - Batch Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --card-white: rgba(255, 255, 255, 0.95); --text-dark: #0f172a; --text-mid: #334155; --border-heavy: #cbd5e1; --success-green: #059669; --danger-red: #dc2626; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--text-dark); margin: 0; padding-bottom: 120px; position: relative; overflow-x: hidden; min-height: 100vh; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6; pointer-events: none;}
        .orb-1 { width: 600px; height: 600px; background: rgba(234, 88, 12, 0.35); top: -100px; left: -150px; }
        .orb-2 { width: 700px; height: 700px; background: rgba(56, 189, 248, 0.25); bottom: -200px; right: -150px; }
        
        .nav-top { background: var(--navy-command); border-bottom: 6px solid var(--kilrr-orange); padding: 0 40px; display: flex; justify-content: space-between; align-items: center; height: 90px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.15); overflow-x: auto;}
        .brand { display: flex; align-items: center; gap: 15px; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px;}
        .brand img { height: 45px; background: white; padding: 5px; border-radius: 8px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 8px; align-items: center; white-space: nowrap;}
        .nav-btn { text-decoration: none; padding: 14px 22px; color: #94a3b8; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; border-radius: 8px; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #ffffff; }
        .nav-btn.active { color: #ffffff; background: var(--kilrr-orange); }
        .nav-btn.logout { color: #fca5a5; border: 2px solid #ef4444; padding: 12px 20px;} 
        
        .card { margin: 40px auto; background: var(--card-white); backdrop-filter: blur(20px); border: 2px solid var(--border-heavy); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: var(--kilrr-orange); }
        
        #setup { max-width: 950px; }
        #work { max-width: 1450px; }

        h2 { margin: 0 0 35px 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; padding-bottom: 20px;}
        
        label { display: block; font-size: 16px; font-weight: 800; color: var(--text-mid); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        input, select { width: 100%; padding: 22px; box-sizing: border-box; border-radius: 12px; border: 3px solid var(--border-heavy); font-size: 20px; font-family: 'Inter', sans-serif; font-weight: 700; background: #ffffff; margin-bottom: 30px; transition: 0.2s;}
        input:focus, select:focus { border-color: var(--kilrr-orange); outline: none; box-shadow: 0 0 0 5px rgba(234, 88, 12, 0.15); }
        
        .custom-dropdown-container { position: relative; width: 100%; }
        .custom-dropdown-list { position: absolute; top: calc(100% - 25px); left: 0; right: 0; background: #ffffff; border: 3px solid var(--kilrr-orange); border-radius: 12px; max-height: 350px; overflow-y: auto; z-index: 9999; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2); display: none; padding: 10px; }
        .custom-dropdown-item { padding: 18px 20px; font-size: 18px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.1s; margin-bottom: 4px; }
        .custom-dropdown-item:hover, .custom-dropdown-item.active-item { background: #fff7ed; color: var(--kilrr-orange); }

        button { width: 100%; padding: 25px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.2s; margin-bottom: 15px; }
        .btn-primary { background: var(--kilrr-orange); color: #ffffff; box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3); }
        .btn-manual { background: #fff7ed; color: var(--kilrr-orange); border: 3px solid var(--kilrr-orange); }
        .btn-danger { background: #ffffff; color: var(--danger-red); border: 3px solid #fecaca; margin-top:20px;}
        .btn-lock { background: var(--navy-command); color: white; box-shadow: 0 10px 25px rgba(11, 17, 33, 0.3);}

        .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
        
        .setup-row { display: flex; gap: 15px; }
        .action-row { display: flex; gap: 15px; margin-top: 30px; }
        .hybrid-input-row { display: flex; gap: 15px; }
        
        /* 🔥 MOBILE APP INTERFACE UPGRADE 🔥 */
        @media (max-width: 1024px) { 
            .work-grid { grid-template-columns: 1fr; gap: 30px;} 
            .nav-top { 
                position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: 75px; padding: 0 10px; border-bottom: none; border-top: 4px solid var(--kilrr-orange); justify-content: center; box-shadow: 0 -10px 20px rgba(0,0,0,0.15);
            }
            .brand { display: none; }
            .nav-links { width: 100%; justify-content: space-between; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 5px; }
            .nav-btn { font-size: 13px; padding: 10px 12px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
            .nav-btn.logout { display: none; }
            
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 18px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 18px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 18px; }
            
            .card { padding: 25px; margin: 15px; border-radius: 16px;}
            h2 { font-size: 24px; }

            /* Fix Squeezing on Mobile */
            .setup-row { flex-direction: column; gap: 0; }
            .setup-row > div { margin-bottom: 10px; }
            .hybrid-input-row { flex-direction: column; gap: 10px; }
            .btn-add-manual { width: 100% !important; padding: 20px !important; margin: 0 !important; }
            .action-row { flex-direction: column; gap: 10px; margin-top: 15px;}
            .action-row button { width: 100%; margin: 0; }
            
            .manual-box { padding: 20px !important; }
            .manual-box input { font-size: 20px !important; padding: 18px !important; }
            .metrics-bar { flex-direction: column; }
        }
        
        .manual-box { background: #f8fafc; padding: 30px; border: 3px dashed var(--border-heavy); border-radius: 20px; margin-bottom: 30px; text-align: center; }
        .manual-box input { border-color: var(--navy-command); margin: 0; text-align: center; font-size: 28px; font-weight: 900; text-transform: uppercase;}
        .btn-add-manual { background: var(--navy-command); width: auto; padding: 0 40px; margin: 0; border-radius: 12px; color: white;}
        
        #reader { width: 100%; border-radius: 20px; overflow: hidden; border: 4px solid var(--border-heavy); margin-bottom: 30px; background: black;}
        h3 { font-size: 22px; font-family: 'Space Grotesk', sans-serif; color: var(--text-dark); text-transform: uppercase; letter-spacing: 2px; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px; margin-top: 0; font-weight: 900;}
        
        .metrics-bar { display: flex; gap: 15px; margin-bottom: 25px; }
        .metric-card { flex: 1; border-radius: 16px; padding: 20px; text-align: center; border: 3px solid transparent;}
        .metric-bags { background: #fff7ed; border-color: #ffedd5; }
        .metric-weight { background: #ecfdf5; border-color: #d1fae5; }
        .metric-title { display: block; font-size: 14px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px;}
        .metric-value { font-size: 36px; font-weight: 900; font-family: 'Space Grotesk', sans-serif; color: var(--text-dark);}

        .checklist-container { background: #f8fafc; border: 3px solid var(--border-heavy); border-radius: 20px; padding: 20px; margin-bottom: 30px; max-height: 400px; overflow-y: auto;}
        #checklist > div { padding: 20px; margin: 10px 0; border-radius: 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--border-heavy); background: #ffffff; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
        .check-pending { border-left: 10px solid #94a3b8 !important; }
        .check-done { border-color: var(--success-green) !important; background: #ecfdf5 !important; color: #047857; border-left: 10px solid var(--success-green) !important; }
        
        #scan_log { max-height: 250px; overflow-y: auto; background: #ffffff; border: 3px solid #e2e8f0; padding: 15px; border-radius: 16px; }
        .scan-log-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 2px solid #f1f5f9; background: #f8fafc; border-radius: 12px; margin-bottom: 10px; }
        .btn-mini-del { width: auto; margin: 0; background: #ffffff; border: 2px solid #fecaca; color: var(--danger-red); padding: 10px 20px; font-size: 14px; border-radius: 8px; font-weight: 800;}

        #scan_flash { position: fixed; inset: 0; z-index: 9999; display: none; justify-content: center; align-items: center; text-align: center; padding: 40px; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 900; color: white; opacity: 0; transition: opacity 0.2s ease-out; pointer-events: none; text-transform: uppercase;}
        .flash-green { background: rgba(5, 150, 105, 0.95); }
        .flash-red { background: rgba(220, 38, 38, 0.95); }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div>
    <div id="scan_flash"></div>

    <nav class="nav-top">
        <a href="index.html" class="brand"><img src="logo.png" alt="Kilrr" onerror="this.style.display='none'"><span>Factory</span> OS</a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn">Inwarding</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn active">Scanner</a>
            <a href="audit.html" class="nav-btn">Audit</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master Data</a>
            <a href="/api/logout" class="nav-btn logout">Exit</a>
        </div>
    </nav>

    <div class="card" id="setup">
        <h2>Production Setup</h2>
        <div style="background: #fff7ed; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: var(--kilrr-orange); font-weight: 800;">🔊 Note: Click anywhere on this screen once to enable the scanner Audio & Vibration Beeps.</div>
        
        <label>1. Target Flavour Profile</label>
        <div class="custom-dropdown-container"><input type="text" id="fg_select" placeholder="Search Master Recipe..." autocomplete="off"></div>
        
        <div class="setup-row">
            <div style="flex:1;">
                <label>2. Master Lot Code</label>
                <input type="text" id="master_lot" placeholder="e.g. LK-190" autocomplete="off" style="text-transform:uppercase;">
            </div>
            <div style="flex:1;">
                <label>Run / Sub-Batch ID</label>
                <input type="text" id="sub_batch" placeholder="e.g. B1-B2" autocomplete="off" style="text-align:center; font-family:'Space Grotesk', sans-serif; font-size:20px; color:var(--kilrr-orange); text-transform:uppercase;">
            </div>
        </div>

        <label>3. Lead Operator</label>
        <select id="op_name"><option value="" disabled selected>Select authorized personnel...</option><option value="Muaz">Muaz</option><option value="Arbaaz">Arbaaz</option><option value="Rahul">Rahul</option><option value="Amit">Amit</option><option value="Supervisor">Supervisor</option></select>
        
        <button class="btn-primary" onclick="start()">🚀 ENGAGE SYSTEM</button>
    </div>
    
    <div class="card" id="work" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid #e2e8f0; padding-bottom:20px; margin-bottom:35px; flex-wrap: wrap; gap: 15px;">
            <h2 id="title" style="color:var(--kilrr-orange); font-size:36px; border:none; padding:0; margin:0;"></h2>
            <div id="run_badge" style="background:var(--navy-command); color:white; padding:10px 20px; border-radius:12px; font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:900;"></div>
        </div>

        <div class="work-grid">
            <div class="work-left">
                <div class="manual-box">
                    <label style="color:var(--text-dark); font-size: 18px; margin-bottom: 20px;">⚡ POINT & SHOOT SCANNER</label>
                    <div class="hybrid-input-row">
                        <input type="text" id="rm_tag_manual" placeholder="READY..." autocomplete="off">
                        <button class="btn-add-manual" onclick="manualScan()">ADD</button>
                    </div>
                </div>
                
                <div id="reader" style="display:none;"></div>
                <button class="btn-manual" onclick="toggleCamera()" id="camToggleBtn">📷 Activate Mobile Camera Scanner</button>

                <div class="action-row">
                    <button class="btn-lock" onclick="lockAndNext()" style="flex:2; background:var(--success-green); border:3px solid #047857;">✅ LOCK & START NEXT RUN</button>
                    <button class="btn-lock" onclick="lockAndExit()" style="flex:1;">🔒 FINALIZE LOT</button>
                </div>
                <button class="btn-danger" onclick="deleteWholeBatch()">⚠️ Void Current Run</button>
            </div>

            <div class="work-right">
                
                <div class="metrics-bar">
                    <div class="metric-card metric-bags">
                        <span class="metric-title" style="color:var(--kilrr-orange);">Bags Scanned</span>
                        <span class="metric-value" id="metric_bags">0</span>
                    </div>
                    <div class="metric-card metric-weight">
                        <span class="metric-title" style="color:var(--success-green);">KG Issued</span>
                        <span class="metric-value" id="metric_weight">0.00</span>
                    </div>
                </div>

                <h3>Recipe Validation Feed</h3>
                <div class="checklist-container" id="checklist"></div>
                <h3 style="margin-top: 20px;">Live Scan Log</h3>
                <div id="scan_log"></div>
            </div>
        </div>
    </div>
    
    <script>
        let masterLot="", curSub="", curB="", curF="", curOp="", isProcessing=false, localScannedTags=[], html5QrcodeScanner=null;
        
        // 🔥 NEW: Strict Validation Array 🔥
        let validRecipeCodes = [];

        // Audio & Haptic Feedback Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.body.addEventListener('click', () => { if(audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        
        function playFeedback(isSuccess) { 
            if('vibrate' in navigator) {
                if(isSuccess) navigator.vibrate(200);
                else navigator.vibrate([200, 100, 200, 100, 200]);
            }
            try { 
                if(audioCtx.state==='suspended') audioCtx.resume(); 
                const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); 
                osc.connect(gain); gain.connect(audioCtx.destination); 
                if(isSuccess){
                    osc.type='sine'; osc.frequency.value=1000;
                    gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
                    osc.start(); osc.stop(audioCtx.currentTime+0.1);
                } else {
                    osc.type='sawtooth'; osc.frequency.value=150;
                    gain.gain.setValueAtTime(0.1,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
                    osc.start(); osc.stop(audioCtx.currentTime+0.5);
                } 
            } catch(e){} 
        }

        function showFlash(isSuccess, message) {
            const flash = document.getElementById('scan_flash');
            flash.className = isSuccess ? 'flash-green' : 'flash-red';
            flash.innerText = message;
            flash.style.display = 'flex';
            void flash.offsetWidth; 
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => flash.style.display = 'none', 200); }, 600);
        }

        setInterval(() => {
            if(document.getElementById('work').style.display === 'block' && !isProcessing) {
                const manualInput = document.getElementById('rm_tag_manual');
                const activeEl = document.activeElement;
                if(activeEl.tagName !== 'INPUT' && activeEl.tagName !== 'BUTTON' && activeEl.tagName !== 'SELECT') {
                    manualInput.focus();
                }
            }
        }, 1000);
        
        function attachCustomDropdownArray(inputId, stringArray) {
            const inp = document.getElementById(inputId); const list = document.createElement('div'); list.className = 'custom-dropdown-list'; inp.parentNode.appendChild(list); let currentFocus = -1;
            function renderList(filterTxt = "") {
                list.innerHTML = ''; currentFocus = -1; const matches = stringArray.filter(item => item.toLowerCase().includes(filterTxt.toLowerCase()));
                if(matches.length === 0) { list.style.display = 'none'; return; }
                matches.forEach(match => { let div = document.createElement('div'); div.className = 'custom-dropdown-item'; div.innerText = match; div.onclick = () => { inp.value = match; list.style.display = 'none'; }; list.appendChild(div); }); list.style.display = 'block';
            }
            inp.addEventListener('input', function() { renderList(this.value); }); inp.addEventListener('focus', function() { renderList(""); });
            inp.addEventListener('keydown', function(e) { let items = list.getElementsByClassName('custom-dropdown-item'); if (e.key === 'ArrowDown') { e.preventDefault(); currentFocus++; addActive(items); } else if (e.key === 'ArrowUp') { e.preventDefault(); currentFocus--; addActive(items); } else if (e.key === 'Enter') { e.preventDefault(); if (currentFocus > -1 && items.length > 0) { items[currentFocus].click(); } } });
            function addActive(items) { if (!items || items.length === 0) return false; removeActive(items); if (currentFocus >= items.length) currentFocus = 0; if (currentFocus < 0) currentFocus = (items.length - 1); items[currentFocus].classList.add('active-item'); items[currentFocus].scrollIntoView({ block: 'nearest' }); }
            function removeActive(items) { for (let i = 0; i < items.length; i++) items[i].classList.remove('active-item'); }
            document.addEventListener('click', function(e) { if(e.target !== inp) list.style.display = 'none'; });
        }

        window.onload = async () => { 
            const rRes = await fetch('/get-recipes'); const rData = await rRes.json();
            const flavors = [...new Set(rData.map(r=>r.fg_code))].filter(f=>f&&f.trim()!==""); attachCustomDropdownArray('fg_select', flavors);
            
            document.getElementById('rm_tag_manual').addEventListener('keypress', e => {
                if(e.key === 'Enter'){
                    e.preventDefault(); 
                    manualScan();
                }
            }); 
        };
        
        async function start() { 
            if(audioCtx.state==='suspended') audioCtx.resume(); 
            masterLot = document.getElementById('master_lot').value.trim().toUpperCase(); 
            curSub = document.getElementById('sub_batch').value.trim().toUpperCase();
            curF = document.getElementById('fg_select').value.trim(); 
            curOp = document.getElementById('op_name').value; 
            
            if(!masterLot||!curF) return alert("Select Flavour and Master Lot Code!"); 
            if(!curSub) return alert("Enter a Run / Sub-Batch ID!");
            if(!curOp) return alert("Select Lead Operator!"); 
            
            curB = `${masterLot}-${curSub}`;
            
            const bRes = await fetch('/open-batches'); const openBatchesData = await bRes.json();
            const isOpen = openBatchesData.find(b => b.batch_code === curB); 
            
            if(isOpen){ 
                curF = isOpen.fg_code; 
                startScannerUI(); 
            } else { 
                const res = await fetch('/create-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,fg_code:curF,operator_name:curOp})}); 
                const data = await res.json(); 
                if(data.error) return alert("❌ "+data.error); 
                startScannerUI(); 
            } 
        }

        async function startScannerUI() { 
            document.getElementById('setup').style.display='none'; 
            document.getElementById('work').style.display='block'; 
            document.getElementById('title').innerText=`LOT: ${masterLot}`; 
            document.getElementById('run_badge').innerText=`RUN: ${curSub}`; 
            
            // Fetch the recipe rules so the scanner knows what to reject
            const req = await fetch(`/recipe-requirements/${curF}`).then(r=>r.json());
            validRecipeCodes = req.map(i => i.product_code);

            update(); 
            setTimeout(()=>document.getElementById('rm_tag_manual').focus(),500); 
        }

        function toggleCamera() { 
            const rd=document.getElementById('reader'); 
            if(rd.style.display==='none'){ 
                rd.style.display='block'; 
                document.getElementById('camToggleBtn').innerText="🚫 Deactivate Camera"; 
                if(!html5QrcodeScanner){
                    let qrboxFunction = function(vw, vh) { return { width: Math.floor(Math.min(vw, vh) * 0.75), height: Math.floor(Math.min(vw, vh) * 0.75) }; }
                    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: qrboxFunction, videoConstraints: { facingMode: "environment" } }); 
                    html5QrcodeScanner.render(txt => processScannedText(txt));
                } 
            } else { 
                rd.style.display='none'; 
                document.getElementById('camToggleBtn').innerText="📷 Activate Mobile Camera"; 
                document.getElementById('rm_tag_manual').focus(); 
            } 
        }
        
        function manualScan() { 
            let val=document.getElementById('rm_tag_manual').value.trim(); 
            if(!val) return; 
            processScannedText(val); 
        }
        
        async function processScannedText(txt) { 
            if(isProcessing) return; 
            isProcessing=true; 
            
            let cleanTag=txt, parts=txt.split('/'); 
            if(parts.length>=4) cleanTag=`${parts[0]}/${parts[1]}/${parts[2]}/${parts[3]}`; 
            
            // Extract the product code from the barcode (the second segment)
            let pCode = parts.length >= 2 ? parts[1] : cleanTag;
            
            // 🔥 STRICT RECIPE VALIDATION BLOCK 🔥
            if(!validRecipeCodes.includes(pCode)) {
                playFeedback(false); 
                showFlash(false, "❌ WRONG MATERIAL!");
                document.getElementById('rm_tag_manual').value=""; 
                document.getElementById('rm_tag_manual').focus(); 
                setTimeout(()=>isProcessing=false, 1000); 
                return; 
            }

            if(localScannedTags.includes(cleanTag)){ 
                playFeedback(false); 
                showFlash(false, "❌ DUPLICATE");
                document.getElementById('rm_tag_manual').value=""; 
                document.getElementById('rm_tag_manual').focus(); 
                setTimeout(()=>isProcessing=false, 1000); 
                return; 
            } 
            
            await fetch('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,rm_tag:cleanTag})}); 
            playFeedback(true); 
            showFlash(true, "✅ SCANNED");
            
            document.getElementById('rm_tag_manual').value=""; 
            document.getElementById('rm_tag_manual').focus(); 
            update(); 
            setTimeout(()=>isProcessing=false, 300); 
        }
        
        async function update() { 
            const req=await fetch(`/recipe-requirements/${curF}`).then(r=>r.json()); 
            const scans=await fetch(`/current-scans/${curB}`).then(r=>r.json()); 
            
            localScannedTags=scans.map(s=>s.rm_tag); 
            const sCodes=scans.map(s=>s.product_code); 
            
            // Update the new Metrics Dashboard
            let totalWeight = scans.reduce((sum, s) => sum + (parseFloat(s.weight) || 0), 0);
            document.getElementById('metric_bags').innerText = scans.length;
            document.getElementById('metric_weight').innerText = totalWeight.toFixed(2);

            document.getElementById('checklist').innerHTML=req.map(i=>`<div class="${sCodes.includes(i.product_code)?'check-done':'check-pending'}"><span>${i.ingredient_name} <span style="color:#64748b;font-size:14px; font-weight: 700;">(${i.product_code})</span></span><span>${sCodes.includes(i.product_code)?'✅ Validated':'⏳ Pending'}</span></div>`).join(''); 
            
            if(scans.length===0){ 
                document.getElementById('scan_log').innerHTML="<div style='color:#94a3b8;text-align:center;padding:20px;font-weight:800; font-size:16px; border: 2px dashed #cbd5e1; border-radius: 12px;'>Awaiting material scan...</div>"; 
            } else { 
                document.getElementById('scan_log').innerHTML=scans.map(s=>`<div class="scan-log-item"><div><span style="color:#0f172a;font-family:'Space Grotesk',monospace;font-size:18px;font-weight:900; display:block;">${s.rm_tag}</span><span style="color:var(--success-green); font-size:14px; font-weight:800;">${s.weight ? s.weight + ' KG' : 'No Weight Data'}</span></div><button class="btn-mini-del" onclick="deleteSpecificScan('${s.rm_tag}')">🗑️ Void</button></div>`).reverse().join(''); 
            } 
        }

        function deleteSpecificScan(tag) { const pin=prompt("Manager PIN (1234) required:"); if(!pin)return; fetch('/delete-specific-scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,rm_tag:tag,pin})}).then(()=>update()); }
        function deleteWholeBatch() { const pin=prompt(`⚠️ Manager PIN (1234) to void Mixer Run ${curSub}:`); if(!pin)return; fetch('/delete-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,pin})}).then(()=>location.reload()); }
        
        function getNextSubBatchCode(currentCode) {
            const regexPair = /^B(\d+)-B(\d+)$/i;
            const matchPair = currentCode.match(regexPair);
            if (matchPair) {
                const start = parseInt(matchPair[1]);
                const end = parseInt(matchPair[2]);
                const step = end - start + 1; 
                const nextStart = end + 1;
                const nextEnd = nextStart + step - 1;
                return `B${nextStart}-B${nextEnd}`;
            }
            const regexSingle = /^B(\d+)$/i;
            const matchSingle = currentCode.match(regexSingle);
            if (matchSingle) {
                const num = parseInt(matchSingle[1]);
                return `B${num + 1}`;
            }
            return ""; 
        }

        function lockAndNext() { 
            if(!confirm(`Finalize Run: ${curSub} and lock records?`)) return; 
            
            let suggestedNext = getNextSubBatchCode(curSub);
            const nextSub = prompt("Confirm or edit the ID for the NEXT run:", suggestedNext);
            
            if(!nextSub) {
                alert("Next run creation cancelled. You can finalize the lot or start the next run manually from the main menu.");
                return;
            }

            fetch('/lock-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB})})
            .then(() => {
                curSub = nextSub.trim().toUpperCase();
                curB = `${masterLot}-${curSub}`;
                return fetch('/create-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB,fg_code:curF,operator_name:curOp})});
            })
            .then(() => {
                document.getElementById('run_badge').innerText=`RUN: ${curSub}`; 
                document.getElementById('rm_tag_manual').value=''; 
                update(); 
                document.getElementById('rm_tag_manual').focus();
            });
        }

        function lockAndExit() { 
            if(!confirm(`Are you sure you want to finalize the entire ${masterLot} lot?`)) return; 
            fetch('/lock-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_code:curB})}).then(()=>{alert("Lot Finalized!");location.href="index.html";}); 
        }
    </script>
</body>
</html>
