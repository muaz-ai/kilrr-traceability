<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr Factory OS - RM Inwarding</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; }
        
        .nav-top { background: var(--navy-command); border-bottom: 5px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { color: white; text-decoration: none; font-weight: 700; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
        .nav-btn.active { color: var(--kilrr-orange); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 25px;}
        .card { background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; position: relative; overflow: visible;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: var(--kilrr-orange); border-radius: 20px 20px 0 0;}
        .card.card-green::before { background: var(--success-green); }
        
        h2 { margin: 0 0 25px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: var(--navy-command);}
        
        label { font-weight: 800; font-size: 13px; color: #64748b; display: block; margin-bottom: 8px; letter-spacing: 1px;}
        input, select { width: 100%; padding: 18px; box-sizing: border-box; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 20px; background: #fff; transition: 0.2s;}
        input:focus, select:focus { border-color: var(--kilrr-orange); outline: none; box-shadow: 0 0 0 4px rgba(234,88,12,0.1);}
        input[readonly] { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0;}
        
        button.btn-huge { width: 100%; padding: 22px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; background: var(--kilrr-orange); color: white; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);}
        button.btn-success { background: var(--success-green); box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3); }

        .row-inputs { display: flex; gap: 15px; }
        
        /* CUSTOM DROPDOWN UI */
        .custom-dropdown-container { position: relative; width: 100%; margin-bottom: 20px;}
        .custom-dropdown-container input { margin-bottom: 0; }
        .custom-dropdown-list { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #ffffff; border: 2px solid var(--kilrr-orange); border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 9999; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); display: none; padding: 10px; }
        .custom-dropdown-item { padding: 15px 20px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.1s; margin-bottom: 4px; border-bottom: 1px solid #f1f5f9; }
        .custom-dropdown-item:hover { background: #fff7ed; color: var(--kilrr-orange); }

        /* PREVIEW UI */
        .preview-box { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 20px; text-align: center; background: #f8fafc; margin-bottom: 25px;}
        .queue-list { max-height: 150px; overflow-y: auto; padding: 10px; border: 2px solid #e2e8f0; border-radius: 12px; background: #f1f5f9; margin-bottom: 20px;}
        .queue-item { background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-family: monospace; font-weight: bold; border: 1px solid #cbd5e1; font-size: 14px;}

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; }
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; border-top: 4px solid var(--kilrr-orange); justify-content: space-around; overflow-x: auto; white-space: nowrap;}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 5px 10px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 18px; }
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 18px; }
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 18px; }
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 18px; }
            .nav-btn[href="audit.html"]::before { content: "📋"; font-size: 18px; }
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 18px; }
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 18px; }
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn active">Inwarding</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="audit.html" class="nav-btn">Audit</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Material Intake Setup</h2>
            
            <div class="row-inputs">
                <div style="flex:1;">
                    <label>DATE RECEIVED</label>
                    <input type="date" id="date" onchange="generatePreview()">
                </div>
                <div style="flex:1;">
                    <label>NET WT/BAG (KG)</label>
                    <input type="number" id="weight" placeholder="e.g. 25" oninput="generatePreview()">
                </div>
            </div>

            <label>RAW MATERIAL DATABASE</label>
            <div class="custom-dropdown-container">
                <input type="text" id="ing_search" placeholder="Search Material..." autocomplete="off">
                <input type="hidden" id="ing_code"><input type="hidden" id="ing_name">
            </div>

            <label>APPROVED VENDOR</label>
            <div class="custom-dropdown-container">
                <input type="text" id="ven_search" placeholder="Search Vendor..." autocomplete="off">
                <input type="hidden" id="ven_code"><input type="hidden" id="ven_name">
            </div>

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>START ID</label>
                    <input type="number" id="start_no" value="1" oninput="generatePreview()">
                </div>
                <div style="flex:1;">
                    <label>END ID</label>
                    <input type="number" id="end_no" value="1" oninput="generatePreview()">
                </div>
                <div style="flex:1;">
                    <label>TOTAL BAGS</label>
                    <input type="number" id="qty" placeholder="0" readonly>
                </div>
            </div>

            <button class="btn-huge" onclick="stageTags()">➕ STAGE FOR PRINTING</button>
        </div>

        <div class="card card-green">
            <h2 style="color:var(--success-green);">Print Execution Engine</h2>
            
            <label>LIVE LABEL PREVIEW</label>
            <div class="preview-box" id="preview_area">
                <div style="color:#94a3b8; font-weight:800; padding:40px 0;">Awaiting Data Input...</div>
            </div>

            <label>ACTIVE PRINT QUEUE</label>
            <div class="queue-list" id="queue_list">
                <div style="color:#94a3b8; text-align:center; padding:20px;">No labels staged.</div>
            </div>

            <button class="btn-huge btn-success" onclick="executePrint()">🖨️ EXECUTE PRINT SEQUENCE</button>
        </div>
    </div>

    <script>
        let printQueue = [];
        let generatedTagsForPreview = [];

        window.onload = async () => {
            document.getElementById('date').valueAsDate = new Date();
            try {
                const iRes = await fetch('/get-ingredients'); 
                const ingredients = await iRes.json();
                attachCustomDropdown('ing_search', ingredients, 'ingredient_name', 'ingredient_name', 'product_code', 'ing_name', 'ing_code');
                
                const vRes = await fetch('/get-vendors'); 
                const vendors = await vRes.json();
                attachCustomDropdown('ven_search', vendors, 'vendor_name', 'vendor_name', 'vendor_code', 'ven_name', 'ven_code');
            } catch(e) { console.error("Master data fetch failed."); }
            generatePreview();
        };

        function attachCustomDropdown(inputId, dataArray, searchKey, displayKey, codeKey, nameHiddenId, codeHiddenId) {
            const inp = document.getElementById(inputId); 
            const list = document.createElement('div'); 
            list.className = 'custom-dropdown-list'; 
            inp.parentNode.appendChild(list);
            
            function renderList(filterTxt = "") {
                list.innerHTML = ''; 
                const matches = dataArray.filter(item => item[searchKey].toLowerCase().includes(filterTxt.toLowerCase()) || item[codeKey].toLowerCase().includes(filterTxt.toLowerCase()));
                if(matches.length === 0) { list.style.display = 'none'; return; }
                
                matches.forEach(match => { 
                    let div = document.createElement('div'); div.className = 'custom-dropdown-item'; 
                    div.innerHTML = `<strong style="color:var(--kilrr-orange);">${match[codeKey]}</strong> - ${match[displayKey]}`; 
                    div.onclick = () => { 
                        inp.value = match[displayKey]; 
                        document.getElementById(nameHiddenId).value = match[displayKey]; 
                        document.getElementById(codeHiddenId).value = match[codeKey]; 
                        list.style.display = 'none'; 
                        generatePreview();
                    }; 
                    list.appendChild(div); 
                }); 
                list.style.display = 'block';
            }
            inp.addEventListener('input', function() { renderList(this.value); }); 
            inp.addEventListener('focus', function() { renderList(this.value); });
            document.addEventListener('click', function(e) { if(e.target !== inp) list.style.display = 'none'; });
        }

        function generatePreview() {
            const dateVal = document.getElementById('date').value;
            const ingCode = document.getElementById('ing_code').value;
            const ingName = document.getElementById('ing_name').value;
            const venCode = document.getElementById('ven_code').value;
            const weight = document.getElementById('weight').value;
            
            let startNo = parseInt(document.getElementById('start_no').value);
            let endNo = parseInt(document.getElementById('end_no').value);

            // Auto-calculate the locked QTY field
            if(isNaN(startNo) || isNaN(endNo) || endNo < startNo) {
                document.getElementById('qty').value = 0;
            } else {
                document.getElementById('qty').value = (endNo - startNo) + 1;
            }

            if(!dateVal || !ingCode || !venCode || isNaN(startNo) || isNaN(endNo) || endNo < startNo || !weight) {
                document.getElementById('preview_area').innerHTML = `<div style="color:#94a3b8; font-weight:800; padding:40px 0;">Awaiting Valid Data Input...</div>`;
                generatedTagsForPreview = [];
                return;
            }

            const [year, month, day] = dateVal.split('-');
            const dateFmt = `${day}${month}${year}`;
            
            generatedTagsForPreview = [];
            for(let i = startNo; i <= endNo; i++) {
                generatedTagsForPreview.push(`${dateFmt}/${ingCode}/${venCode}/${i}`);
            }

            // Render highly professional preview
            let qr = new QRious({ value: generatedTagsForPreview[0], size: 150, level: 'M' });
            document.getElementById('preview_area').innerHTML = `
                <div style="background:white; padding:15px; border-radius:10px; display:inline-block; border:1px solid #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 250px;">
                    <div style="font-size:12px; font-weight:900; letter-spacing:1px; margin-bottom:5px; text-transform:uppercase; border-bottom: 2px solid #0f172a; padding-bottom: 4px;">KILRR SPICES</div>
                    <div style="font-weight:900; font-size:20px; margin-bottom:5px; text-transform:uppercase; color:var(--kilrr-orange);">${ingName}</div>
                    <div style="font-size:14px; font-weight:bold; background:black; color:white; padding:4px 8px; display:inline-block; margin-bottom:10px; border-radius: 4px;">WT: ${weight} KG</div><br>
                    <img src="${qr.toDataURL()}" style="width:120px; height:120px;"><br>
                    <div style="font-family:monospace; font-weight:bold; margin-top:10px; font-size:14px;">${generatedTagsForPreview[0]}</div>
                </div>
            `;
        }

        function stageTags() {
            if(generatedTagsForPreview.length === 0) return alert("Fill all fields correctly first!");
            
            const dateVal = document.getElementById('date').value;
            const [year, month, day] = dateVal.split('-');
            
            const batchObj = {
                dateRaw: dateVal,
                dateFmt: `${day}${month}${year}`,
                ingCode: document.getElementById('ing_code').value,
                ingName: document.getElementById('ing_name').value,
                venCode: document.getElementById('ven_code').value,
                venName: document.getElementById('ven_name').value,
                weight: document.getElementById('weight').value,
                startNo: parseInt(document.getElementById('start_no').value),
                endNo: parseInt(document.getElementById('end_no').value),
                packs: parseInt(document.getElementById('qty').value)
            };

            printQueue.push(batchObj);
            updateQueueUI();
            
            // Auto increment for the next batch, keep End ID matching Start ID initially
            let nextStart = batchObj.endNo + 1;
            document.getElementById('start_no').value = nextStart;
            document.getElementById('end_no').value = nextStart;
            generatePreview();
        }

        function updateQueueUI() {
            const qList = document.getElementById('queue_list');
            if(printQueue.length === 0) {
                qList.innerHTML = `<div style="color:#94a3b8; text-align:center; padding:20px;">No labels staged.</div>`;
                return;
            }
            qList.innerHTML = printQueue.map((item, index) => `
                <div class="queue-item" style="display:flex; justify-content:space-between; align-items:center;">
                    <div><span style="color:var(--kilrr-orange);">${item.ingCode}</span> | ${item.venCode} | Bags: ${item.startNo} to ${item.endNo}</div>
                    <button style="background:var(--danger-red); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="removeFromQueue(${index})">X</button>
                </div>
            `).join('');
        }

        function removeFromQueue(index) {
            printQueue.splice(index, 1);
            updateQueueUI();
        }

        async function executePrint() {
            if(printQueue.length === 0) return alert("Queue is empty!");

            try {
                const res = await fetch('/log-inwarding', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ queue: printQueue })
                });
                
                const data = await res.json();
                if(data.error) return alert("Database Error: " + data.error);

                // RESTORED: Professional FSSAI 75x75mm Print Layout
                let printWindow = window.open('', '_blank');
                let html = `<html><head><style>
                    @page { size: 75mm 75mm; margin: 0; }
                    body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; text-align: center; color: black; background: white; }
                    .page { width: 75mm; height: 75mm; box-sizing: border-box; padding: 4mm; page-break-after: always; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
                    .brand { font-size: 16px; font-weight: 900; letter-spacing: 1px; margin-bottom: 2mm; text-transform: uppercase; border-bottom: 2px solid black; padding-bottom: 2px;}
                    h2 { margin: 0 0 2mm 0; font-size: 20px; text-transform: uppercase; font-weight: 900; line-height: 1.1; }
                    .codes { font-size: 12px; font-weight: bold; background: black; color: white; padding: 3px 8px; border-radius: 4px; margin-bottom: 2mm;}
                    img { width: 34mm; height: 34mm; margin-bottom: 2mm; }
                    .bc-text { font-size: 13px; font-weight: 900; font-family: monospace; margin-bottom: 2mm;}
                    .details { font-size: 12px; font-weight: bold; }
                </style></head><body>`;

                printQueue.forEach(item => {
                    for(let i = item.startNo; i <= item.endNo; i++) {
                        let tagStr = `${item.dateFmt}/${item.ingCode}/${item.venCode}/${i}`;
                        let qrEngine = new QRious({ value: tagStr, size: 250, level: 'M' });
                        let dispDate = `${item.dateRaw.split('-')[2]}/${item.dateRaw.split('-')[1]}/${item.dateRaw.split('-')[0]}`;
                        
                        html += `
                        <div class="page">
                            <div class="brand">KILRR SPICES</div>
                            <h2>${item.ingName}</h2>
                            <div class="codes">V: ${item.venCode} | WT: ${item.weight} KG</div>
                            <img src="${qrEngine.toDataURL()}">
                            <div class="bc-text">${tagStr}</div>
                            <div class="details">Inward Date: ${dispDate}</div>
                        </div>`;
                    }
                });

                html += `</body><script>window.onload = () => { window.print(); window.close(); };<\/script></html>`;
                printWindow.document.write(html);
                printWindow.document.close();

                printQueue = [];
                updateQueueUI();

            } catch(e) { alert("Execution Failed. Check server connection."); }
        }
    </script>
</body>
</html>
