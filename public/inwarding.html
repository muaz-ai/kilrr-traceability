<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kilrr OS - Inwarding Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --kilrr-orange: #ea580c; --navy-command: #0b1121; --success-green: #059669; --danger-red: #dc2626; --card-bg: #ffffff; --accent-blue: #2563eb; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; padding-bottom: 100px; min-height: 100vh;}
        
        .nav-top { background: var(--navy-command); border-bottom: 4px solid var(--kilrr-orange); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .brand { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 900; color: white; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;}
        .brand span { color: var(--kilrr-orange); }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { color: #cbd5e1; text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase; transition: 0.2s; padding: 8px 12px; border-radius: 8px;}
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: white;}
        .nav-btn.active { color: white; background: var(--kilrr-orange);}
        
        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
        
        .card { background: var(--card-bg); border-radius: 16px; padding: 35px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; position: relative; margin-bottom: 30px;}
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #3b82f6, #2563eb); border-radius: 16px 16px 0 0;}
        .card.card-green::before { background: linear-gradient(90deg, var(--success-green), #10b981); }
        
        h2 { margin: 0 0 5px 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; text-transform: uppercase; color: var(--navy-command); letter-spacing: 0.5px;}
        .marathi-title { font-family: 'Inter', sans-serif; color: var(--accent-blue); font-size: 14px; font-weight: 800; display: block; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px;}
        .marathi-title.green-title { color: var(--success-green); }
        
        label { font-weight: 800; font-size: 13px; color: var(--navy-command); display: block; margin-bottom: 8px; text-transform: uppercase;}
        label span.sub { color: #64748b; font-size: 11px; font-weight: 700; display: block; margin-top: 2px;}

        input, select { width: 100%; padding: 16px 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; margin-bottom: 20px; background: #f8fafc; color: #0f172a; transition: 0.2s ease;}
        input:focus, select:focus { border-color: var(--accent-blue); outline: none; background: #ffffff; box-shadow: 0 0 0 4px rgba(59,130,246,0.15);}

        button.btn-huge { width: 100%; padding: 20px; border: none; border-radius: 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; background: linear-gradient(135deg, #059669, #047857); color: white; box-shadow: 0 8px 15px rgba(5, 150, 105, 0.3); transition: transform 0.1s;}
        button.btn-huge:active { transform: translateY(2px); }

        .row-inputs { display: flex; gap: 15px; }

        @media (max-width: 1024px) { 
            .container { grid-template-columns: 1fr; margin-top: 15px; gap: 20px;}
            .nav-top { position: fixed; bottom: 0; top: auto; width: 100%; padding: 10px 0; justify-content: space-around; overflow-x: auto; white-space: nowrap; border-top: 3px solid var(--kilrr-orange);}
            .brand { display: none; }
            .nav-btn { display: flex; flex-direction: column; align-items: center; font-size: 11px; padding: 8px 12px;}
            .nav-btn[href="index.html"]::before { content: "🏠"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="inwarding.html"]::before { content: "📦"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="preprocess.html"]::before { content: "🔥"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="scanner.html"]::before { content: "📷"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="dashboard.html"]::before { content: "📊"; font-size: 20px; margin-bottom: 4px;}
            .nav-btn[href="master.html"]::before { content: "⚙️"; font-size: 20px; margin-bottom: 4px;}
            .card { padding: 20px;}
            .row-inputs { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

    <nav class="nav-top">
        <a href="index.html" class="brand">Kilrr <span>OS</span></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Hub</a>
            <a href="inwarding.html" class="nav-btn active">Inward</a>
            <a href="preprocess.html" class="nav-btn">Pre-Process</a>
            <a href="scanner.html" class="nav-btn">Scanner</a>
            <a href="dashboard.html" class="nav-btn">Dashboard</a>
            <a href="master.html" class="nav-btn">Master</a>
        </div>
    </nav>

    <div class="container">
        <!-- Native Datalists for clean dropdowns without breaking UI -->
        <datalist id="vendor_list"></datalist>
        <datalist id="ingredient_list"></datalist>

        <div class="card">
            <h2>Raw Material Inwarding</h2>
            <span class="marathi-title">कच्चा माल नोंदणी (Warehouse Entry)</span>
            
            <div class="row-inputs">
                <div style="flex:1;">
                    <label>तारीख <span class="sub">1. DATE RECEIVED</span></label>
                    <input type="date" id="date">
                </div>
                <div style="flex:2;">
                    <label style="color:var(--accent-blue);">कोणाकडून माल आला? <span class="sub">2. VENDOR NAME</span></label>
                    <input type="text" id="ven_search" list="vendor_list" placeholder="Type Vendor Name..." autocomplete="off">
                </div>
            </div>

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>वेंडर कोड <span class="sub">VENDOR SHORT CODE</span></label>
                    <input type="text" id="ven_code" placeholder="E.g. V-01" style="text-transform: uppercase;">
                </div>
                <div style="flex:2;">
                    <label style="color:var(--accent-blue);">कोणता माल आला? <span class="sub">3. MATERIAL NAME</span></label>
                    <input type="text" id="ing_search" list="ingredient_list" placeholder="Type Material Name..." autocomplete="off">
                </div>
            </div>

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>प्रॉडक्ट कोड <span class="sub">MATERIAL SHORT CODE</span></label>
                    <input type="text" id="ing_code" placeholder="E.g. JRA" style="text-transform: uppercase;">
                </div>
            </div>
        </div>

        <div class="card card-green">
            <h2 style="color:var(--success-green);">Bag & Weight Details</h2>
            <span class="marathi-title green-title">गोण्या आणि वजन</span>

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>पहिली गोणी <span class="sub">START BAG NO.</span></label>
                    <input type="text" inputmode="numeric" id="start_no" value="1">
                </div>
                <div style="flex:1;">
                    <label>शेवटची गोणी <span class="sub">END BAG NO.</span></label>
                    <input type="text" inputmode="numeric" id="end_no" value="1">
                </div>
            </div>

            <div class="row-inputs">
                <div style="flex:1;">
                    <label>वजन (KG) <span class="sub">WEIGHT PER BAG</span></label>
                    <input type="text" inputmode="decimal" id="weight" placeholder="e.g. 25">
                </div>
                <div style="flex:1;">
                    <label>एकूण पाकिटे <span class="sub">PACKS PER BAG (OPTIONAL)</span></label>
                    <input type="text" inputmode="numeric" id="packs" placeholder="e.g. 50">
                </div>
            </div>

            <button class="btn-huge" onclick="generateAndPrint()" style="margin-top: 15px;">🖨️ जनरेट आणि प्रिंट करा (GENERATE INWARD TAGS)</button>
        </div>
    </div>

    <script>
        window.onload = async () => {
            document.getElementById('date').valueAsDate = new Date();
            
            // Load native datalists quietly
            try {
                const venRes = await fetch('/get-vendors');
                const ingRes = await fetch('/get-ingredients');
                const venData = await venRes.json();
                const ingData = await ingRes.json();

                if(Array.isArray(venData)) {
                    document.getElementById('vendor_list').innerHTML = venData.map(v => `<option value="${v.vendor_name}">`).join('');
                }
                if(Array.isArray(ingData)) {
                    document.getElementById('ingredient_list').innerHTML = ingData.map(i => `<option value="${i.ingredient_name}">`).join('');
                }
            } catch(e) { console.error("Could not load datalists"); }
        };

        async function generateAndPrint() {
            const dateVal = document.getElementById('date').value;
            const venName = document.getElementById('ven_search').value.trim().toUpperCase();
            const venCode = document.getElementById('ven_code').value.trim().toUpperCase();
            const ingName = document.getElementById('ing_search').value.trim().toUpperCase();
            const ingCode = document.getElementById('ing_code').value.trim().toUpperCase();
            
            let startNo = parseInt(document.getElementById('start_no').value.replace(/[^0-9]/g, ''));
            let endNo = parseInt(document.getElementById('end_no').value.replace(/[^0-9]/g, ''));
            const weightRaw = document.getElementById('weight').value.replace(/[^0-9.]/g, '');
            const packsRaw = document.getElementById('packs').value.replace(/[^0-9]/g, '');

            if(!dateVal) return alert("⚠️ Date is missing! Please select a Date.");
            if(!venName || !venCode) return alert("⚠️ Please fill Vendor Details.");
            if(!ingName || !ingCode) return alert("⚠️ Please fill Material Details.");
            if(isNaN(startNo) || isNaN(endNo) || startNo > endNo) return alert("⚠️ Please enter correct Start and End Bag numbers.");
            if(!weightRaw) return alert("⚠️ Please enter the Weight per bag.");

            const [year, month, day] = dateVal.split('-');
            const dateFmt = `${day}${month}`;
            const dispDate = `${day}/${month}/${year}`;
            
            const weightText = `NET WT: ${String(weightRaw).padStart(2, '0')} KG`;

            let queue = [];
            for(let i = startNo; i <= endNo; i++) {
                queue.push({
                    dateRaw: dateVal,
                    ingCode: ingCode,
                    ingName: ingName,
                    venCode: venCode,
                    venName: venName,
                    weight: weightRaw,
                    startNo: i,
                    endNo: i,
                    packs: packsRaw || null,
                    tagStr: `${dateFmt}/${ingCode}/${venCode}/${i}`
                });
            }

            let printWindow = window.open('', '_blank');
            if(!printWindow) return alert("⚠️ Popup Blocked! Allow popups to print.");

            try {
                printWindow.document.write('<html><body style="background:#f8fafc;"><h2 style="font-family:sans-serif; text-align:center; margin-top:50px; color:#059669;">Logging Inward to Database...</h2></body></html>');

                const res = await fetch('/log-inwarding', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ queue: queue })
                });
                
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                // 🔥 THE EXACT FORMAT: Name & Date Black BG, Weight Normal, No Vendor Name 🔥
                // ADDED 'print-color-adjust: exact' to force browsers to print the black backgrounds!
                let html = `<html><head><style>
                    @media print {
                        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
                    }
                    @page { size: 75mm 75mm; margin: 0; }
                    body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: black; background: white; text-align: center; }
                    
                    .label { width: 73mm; height: 73mm; box-sizing: border-box; padding: 2mm; margin: 0 auto; page-break-after: always; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow: hidden; border: 1px dashed #ccc;}
                    
                    /* Name: Black Background, White Text */
                    .title-bar { background-color: black !important; color: white !important; width: 100%; padding: 3mm 0; font-size: 20px; font-weight: 900; text-transform: uppercase; margin: 0; text-align: center; line-height: 1.1; }
                    
                    /* Middle Section */
                    .qr-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; margin-top: 1mm;}
                    .qr-image { width: 34mm; height: 34mm; margin-bottom: 1mm; }
                    
                    /* Date: Black Background, White Text */
                    .date-bar { background-color: black !important; color: white !important; padding: 2px 10px; font-size: 14px; font-weight: 900; text-transform: uppercase; margin: 1mm 0; line-height: 1.2; display: inline-block; }
                    
                    .tag-string { font-size: 14px; font-weight: 900; font-family: monospace; margin: 1mm 0 2mm 0; line-height: 1; }
                    
                    /* Bottom Weight: White Background, Thick Black Lines */
                    .weight-bar { font-size: 24px; font-weight: 900; padding: 2mm 0; margin: 0; border-top: 3px solid black; border-bottom: 3px solid black; width: 100%; text-align: center; line-height: 1; }
                </style></head><body>`;

                queue.forEach(item => {
                    let qrEngine = new QRious({ value: item.tagStr, size: 250, level: 'M' });
                    html += `
                    <div class="label">
                        <div class="title-bar">${item.ingName}</div>
                        
                        <div class="qr-container">
                            <img class="qr-image" src="${qrEngine.toDataURL()}">
                            <div class="date-bar">DATE: ${dispDate}</div>
                            <div class="tag-string">${item.tagStr}</div>
                        </div>
                        
                        <div class="weight-bar">${weightText}</div>
                    </div>`;
                });

                html += `</body><script>window.onload = () => { window.print(); window.close(); };<\/script></html>`;
                
                printWindow.document.open(); 
                printWindow.document.write(html);
                printWindow.document.close();

                // Reset form for next batch
                document.getElementById('start_no').value = endNo + 1;
                document.getElementById('end_no').value = endNo + 1;

            } catch(e) { 
                printWindow.close();
                alert("Database Error: " + e.message); 
            }
        }
    </script>
</body>
</html>
